// ---- Cubic ease interpolators (artboard objects 47..52) -------------------
function cubicEase(x1, y1, x2, y2) {
  const A = (a1, a2) => 1 - 3*a2 + 3*a1, B = (a1, a2) => 3*a2 - 6*a1, C = a1 => 3*a1;
  const calc = (t, a1, a2) => ((A(a1, a2)*t + B(a1, a2))*t + C(a1))*t;
  const slope = (t, a1, a2) => 3*A(a1, a2)*t*t + 2*B(a1, a2)*t + C(a1);
  const tForX = (x) => {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const s = slope(t, x1, x2);
      if (Math.abs(s) < 1e-7) break;
      const cx = calc(t, x1, x2) - x;
      t -= cx / s;
    }
    if (t >= 0 && t <= 1 && Math.abs(calc(t, x1, x2) - x) < 1e-6) return t;
    let lo = 0, hi = 1; t = x;
    for (let i = 0; i < 40; i++) {
      const cx = calc(t, x1, x2);
      if (Math.abs(cx - x) < 1e-7) break;
      if (cx < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return t;
  };
  return x => (x <= 0 ? 0 : x >= 1 ? 1 : calc(tForX(x), y1, y2));
}

  click: { pose: [128.0432, 124.8925] },

  // pingPong over work area 0..41 frames; keys at 0 and 40 (cubic I47)
  idle:  { start: 0, end: 41 / FPS, k0: [61.40538, 61.41263], k1: [128.0432, 124.6181], kt: 40 / FPS },
};
function sample(state, inst, b) {
  const a = ANIMS[state];
  if (a.pose) return a.pose;
  // ping-pong on the shared clock, shifted by this key's place on the diagonal
  const p = ((LAB.clock - LAB.spread * b.off * IDLE_PERIOD) % IDLE_PERIOD + IDLE_PERIOD) % IDLE_PERIOD;
  const t = p <= a.end ? p : IDLE_PERIOD - p;
  if (LAB.amt < 1) {
    const q = t <= 0 ? 0 : t >= a.kt ? 1 : I47(t / a.kt), f = q * LAB.amt;
    return [a.k0[0] + (a.k1[0] - a.k0[0]) * f, a.k0[1] + (a.k1[1] - a.k0[1]) * f];
  }
  if (t <= 0) return a.k0;
  if (t >= a.kt) return a.k1;
  const f = I47(t / a.kt);
  return [a.k0[0] + (a.k1[0] - a.k0[0]) * f, a.k0[1] + (a.k1[1] - a.k0[1]) * f];
}
function advanceAnim(state, inst, dt) {
  if (state !== "idle") { inst.time += dt; return; }
  const a = ANIMS.idle;
  inst.time += dt * inst.dir;
  for (let g = 0; g < 8; g++) {
    if (inst.dir > 0 && inst.time >= a.end) { inst.time = a.end - (inst.time - a.end); inst.dir = -1; }
    else if (inst.dir < 0 && inst.time <= a.start) { inst.time = a.start + (a.start - inst.time); inst.dir = 1; }
    else break;
  }
}

const TRANSITIONS = {
  idle:  [{ to: "hower", ok: s => s.hower, dur: 0.07, ease: I48 }],
  hower: [{ to: "idle", ok: s => !s.hower, dur: 0.30, ease: I49 },
          { to: "click", ok: s => s.click, dur: 0.05, ease: I50 }],
  click: [{ to: "hower", ok: s => !s.click && s.hower, dur: 0.25, ease: I51 },
          { to: "idle", ok: s => !s.click && !s.hower, dur: 0.25, ease: I52 }],
};

class Button {
  constructor([x, y, sx, sy]) {
    this.world = [sx, 0, 0, sy, x, y];
    this.inv = inv(this.world);
    this.click = false; this.hower = false; this.over = false;
    this.state = "idle"; this.inst = { time: 0, dir: 1 };
    this.from = null; this.fromInst = null; this.trans = null; this.mix = 1; this.mixFrom = 1;
    this.reset = null;
    this.face = [61.4054, FACE_NODE_Y0]; this.off = 0;
    this.apply();
  }
  changeState(tr) {
    const interrupted = this.trans && this.mix < 1;
    this.reset = this.face.slice();           // values the new mix starts from
    this.from = this.state; this.fromInst = this.inst;
    this.mixFrom = interrupted ? 0 : this.mix;
    this.state = tr.to; this.inst = { time: 0, dir: 1 };
    this.trans = tr; this.mix = 0;
  }
  tryChange() {
    for (const tr of TRANSITIONS[this.state]) if (tr.ok(this)) { this.changeState(tr); return true; }
    return false;
  }
  advance(dt) {
    advanceAnim(this.state, this.inst, dt);
    if (this.from && this.mix < 1) advanceAnim(this.from, this.fromInst, dt);
    if (this.trans && this.mix < 1) this.mix = Math.min(1, this.mix + dt / this.trans.dur);
    for (let i = 0; i < 100 && this.tryChange(); i++) {}
    this.apply();
  }
  apply() {
    let v = this.face;
    if (this.trans && this.mix < 1) {
      v = this.reset.slice();
      if (this.mixFrom > 0) {
        const f = this.trans.ease(this.mixFrom), p = sample(this.from, this.fromInst, this);
        v = [v[0] + (p[0] - v[0]) * f, v[1] + (p[1] - v[1]) * f];
      }
      const m = this.trans.ease(this.mix), p = sample(this.state, this.inst, this);
      v = [v[0] + (p[0] - v[0]) * m, v[1] + (p[1] - v[1]) * m];
    } else {
      v = sample(this.state, this.inst, this).slice();
    }
    this.face = v;
  }
  // Listeners on "hitbox": enter -> hower=true, exit -> hower=false,
  // down -> click=true, up -> click=false
  hit(px, py) {
    const [x, y] = app(this.inv, px, py), P = HITBOX_POLY;
    let w = 0;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const [xi, yi] = P[i], [xj, yj] = P[j];
      if (yj <= y) { if (yi > y && (xi - xj) * (y - yj) - (x - xj) * (yi - yj) > 0) w++; }
      else if (yi <= y && (xi - xj) * (y - yj) - (x - xj) * (yi - yj) < 0) w--;
    }
    return w !== 0;
  }
  pointer(type, px, py) {
    const over = px !== null && this.hit(px, py);
    if (over !== this.over) { this.over = over; this.hower = over; }
    if (type === "down" && over) this.click = true;
    if (type === "up" && over) this.click = false;
    for (let i = 0; i < 100 && this.tryChange(); i++) {}
  }
  draw(ctx) {
    const faceNode = trs(this.face[0], this.face[1]);
    const faceBone = mul(mul(faceNode, FACE_BONE_LOCAL), FACE_INV_BIND);
    ctx.save();
    ctx.transform(...this.world);
    // extrusion ("extruyen") — drawn first (bottom)
    ctx.beginPath();
    EXT_SKINNED_LOCAL.forEach(([p, b], i) => {
      const q = b === 2 ? EXT_STATIC[i] : app(faceBone, p[0], p[1]);
      i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
    });
    ctx.closePath();
    ctx.fillStyle = C_EXT; ctx.fill("nonzero");
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = C_EXT; ctx.stroke();
    // face
    const fm = mul(faceNode, FACE_SHAPE_LOCAL);
    ctx.beginPath();
    SQUARE.forEach((p, i) => { const q = app(fm, p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath();
    ctx.fillStyle = C_FACE_FILL; ctx.fill("nonzero");
    ctx.strokeStyle = C_FACE_STROKE; ctx.stroke();
    // hitbox: fill alpha 0, strokes hidden -> nothing visible
    ctx.restore();
  }
}

const buttons = NESTED.map(n => new Button(n));
{
  const d = buttons.map(b => b.world[4] + b.world[5]), lo = Math.min(...d), hi = Math.max(...d);
  buttons.forEach((b, i) => { b.off = (d[i] - lo) / (hi - lo); });
}
// ---- Press waves: each key is pressed and released in turn, on the scene clock
const queue = [];
function wave(dir) {
  const xs = buttons.map(b => b.world[4]), lo = Math.min(...xs), hi = Math.max(...xs);
  for (const b of buttons) {
    const u = (b.world[4] - lo) / (hi - lo), at = LAB.clock + 0.9 * (dir > 0 ? u : 1 - u);
    queue.push({ at, b, down: true }, { at: at + 0.16, b, down: false });
  }
  queue.sort((a, c) => a.at - c.at);
}
function runQueue() {
  while (queue.length && queue[0].at <= LAB.clock) {
    const { b, down } = queue.shift();
    if (down) { b.hower = true; b.click = true; }
    else { b.click = false; b.hower = b.over; }
    for (let i = 0; i < 100 && b.tryChange(); i++) {}
  }
}
window.__keys = { buttons, wave, queue, LAB };
// Rive draws the first drawable in the hierarchy on top, so paint in reverse.
const drawOrder = buttons.slice().reverse();

// ---- Canvas, layout (Fit.contain, Alignment.center) -----------------------
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let view = [1, 0, 0, 1, 0, 0], viewInv = view;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const s = Math.min(w / MAIN_W, h / MAIN_H);
  view = [s, 0, 0, s, (w - MAIN_W * s) / 2, (h - MAIN_H * s) / 2];
  viewInv = inv(view);
}
window.addEventListener("resize", resize); resize();

function toArtboard(e) {
  const r = canvas.getBoundingClientRect();
  return app(viewInv, e.clientX - r.left, e.clientY - r.top);
}
function dispatch(type, p) {
  // Points outside the main artboard are clipped away.
  const inside = p && p[0] >= 0 && p[1] >= 0 && p[0] <= MAIN_W && p[1] <= MAIN_H;
  for (const b of buttons) b.pointer(type, inside ? p[0] : null, inside ? p[1] : null);
}
canvas.addEventListener("pointermove", e => dispatch("move", toArtboard(e)));
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture?.(e.pointerId); dispatch("down", toArtboard(e)); });
canvas.addEventListener("pointerup", e => dispatch("up", toArtboard(e)));
canvas.addEventListener("pointercancel", () => dispatch("up", null));
canvas.addEventListener("pointerleave", () => dispatch("move", null));

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000) * LAB.speed; last = now;
  LAB.clock += dt;
  LAB.amt += ((LAB.breathe ? 1 : 0) - LAB.amt) * Math.min(1, dt * 6);
  if (Math.abs(LAB.amt - (LAB.breathe ? 1 : 0)) < 1e-3) LAB.amt = LAB.breathe ? 1 : 0;
  runQueue();
  for (const b of buttons) b.advance(dt);
  const dpr = canvas.width / canvas.clientWidth;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.transform(...view);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, MAIN_W, MAIN_H); ctx.clip();
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, MAIN_W, MAIN_H);
  for (const b of drawOrder) b.draw(ctx);
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
/* ------------------------------------------------------------------
     Lab hooks (InstaLanding Motion). The letter works on its own; when it
     is framed, the lab drives it with postMessage and it reports what the
     keys are doing.
       { source: 'il-motion', type: 'speed', value: 0.25 }   the scene clock (breath, transitions, waves)
       { ..., type: 'step', value: 1 | -1 }    a press wave, left to right (1) or right to left (-1)
       { ..., type: 'spread', value: 0 }       offsets each key's breath along the diagonal, 0..1
       { ..., type: 'breathe', value: true }   the idle in-and-out breath
       { ..., type: 'autoplay', value: true }  alternating press waves every few seconds
  ------------------------------------------------------------------ */
(function () {
  const K = window.__keys;
  if (!K) return;
  let auto = 0, dir = 1;
  const autoplay = (on, ms = 2600) => {
    clearInterval(auto);
    if (on) {
      K.wave(dir); dir = -dir;
      auto = setInterval(() => { if (!document.hidden) { K.wave(dir); dir = -dir; } }, ms / Math.max(K.LAB.speed, 0.25));
    }
  };
  const qs = new URLSearchParams(location.search);
  if (qs.has('autoplay')) autoplay(true, Number(qs.get('autoplay')) || 2600);
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion') return;
    if (d.type === 'speed') K.LAB.speed = Math.max(0.05, Number(d.value) || 1);
    if (d.type === 'step') { clearInterval(auto); K.wave(d.value > 0 ? 1 : -1); }
    if (d.type === 'spread') K.LAB.spread = Math.min(1, Math.max(0, Number(d.value) || 0));
    if (d.type === 'breathe') K.LAB.breathe = Boolean(d.value);
    if (d.type === 'autoplay') autoplay(Boolean(d.value));
  });
  // a press on the letter takes over from autoplay
  document.getElementById('c').addEventListener('pointerdown', () => clearInterval(auto));
  if (parent !== window) {
    let lastText = '';
    const report = () => {
      const pressed = K.buttons.filter(b => b.state === 'click').length;
      const raised = K.buttons.filter(b => b.state === 'hower').length;
      const text = K.queue.length ? `PRESS WAVE · ${pressed + raised} KEYS MOVING`
        : pressed ? `${pressed} KEY${pressed > 1 ? 'S' : ''} PRESSED`
        : raised ? `${raised} KEY${raised > 1 ? 'S' : ''} RAISED`
        : `229 KEYS · ${K.LAB.breathe ? (K.LAB.spread > 0 ? 'BREATHING IN A WAVE' : 'BREATHING IN UNISON') : 'AT REST'}`;
      if (text !== lastText) { lastText = text; parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, '*'); }
      setTimeout(() => requestAnimationFrame(report), 120);
    };
    requestAnimationFrame(report);
  }
})();
</script>
