        this.mixDuration = mixTime(tr, this.from.state);
        this.mix = this.mixDuration > 0 ? 0 : 1;
        this.holdFrom = !!(tr.flags & 16);
        return true;
      }
    }
    return false;
  }
  apply() {
    if (this.from && this.mix < 1) this.from.apply(1);
    this.current.apply(this.mix);
  }
  advance(seconds) {
    this.current.advance(seconds);
    if (this.transition && this.from && this.mixDuration > 0) {
      this.mix = Math.min(1, Math.max(0, this.mix + seconds / this.mixDuration));
    } else this.mix = 1;
    if (this.from && this.mix < 1 && !this.holdFrom) this.from.advance(seconds);
    this.apply();
    for (let i = 0; i < 100 && this.tryChange(); i++) this.apply();
  }
}
const layers = stateMachine.layers.map((l) => new LayerInstance(l));

// ---------------------------------------------------------------- listeners
const hitCanvas = document.createElement('canvas').getContext('2d');
for (const l of stateMachine.listeners) {
  const target = byId(l.targetId);
  l.hitShapes = shapes.filter((s) => isDescendantOrSelf(s, target));
  l.hovered = false;
}
function hitTest(l, x, y) {
  for (const s of l.hitShapes) if (hitCanvas.isPointInPath(shapePath(s, IDENTITY), x, y)) return true;
  return false;
}
function performActions(l, pos) {
  for (const a of l.actions) {
    if (a.type === 'ListenerBoolChange') {
      const inp = inputs[a.inputId];
      inp.value = a.value === 2 ? !inp.value : a.value === 1;
    } else if (a.type === 'ListenerAlignTarget') {
      if (window.__LAB && window.__LAB.follow === false) continue;
      const t = byId(a.targetId);
      const local = apply(invert(world(t.parent)), pos[0], pos[1]);
      if (a.preserveOffset && l.prevPos) {
        const prev = apply(invert(world(t.parent)), l.prevPos[0], l.prevPos[1]);
        t.x += local[0] - prev[0]; t.y += local[1] - prev[1];
      } else { t.x = local[0]; t.y = local[1]; }
    }
  }
}
let lastPointer = null;
function pointerEvent(kind, pos) {
  // kind: 'move' | 'down' | 'up' | 'exit'
  for (const l of stateMachine.listeners) {
    const hit = kind !== 'exit' && pos && hitTest(l, pos[0], pos[1]);
    const type = l.listenerTypeValue;
    const wasHovered = l.hovered;
    l.hovered = hit;
    if (hit && !wasHovered && type === 0) performActions(l, pos);
    else if (!hit && wasHovered && type === 1) performActions(l, pos || lastPointer || [0, 0]);
    if (hit) {
      if ((type === 4 && kind === 'move') || (type === 2 && kind === 'down') || (type === 3 && kind === 'up')) performActions(l, pos);
    }
    l.prevPos = pos;
  }
  if (pos) lastPointer = pos;
}

// ---------------------------------------------------------------- joystick
function applyJoystick() {
  if (!joystick) return;
  let m = [1, 0, 0, 1, joystick.posX, joystick.posY];
  if (joystick.parent && joystick.parent.world) m = mul(joystick.parent.world, m);
  const handle = byId(joystick.handleSourceId);
  if (handle) {
    const hw = world(handle);
    const pos = apply(invert(m), hw[4], hw[5]);
    const left = -joystick.width * joystick.originX, top = -joystick.height * joystick.originY;
    joystick.x = joystick.width === 0 ? 0 : (pos[0] - left) * 2 / joystick.width - 1;
    joystick.y = joystick.height === 0 ? 0 : (pos[1] - top) * 2 / joystick.height - 1;
  }
  const xa = animations[joystick.xId], ya = animations[joystick.yId];
  if (xa) applyAnimation(xa, (((joystick.joystickFlags & 1) ? -joystick.x : joystick.x) + 1) / 2 * animDuration(xa), 1);
  if (ya) applyAnimation(ya, (((joystick.joystickFlags & 2) ? -joystick.y : joystick.y) + 1) / 2 * animDuration(ya), 1);
}

// ---------------------------------------------------------------- title
// "INSTALANDING" is parented to the arrow's bobbing node, so it bobs, squashes and
// dives into the hole with the arrow. It reuses the arrow's paints: purple outline
// (#642488), purple extrusion (#7b40a9 -> #5f2474), front gradient (#8a23db -> #ffc668)
// and the arrow's own feathered cream shine sweep.
const TITLE = 'INSTALANDING';
const TITLE_SIZE = 31, TITLE_TRACKING = 1.2, TITLE_GAP = 16;
const EXTRUDE = { steps: 6, dx: -0.9, dy: 0.75 };
const arrowNode = byId(432);     // inner arrow node (keyed by ArrowIdle / ArrowGoingDown)
const arrowOutline = byId(434);  // arrow back silhouette, carries the hole clip
const arrowFront = byId(459);    // arrow front face (gradient)
const arrowShine = byId(452);    // arrow shine sweep
const outlinePaint = arrowOutline.paints[0].mutator.colorValue;
const frontGradient = arrowFront.paints[0].mutator;
const shinePaint = arrowShine.paints[0];
let titleLayout = null;
const DIVE = (() => {
  const anim = animations.find((a) => a.name === 'ArrowGoingDown');
  const ko = anim.keyedObjects.find((k) => k.objectId === arrowNode.parent.id);
  const fr = ko.props.find((p) => p.name === 'y').frames;
  return { rest: fr[0].value, down: fr[fr.length - 1].value, sink: 90 };
})();

function localBounds(shape, node) {
  const inv = invert(node.world);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const path of shape.paths) {
    const m = mul(inv, path.world);
    for (const c of pathCommands(path)) {
      for (let i = 1; i < c.length; i += 2) {
        const [x, y] = apply(m, c[i], c[i + 1]);
        x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
      }
    }
  }
  return { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
}

function layoutTitle(ctx) {
  // Measured once, at rest pose, in the arrow node's local space.
  updateWorld();
  const arrow = localBounds(arrowOutline, arrowNode);
  const front = localBounds(arrowFront, arrowNode);
  ctx.save();
  ctx.font = `700 ${TITLE_SIZE}px Instalanding, sans-serif`;
  const glyphs = [...TITLE].map((ch) => ({ ch, w: ctx.measureText(ch).width }));
  const metrics = ctx.measureText(TITLE);
  ctx.restore();
  const width = glyphs.reduce((s, g) => s + g.w, 0) + TITLE_TRACKING * (glyphs.length - 1);
  const capH = metrics.actualBoundingBoxAscent || TITLE_SIZE * 0.7;
  const baseline = arrow.y0 - TITLE_GAP;
  let x = arrow.cx - width / 2 + EXTRUDE.steps * -EXTRUDE.dx / 2;
  for (const g of glyphs) { g.x = x; x += g.w + TITLE_TRACKING; }
  return { glyphs, width, capH, baseline, x0: arrow.cx - width / 2, front,
    cx: arrow.cx, cy: baseline - capH / 2, arrowTop: arrow.y0 };
}

let shineCanvas = null;
function drawTitle(ctx, base) {
  if (!titleLayout) return;
  const L = titleLayout, opacity = arrowNode.renderOpacity;
  if (opacity <= 0) return;
  // Anchor at the arrow's top edge: squash/stretch is applied around that point so the
  // title stays glued to the arrow and follows it all the way into the hole.
  const w = arrowNode.world;
  const anchor = apply(w, L.cx, L.arrowTop);
  // Extra sink proportional to the arrow's dive progress (from ArrowGoingDown's own
  // keyframes), so the stretched title is fully swallowed by the hole.
  const root = arrowNode.parent;
  const dive = Math.min(1, Math.max(0, (root.y - DIVE.rest) / (DIVE.down - DIVE.rest)));
  anchor[1] += dive * dive * DIVE.sink;
  const titleWorld = [w[0], w[1], w[2], w[3], 0, 0];
  const tw = mul([1, 0, 0, 1, anchor[0], anchor[1]], mul(titleWorld, [1, 0, 0, 1, -L.cx, -L.arrowTop]));
  const m = mul(base, tw);
  const font = `700 ${TITLE_SIZE}px Instalanding, sans-serif`;
  const eachGlyph = (fn) => { for (const g of L.glyphs) fn(g); };

  ctx.save();
  applyClips(ctx, base, arrowOutline);
  ctx.setTransform(...m);
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.globalAlpha = opacity;

  // 1. Outline around the whole extruded body (like the arrow's back silhouette).
  ctx.strokeStyle = argb(outlinePaint, 1);
  ctx.lineWidth = 5;
  for (let k = EXTRUDE.steps; k >= 0; k--) {
    eachGlyph((g) => ctx.strokeText(g.ch, g.x + k * EXTRUDE.dx, L.baseline + k * EXTRUDE.dy));
  }
  // 2. Extruded side faces.
  const side = ctx.createLinearGradient(0, L.baseline - L.capH, 0, L.baseline + EXTRUDE.steps * EXTRUDE.dy);
  side.addColorStop(0, '#7b40a9'); side.addColorStop(1, '#5f2474');
  ctx.fillStyle = side;
  for (let k = EXTRUDE.steps; k >= 1; k--) {
    eachGlyph((g) => ctx.fillText(g.ch, g.x + k * EXTRUDE.dx, L.baseline + k * EXTRUDE.dy));
  }
  // 3. Front faces: each glyph gets the arrow-front gradient, mapped to the glyph box
  //    with the same direction (purple bottom-left -> warm yellow top-right).
  const f = frontGradient, fb = L.front;
  const u = (px) => (px - fb.x0) / fb.w, v = (py) => (py - fb.y0) / fb.h;
  const gs = [u(f.startX + arrowFront.x), v(f.startY + arrowFront.y)];
  const ge = [u(f.endX + arrowFront.x), v(f.endY + arrowFront.y)];
  const top = L.baseline - L.capH;
  eachGlyph((g) => {
    const gr = ctx.createLinearGradient(g.x + gs[0] * g.w, top + gs[1] * L.capH, g.x + ge[0] * g.w, top + ge[1] * L.capH);
    for (const st of f.stops) gr.addColorStop(st.position, argb(st.colorValue, 1));
    ctx.fillStyle = gr;
    ctx.fillText(g.ch, g.x, L.baseline);
  });
  // 4. Crisp edge between front and side.
  ctx.lineWidth = 1.2;
  eachGlyph((g) => ctx.strokeText(g.ch, g.x, L.baseline));
  ctx.restore();

  // 5. Shine: the arrow's own shine shape, remapped from the arrow face onto the title
  //    and composited only inside the letters.
  if (!shinePaint || !shinePaint.isVisible) return;
  const cw = ctx.canvas.width, ch = ctx.canvas.height;
  if (!shineCanvas) shineCanvas = document.createElement('canvas');
  if (shineCanvas.width !== cw || shineCanvas.height !== ch) { shineCanvas.width = cw; shineCanvas.height = ch; }
  const sc = shineCanvas.getContext('2d');
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.clearRect(0, 0, cw, ch);
  sc.setTransform(...m);
  sc.font = font;
  sc.fillStyle = '#000';
  eachGlyph((g) => sc.fillText(g.ch, g.x, L.baseline));
  sc.globalCompositeOperation = 'source-in';
  const sx = L.width / fb.w, sy = L.capH / fb.h * 1.6;
  const remap = mul(tw, mul([sx, 0, 0, sy, L.cx - fb.cx * sx, L.cy - fb.cy * sy], invert(arrowNode.world)));
  sc.setTransform(...base);
  const scale = Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2]));
  sc.filter = `blur(${(shinePaint.feather ? shinePaint.feather.strength : 0) * 0.5 * scale * sx}px)`;
  sc.fillStyle = argb(shinePaint.mutator.colorValue, 1);
  sc.fill(shapePath(arrowShine, remap));
  sc.filter = 'none';
  sc.globalCompositeOperation = 'source-over';
  ctx.save();
  applyClips(ctx, base, arrowOutline);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = opacity * arrowShine.renderOpacity;
  ctx.drawImage(shineCanvas, 0, 0);
  ctx.restore();
}

// ---------------------------------------------------------------- loop
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
titleLayout = layoutTitle(ctx);
if (document.fonts) {
  document.fonts.load(`700 ${TITLE_SIZE}px Instalanding`).then(() => { titleLayout = layoutTitle(ctx); });
}
let view = [1, 0, 0, 1, 0, 0];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  // Fit: contain, Alignment: center (same as the default rive web runtime).
  const s = Math.min(w / artboard.width, h / artboard.height);
  view = [s, 0, 0, s, (w - artboard.width * s) / 2, (h - artboard.height * s) / 2];
  view.dpr = dpr;
}
window.addEventListener('resize', resize);
resize();

function toArtboard(e) {
  const r = canvas.getBoundingClientRect();
  return apply(invert(view), e.clientX - r.left, e.clientY - r.top);
}
canvas.addEventListener('pointermove', (e) => pointerEvent('move', toArtboard(e)));
canvas.addEventListener('pointerdown', (e) => pointerEvent('down', toArtboard(e)));
canvas.addEventListener('pointerup', (e) => pointerEvent('up', toArtboard(e)));
canvas.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') pointerEvent('exit', null); });
let touchDown = null;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') touchDown = { x: e.clientX, y: e.clientY, wasOut: inputs[0].value };
}, true);
canvas.addEventListener('pointerup', (e) => {
  if (e.pointerType !== 'touch' || !touchDown) return;
  const tap = Math.hypot(e.clientX - touchDown.x, e.clientY - touchDown.y) < 10;
  if (tap && touchDown.wasOut) pointerEvent('exit', null);
  touchDown = null;
});
// for the lab hooks below
const follower = byId(4);
window.__cute = { pointerEvent, inputs, follower, rest: { x: follower.x, y: follower.y }, size: [artboard.width, artboard.height] };

function advance(dt) {
  updateWorld();
  for (const l of layers) l.advance(dt);
  updateWorld();
  applyJoystick();
  updateWorld();
}

function render() {
  const dpr = view.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const base = mul([dpr, 0, 0, dpr, 0, 0], view);
  if (artboardFill && artboardFill.isVisible !== 0 && artboardFill.mutator) {
    ctx.setTransform(...base);
    ctx.fillStyle = argb(artboardFill.mutator.colorValue, 1);
    ctx.fillRect(0, 0, artboard.width, artboard.height);
  }
  for (const s of drawOrder) {
    drawShape(ctx, base, s);
    if (s === arrowOutline && !(window.__LAB && window.__LAB.title === false)) drawTitle(ctx, base);
  }
}

let last = null;
function frame(t) {
  const dt = last === null ? 0 : Math.min(0.1, (t - last) / 1000);
  last = t;
  advance(dt * (window.__LAB ? window.__LAB.speed : 1));
  render();
  requestAnimationFrame(frame);
}
advance(0);
render();
requestAnimationFrame(frame);
dispatchEvent(new Event('cute-ready'));
})();
</script>
<script>
/* ------------------------------------------------------------------
     Lab hooks (InstaLanding Motion). The character works on its own;
     when it is framed, the lab drives it with postMessage and it reports
     what he is doing.
       { source: 'il-motion', type: 'speed', value: 0.25 }   the scene clock
       { ..., type: 'step', value: 1 | -1 }    call him up and look around (1), or send him back down (-1)
       { ..., type: 'sweep', value: 3 }        seconds for one lap of the lab's pointer around him
       { ..., type: 'title', value: true }     the INSTALANDING title on the arrow
       { ..., type: 'follow', value: true }    his head and eyes follow the pointer
       { ..., type: 'autoplay', value: true }  up, a look around, back down, every few seconds
     The lab moves a pointer the way a person does, through the same
     listeners, so the state machine decides what each move does.
  ------------------------------------------------------------------ */
(function () {
  const LAB = window.__LAB = window.__LAB || { speed: 1 };
  LAB.sweep = 3; LAB.title = true; LAB.follow = true;
  let C, auto = 0, lap = 0;
  const isOut = () => C.inputs[0].value;
  const at = (x, y) => C.pointerEvent('move', [x, y]);
  const down = () => { cancelAnimationFrame(lap); lap = 0; C.pointerEvent('exit', null); };
  // enter at the centre, then circle him once so his head and eyes track the pointer
  function lookAround() {
    cancelAnimationFrame(lap);
    const [w, h] = C.size, cx = w / 2, cy = h * 0.46, r = Math.min(w, h) * 0.36;
    at(cx, cy);
    let t0 = null, a = 0;
    const tick = (t) => {
      if (t0 === null) t0 = t;
      a = ((t - t0) / 1000) * LAB.speed / Math.max(0.5, LAB.sweep);
      at(cx + Math.cos(a * Math.PI * 2 - Math.PI / 2) * r, cy + Math.sin(a * Math.PI * 2 - Math.PI / 2) * r * 0.8);
      if (a < 1) lap = requestAnimationFrame(tick); else { lap = 0; at(cx, cy); }
    };
    setTimeout(() => { lap = requestAnimationFrame(tick); }, 1100 / Math.max(LAB.speed, 0.05));
  }
  function setFollow(on) {
    LAB.follow = on;
    if (!on) { C.follower.x = C.rest.x; C.follower.y = C.rest.y; }
  }
  const autoplay = (on, ms = 4200) => {
    clearInterval(auto);
    if (!on) return;
    const cycle = () => { if (document.hidden) return; isOut() ? down() : lookAround(); };
    cycle();
    auto = setInterval(cycle, ms / Math.max(LAB.speed, 0.25));
  };
  function start() {
    if (C) return;
    C = window.__cute;
    const canvas = document.getElementById('stage');
    const qs = new URLSearchParams(location.search);
    if (qs.has('autoplay')) autoplay(true, Number(qs.get('autoplay')) || 4200);
    // a real press takes over from the lab
    canvas.addEventListener('pointerdown', (e) => { if (e.isTrusted) { clearInterval(auto); cancelAnimationFrame(lap); } });
    if (parent !== window) {
      let lastText = '', was = false, since = 0;
      const report = (t) => {
        const out = isOut();
        if (out !== was) { was = out; since = t; }
        const fresh = t - since < 1100 / Math.max(LAB.speed, 0.05);
        const text = out
          ? (fresh ? 'POPPING UP · THE ARROW DIVES INTO THE HOLE' : LAB.follow ? 'UP · WATCHING THE POINTER' : 'UP · FOLLOW OFF')
          : (fresh && since ? 'JUMPING BACK IN · THE ARROW RISES' : 'IN THE HOLE · HOVER TO CALL HIM UP');
        if (text !== lastText) { lastText = text; parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, '*'); }
        setTimeout(() => requestAnimationFrame(report), 120);
      };
      requestAnimationFrame(report);
    }
  }
  if (window.__cute) start(); else addEventListener('cute-ready', start, { once: true });
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion' || !C) return;
    if (d.type === 'speed') LAB.speed = Math.max(0.05, Number(d.value) || 1);
    if (d.type === 'step') { clearInterval(auto); d.value > 0 ? lookAround() : down(); }
    if (d.type === 'sweep') LAB.sweep = Math.min(8, Math.max(1, Number(d.value) || 3));
    if (d.type === 'title') LAB.title = Boolean(d.value);
    if (d.type === 'follow') setFollow(Boolean(d.value));
    if (d.type === 'autoplay') autoplay(Boolean(d.value));
  });
})();
</script>
