      const ex = (x, y) => { const dx = x - cx, dy = y - cy, l = Math.hypot(dx, dy) || 1; return [x + dx / l * g, y + dy / l * g]; };
      const p0 = ex(x0, y0), p1 = ex(x1, y1), p2 = ex(x2, y2);
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.closePath();
      ctx.clip();
      ctx.transform(ia, ib, ic, id, ie, iff);
      ctx.drawImage(im, 0, 0);
      ctx.restore();
    }
  }

  /* ---------------- hit testing (artboard space) ---------------- */
  hitShape(hctx, shape, x, y) {
    if (shape.drawableFlags & 1) return false;
    const w = this.world(shape);
    if (Math.abs(w[0] * w[3] - w[1] * w[2]) < 1e-9) return false;
    setT(hctx, w);
    return hctx.isPointInPath(this.shapePath(shape), x, y);
  }
}

/* ======================= animation ======================= */
class AnimInst {
  constructor(ab, anim) {
    this.ab = ab; this.a = anim;
    const fps = anim.fps;
    this.start = anim.wa ? anim.ws / fps : 0;
    this.end = anim.wa ? anim.we / fps : anim.duration / fps;
    this.time = anim.speed >= 0 ? this.start : this.end;
  }
  advance(dt) {
    const a = this.a;
    this.time += dt * a.speed;
    const range = this.end - this.start;
    if (a.loop === 1) {
      if (range > 0) {
        if (this.time >= this.end) this.time = this.start + ((this.time - this.start) % range);
        else if (this.time < this.start) this.time = this.end - ((this.start - this.time) % range);
      }
    } else if (a.loop === 0) {
      this.time = Math.max(this.start, Math.min(this.end, this.time));
    }
  }
  apply(mix) { applyAnimation(this.ab, this.a, this.time, mix); }
}
function sampleFrames(ab, frs, f, color) {
  const n = frs.length;
  if (f <= frs[0][0] || n === 1) return frs[0][3];
  if (f >= frs[n - 1][0]) return frs[n - 1][3];
  let i = 1;
  while (i < n && frs[i][0] <= f) i++;
  const a = frs[i - 1], b = frs[i];
  if (a[1] === 0) return a[3];
  let t = (f - a[0]) / (b[0] - a[0]);
  if (a[1] === 2) { const e = ab.interps.get(a[2]); if (e) t = e(t); }
  return color ? lerpColor(a[3], b[3], t) : a[3] + (b[3] - a[3]) * t;
}
function applyAnimation(ab, anim, time, mix) {
  const f = time * anim.fps;
  for (const [oid, props] of anim.keyed) {
    const o = ab.objects[oid];
    if (!o) continue;
    for (const [key, color, frs] of props) {
      const v = sampleFrames(ab, frs, f, color);
      if (mix >= 1) o[key] = v;
      else if (color) o[key] = lerpColor(o[key], v, mix);
      else o[key] = o[key] * (1 - mix) + v * mix;
    }
  }
}

/* ======================= state machine ======================= */
class Layer {
  constructor(sm, data) {
    this.sm = sm; this.ab = sm.ab; this.d = data;
    this.any = { state: data.states.find((s) => s.kind === 'any') };
    this.entry = data.states.find((s) => s.kind === 'entry');
    this.cur = this.inst(this.entry);
    this.from = null; this.tr = null; this.mix = 1; this.mixFrom = 1; this.reset = null; this.done = true;
  }
  inst(state) {
    const i = { state };
    if (state && state.kind === 'anim') i.anim = new AnimInst(this.ab, this.ab.data.animations[state.anim]);
    return i;
  }
  dur() { return this.tr ? this.tr.dur * BLEND : 0; }
  transitioning() { return this.tr && this.from && this.dur() !== 0 && this.mix < 1; }
  updateMix(dt) {
    if (this.tr && this.from && this.dur() !== 0) {
      const mt = this.dur() / 1000;
      this.mix = mt === 0 ? 1 : Math.min(1, Math.max(0, this.mix + dt / mt));
      if (this.mix === 1 && !this.done) { this.done = true; this.reset = null; }
    } else this.mix = 1;
  }
  allowed(t) {
    if (t.flags & 1) return false;
    const inputs = this.sm.inputs;
    for (const c of t.cond) {
      const inp = inputs[c.input];
      if (!inp) continue;
      if (c.kind === 'bool') {
        const v = !!inp.value;
        if (!((v && c.op === 0) || (!v && c.op === 1))) return false;
      } else {
        const a = inp.value, b = c.value;
        const ok = [a === b, a !== b, a <= b, a >= b, a < b, a > b][c.op];
        if (!ok) return false;
      }
    }
    return true;
  }
  tryChange(fromInst) {
    if (!fromInst || !fromInst.state) return false;
    const states = this.d.states;
    for (const t of fromInst.state.tr) {
      const to = states[t.to];
      if (!to || (this.cur && this.cur.state === to)) continue;
      if (!this.allowed(t)) continue;
      this.reset = null;
      const out = this.cur;
      this.cur = this.inst(to);
      this.tr = t;
      this.done = t.dur === 0;
      this.from = out;
      if (!this.done) this.reset = this.snapshot(out, this.cur);
      this.mixFrom = this.mix;
      if (this.cur.anim) this.cur.anim.advance(0);
      this.mix = 0;
      this.updateMix(0);
      return true;
    }
    return false;
  }
  snapshot(a, b) {
    const list = [];
    const seen = new Set();
    for (const si of [a, b]) {
      if (!si || !si.anim) continue;
      for (const [oid, props] of si.anim.a.keyed) {
        const o = this.ab.objects[oid];
        for (const [key] of props) {
          const k = oid + ':' + key;
          if (seen.has(k)) continue;
          seen.add(k); list.push([o, key, o[key]]);
        }
      }
    }
    return list;
  }
  updateState() {
    if (this.transitioning() && !(this.tr.flags & 32)) return false;
    if (this.tryChange(this.any)) return true;
    if (this.tryChange(this.cur)) return true;
    return false;
  }
  apply() {
    if (this.reset) for (const [o, k, v] of this.reset) o[k] = v;
    let e = null;
    if (this.tr && this.tr.interp >= 0) e = this.ab.interps.get(this.tr.interp) || null;
    if (this.from && this.mix < 1 && this.from.anim) this.from.anim.apply(e ? e(this.mixFrom) : this.mixFrom);
    if (this.cur && this.cur.anim) this.cur.anim.apply(e ? e(this.mix) : this.mix);
  }
  advance(dt) {
    if (this.cur.anim) this.cur.anim.advance(dt);
    this.updateMix(dt);
    if (this.from && this.mix < 1 && this.from.anim) this.from.anim.advance(dt);
    this.apply();
    for (let i = 0; i < 100 && this.updateState(); i++) this.apply();
  }
}

class StateMachine {
  constructor(ab, index) {
    this.ab = ab;
    const d = this.d = ab.data.stateMachines[index];
    this.inputs = d.inputs.map((i) => ({ kind: i.kind, name: i.name, value: i.kind === 'bool' ? !!i.value : i.value }));
    this.layers = d.layers.map((l) => new Layer(this, l));
    // hit components in hierarchy order (top-most first)
    const byTarget = new Map();
    for (const l of d.listeners) {
      const target = ab.objects[l.target];
      if (!target) continue;
      if (!byTarget.has(target)) byTarget.set(target, { shape: target, listeners: [], hovered: false, down: false });
      byTarget.get(target).listeners.push(l);
    }
    this.hits = [...byTarget.values()].sort((a, b) => a.shape.id - b.shape.id);
  }
  input(name) { return this.inputs.find((i) => i.name === name); }
  perform(l) {
    for (const a of l.actions) {
      const inp = this.inputs[a.input];
      if (!inp) continue;
      if (a.kind === 'bool') inp.value = a.value === 2 ? !inp.value : !!a.value;
      else inp.value = a.value;
    }
  }
  /* type: 'move' | 'down' | 'up' | 'exit' */
  pointer(type, x, y, hctx) {
    let canHit = true;
    let clickable = false;
    for (const h of this.hits) {
      const hit = type !== 'exit' && this.ab.hitShape(hctx, h.shape, x, y);
      const hovered = hit && canHit;
      if (hovered !== h.hovered) {
        for (const l of h.listeners) {
          if (l.type === (hovered ? 0 : 1)) this.perform(l);
        }
        h.hovered = hovered;
      }
      if (hovered) {
        if (h.listeners.some((l) => l.type === 6 || l.type === 2 || l.type === 3)) clickable = true;
        for (const l of h.listeners) {
          if (type === 'down' && l.type === 2) this.perform(l);
          if (type === 'up' && l.type === 3) this.perform(l);
        }
        if (type === 'down') h.down = true;
        if (type === 'up' && h.down) for (const l of h.listeners) if (l.type === 6) this.perform(l);
      }
      if (type === 'up' || type === 'exit') h.down = false;
      if (hovered && (h.shape.drawableFlags & 8)) canHit = false;
    }
    return clickable;
  }
  advance(dt) {
    for (const l of this.layers) l.advance(dt);
    for (const o of this.ab.objects) {
      if (o.type === 'NestedArtboard' && o.sm) o.sm.advance(IDLE ? dt * (o.speed === undefined ? 1 : o.speed) : 0);
    }
  }
}


(async function main() {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  try { ctx.filter = 'blur(1px)'; FEATHER_FILTER = ctx.filter === 'blur(1px)'; ctx.filter = 'none'; } catch (e) { FEATHER_FILTER = false; }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const images = await Promise.all(IMAGES.map((src) => new Promise((res) => {
    const im = new Image();
    im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => res(im));
    im.onerror = () => res(null);
    im.src = src;
  })));

  const gl = new MeshGL();
  const root = new Artboard(SCENE, 0, images, gl);
  const sm = new StateMachine(root, 0);
  const hcv = document.createElement('canvas'); hcv.width = hcv.height = 1;
  const hctx = hcv.getContext('2d');

  let W = 0, H = 0, scale = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (w !== W || h !== H) {
      W = canvas.width = w; H = canvas.height = h;
      gl.resize(W, H);
    }
    scale = Math.min(W / root.w, H / root.h);
  }
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('resize', resize);
  resize();

  // pointer → artboard space
  const toArtboard = (e) => {
    const r = canvas.getBoundingClientRect();
    const s = Math.min(r.width / root.w, r.height / root.h);
    const ox = (r.width - root.w * s) / 2, oy = (r.height - root.h * s) / 2;
    return [(e.clientX - r.left - ox) / s, (e.clientY - r.top - oy) / s];
  };
  const send = (type, e) => {
    const [x, y] = e ? toArtboard(e) : [-1e6, -1e6];
    const clickable = sm.pointer(type, x, y, hctx);
    canvas.style.cursor = clickable ? 'pointer' : 'default';
  };
  canvas.addEventListener('pointermove', (e) => send('move', e));
  canvas.addEventListener('pointerdown', (e) => { send('move', e); send('down', e); });
  canvas.addEventListener('pointerup', (e) => { send('up', e); if (e.pointerType !== 'mouse') send('exit', null); });
  canvas.addEventListener('pointerleave', () => send('exit', null));
  canvas.addEventListener('pointercancel', () => send('exit', null));

  // public hook (handy for embedding / automation)
  window.mercenaries = {
    setState(n) { sm.input('State').value = n; },
    get state() { return sm.input('State').value; },
  };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(Math.max((now - last) / 1000, 0), 0.1);
    last = now;
    sm.advance(dt * SPEED);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const ox = (W - root.w * scale) / 2, oy = (H - root.h * scale) / 2;
    root.draw(ctx, [scale, 0, 0, scale, ox, oy], 1);
    requestAnimationFrame(frame);
  }
  sm.advance(0);
  if (/[?&]manual/.test(location.search)) {
    const render = () => {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      const ox = (W - root.w * scale) / 2, oy = (H - root.h * scale) / 2;
      root.draw(ctx, [scale, 0, 0, scale, ox, oy], 1);
    };
    window.step = (n) => { for (let i = 0; i < n; i++) sm.advance(1 / 60); render(); };
    window.ptr = (t, x, y) => sm.pointer(t, x, y, hctx);
    canvas.style.transition = 'none'; canvas.classList.add('ready'); render(); window.loaded = true;
    return;
  }

  /* ------------------------------------------------------------------
       Lab hooks (InstaLanding Motion). The scene works on its own; when it
       is framed, the lab drives the state machine with postMessage and it
       reports which mercenary is picked.
         { source: 'il-motion', type: 'speed', value: 0.25 }   every timeline and blend (they run on dt)
         { ..., type: 'step', value: 1 | -1 }    next / previous beat of the pick sequence
         { ..., type: 'blend', value: 100 }      transition durations, % of the authored 100-250 ms
         { ..., type: 'idle', value: true }      the soldiers' breathing loops
         { ..., type: 'autoplay', value: true }  hover, pick, zoom, back out, other side
    ------------------------------------------------------------------ */
  const hoverDark = sm.input('Hover dark'), hoverLight = sm.input('Hover light'), stateIn = sm.input('State');
  // [State, hover dark, hover light]
  const BEATS = [[0, 0, 0], [0, 1, 0], [1, 1, 0], [3, 1, 0], [1, 1, 0], [0, 0, 0], [0, 0, 1], [2, 0, 1], [4, 0, 1], [2, 0, 1]];
  let beat = 0, auto = 0;
  const go = (k) => {
    beat = (k + BEATS.length) % BEATS.length;
    const [s, hd, hl] = BEATS[beat];
    stateIn.value = s; hoverDark.value = !!hd; hoverLight.value = !!hl;
  };
  const autoplay = (on, ms = 1500) => {
    clearInterval(auto);
    if (on) { go(beat + 1); auto = setInterval(() => { if (!document.hidden) go(beat + 1); }, ms); }
  };
  const qs = new URLSearchParams(location.search);
  if (qs.has('autoplay')) autoplay(true, Number(qs.get('autoplay')) || 1500);
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion') return;
    if (d.type === 'speed') SPEED = Math.max(0.05, Number(d.value) || 1);
    if (d.type === 'step') { clearInterval(auto); go(beat + (d.value > 0 ? 1 : -1)); }
    if (d.type === 'blend') BLEND = Math.max(0.05, (Number(d.value) || 100) / 100);
    if (d.type === 'idle') IDLE = Boolean(d.value);
    if (d.type === 'autoplay') autoplay(Boolean(d.value));
  });
  // a pointer on the canvas takes over from the sequence
  canvas.addEventListener('pointerenter', () => { clearInterval(auto); hoverDark.value = hoverLight.value = false; });
  if (parent !== window) {
    let lastText = '';
    const NAMES = ['PICK A SIDE', 'DARK MERCENARY SELECTED', 'LIGHT MERCENARY SELECTED', 'DARK MERCENARY · CLOSE-UP', 'LIGHT MERCENARY · CLOSE-UP'];
    const report = () => {
      const s = Math.round(stateIn.value);
      let text = NAMES[s] || NAMES[0];
      if (s === 0 && (hoverDark.value || hoverLight.value)) text = hoverDark.value ? 'HOVERING DARK' : 'HOVERING LIGHT';
      if (text !== lastText) { lastText = text; parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, '*'); }
      setTimeout(() => requestAnimationFrame(report), 90);
    };
    requestAnimationFrame(report);
  }
  requestAnimationFrame((t) => { last = t; frame(t); canvas.classList.add('ready'); window.loaded = true; });
})();
</script>
