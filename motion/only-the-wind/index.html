<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Only the Wind · InstaLanding Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #e9cfa8;
  }

  /* ---------- Camera: everything photographic lives in here ---------- */
  .camera {
    position: fixed; inset: 0;
    overflow: hidden;
    transform-origin: 40% 55%;
    animation: breathe 16s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    0%   { transform: scale(1.035) translate(0, 0); }
    50%  { transform: scale(1.042) translate(-0.25%, 0.15%); }
    100% { transform: scale(1.036) translate(0.2%, -0.12%); }
  }

  .bg-layer {
    position: absolute; inset: -30px;
    z-index: 1;
    will-change: transform;
  }
  .bg-layer > * { position: absolute; }
  #bg { inset: 0; width: 100%; height: 100%; }

  .clouds {
    left: 0; top: 2vh;
    width: 280vw; height: 44vh;
    opacity: .85;
    animation: clouds 380s linear infinite;
  }
  @keyframes clouds { to { transform: translateX(-50%); } }

  #rays {
    mix-blend-mode: screen;
    opacity: .5;
    animation: rays 46s ease-in-out infinite alternate;
  }
  @keyframes rays {
    0%   { transform: rotate(-2deg); opacity: .42; }
    50%  { opacity: .58; }
    100% { transform: rotate(3deg); opacity: .46; }
  }

  #glitter { inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }

  .fog {
    left: 0; right: 0;
    background-repeat: repeat-x;
    background-size: 1600px 100%;
    animation: fog 90s linear infinite;
    pointer-events: none;
  }
  .fog.f1 { top: 57%; height: 17%; opacity: .55; }
  .fog.f2 { top: 73%; height: 22%; opacity: .5; animation-duration: 60s; filter: blur(3px); }
  @keyframes fog { to { background-position-x: -1600px; } }

  #scene, #front {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #scene { z-index: 2; }

  /* ---------- Figures ---------- */
  .figure-layer {
    position: absolute; inset: 0;
    z-index: 3;
    will-change: transform;
  }

  .person {
    position: absolute;
    right: 45%;
    bottom: 0;
    height: 50vh;
    width: auto;
    aspect-ratio: 240 / 500;
    z-index: 1;
    user-select: none;
    overflow: visible;
  }

  .block {
    height: 100%;
    position: absolute;
    width: 50%;
    right: 0;
    z-index: 1;
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    align-items: flex-end;
  }

  .roof {
    display: block;
    align-self: flex-start;
    height: 60vh;
    width: auto;
    aspect-ratio: 800 / 600;
    flex-shrink: 0;
    user-select: none;
    overflow: visible;
  }

  .girl {
    position: absolute;
    left: 30%;
    bottom: 0;
    display: block;
    height: 70vh;
    width: auto;
    aspect-ratio: 300 / 640;
    margin-right: 20px;
    user-select: none;
    overflow: visible;
  }

  .swing { transform-box: view-box; animation: swing 5s ease-in-out infinite alternate; }
  #lantern { transform-origin: 470px 120px; }
  #furin   { transform-origin: 300px 120px; animation-duration: 3.1s; }
  #tanzaku { transform-origin: 300px 238px; animation: flutter 1.3s ease-in-out infinite alternate; }
  #kanzashi-dangle { transform-origin: 156px 44px; animation-duration: 2.4s; }
  @keyframes swing   { from { transform: rotate(-3deg); } to { transform: rotate(3.6deg); } }
  @keyframes flutter { from { transform: rotate(-9deg); } to { transform: rotate(15deg); } }

  .flicker { animation: flicker 3.4s ease-in-out infinite; }
  @keyframes flicker {
    0%, 100% { opacity: .9; } 22% { opacity: .7; } 48% { opacity: 1; } 71% { opacity: .78; }
  }
  .glint { transform-box: fill-box; transform-origin: center; animation: glint 4.2s ease-in-out infinite; }
  @keyframes glint {
    0%, 70%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
    80% { opacity: 1; transform: scale(1) rotate(25deg); }
  }

  #grass {
    position: absolute;
    left: -30px; bottom: -4px;
    width: calc(100% + 60px);
    height: 24vh;
    z-index: 4;
    pointer-events: none;
    will-change: transform;
  }

  #front { z-index: 5; }

  /* ---------- Lens ---------- */
  .flare { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .flare > * {
    position: absolute; left: 0; top: 0;
    mix-blend-mode: screen;
    will-change: transform;
    border-radius: 50%;
  }
  .bloom {
    width: 150vmax; height: 150vmax;
    background: radial-gradient(circle,
      rgba(255,247,228,.62) 0%,
      rgba(255,222,170,.34) 6%,
      rgba(255,196,135,.14) 18%,
      rgba(255,180,120,.05) 34%,
      rgba(255,180,120,0) 50%);
  }
  .core {
    width: 30vmin; height: 30vmin;
    background: radial-gradient(circle, rgba(255,255,250,1) 0%, rgba(255,250,232,.9) 14%, rgba(255,236,200,.35) 38%, rgba(255,236,200,0) 70%);
  }
  .streak {
    width: 170vw; height: 7vh;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,236,205,.55) 0%, rgba(255,205,160,.18) 26%, rgba(255,205,160,0) 70%);
  }
  .spikes { border-radius: 0; opacity: .5; }
  .ghost { opacity: .45; }
  .ghost.ring { background: radial-gradient(circle, rgba(0,0,0,0) 56%, rgba(150,210,255,.10) 66%, rgba(255,205,170,.14) 73%, rgba(0,0,0,0) 80%); }
  .ghost.hex  { border-radius: 0; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
                background: radial-gradient(circle, rgba(255,190,140,.09), rgba(255,170,120,.04) 70%, rgba(255,170,120,0)); }
  .ghost.dot  { background: radial-gradient(circle, rgba(170,255,220,.16), rgba(170,255,220,0) 70%); }
  .ghost.warm { background: radial-gradient(circle, rgba(255,150,90,.10), rgba(255,150,90,0) 70%); }

  /* ---------- Haiku ---------- */
  .haiku-wrap {
    position: fixed;
    top: 5dvh;
    left: 80px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .haiku {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: "Shippori Mincho B1", "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
    font-size: clamp(24px, 2.3vw, 34px);
    line-height: 2.2;
    color: #1d140f;
    letter-spacing: 0.12em;
    font-weight: 500;
    user-select: none;
    mix-blend-mode: multiply;
    filter: url(#ink);
  }

  .haiku .ch {
    opacity: 0;
    filter: blur(8px);
    transition: opacity 1.6s ease, filter 1.8s ease;
  }
  .loaded .haiku .ch { opacity: .92; filter: blur(0); }

  .rule {
    width: 1px; height: 0;
    background: linear-gradient(rgba(70,45,25,.7), rgba(70,45,25,0));
    transition: height 2.4s cubic-bezier(.2,.7,.2,1) 3s;
  }
  .loaded .rule { height: 80px; }

  .seal {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: #b5301f;
    color: #f7e8d8;
    font-family: "Shippori Mincho B1", serif;
    font-weight: 700;
    font-size: 24px;
    border-radius: 3px;
    transform: rotate(-4deg) scale(1.3);
    filter: url(#rough);
    mix-blend-mode: multiply;
    opacity: 0;
    transition: opacity .5s ease 3.8s, transform .5s cubic-bezier(.3,1.6,.5,1) 3.8s;
    user-select: none;
  }
  .loaded .seal { opacity: .9; transform: rotate(-4deg) scale(1); }

  .caption {
    position: fixed; left: 80px; bottom: 5dvh; z-index: 10;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 300;
    font-size: 17px; line-height: 1.7;
    color: rgba(255, 238, 216, .82);
    text-shadow: 0 1px 14px rgba(0,0,0,.6);
    letter-spacing: .03em;
    opacity: 0; transition: opacity 2s ease 4.4s;
    user-select: none;
  }
  .caption small {
    display: block; margin-top: 10px;
    font-style: normal; font-size: 10px; letter-spacing: .38em;
    text-transform: uppercase; color: #d9b67a;
  }
  .loaded .caption { opacity: 1; }

  .hint {
    position: fixed; right: 28px; bottom: 22px; z-index: 16;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: rgba(255,236,214,.65);
    text-shadow: 0 1px 10px rgba(0,0,0,.6);
    opacity: 0; transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---------- Film finish ---------- */
  .grade {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: linear-gradient(180deg, rgba(70,60,110,.16) 0%, rgba(255,170,90,.10) 55%, rgba(30,15,35,.30) 100%);
    mix-blend-mode: soft-light;
  }
  .vignette {
    position: fixed; inset: 0; z-index: 12; pointer-events: none;
    background: radial-gradient(130% 100% at 40% 50%, rgba(35,20,15,0) 50%, rgba(35,20,15,.36) 100%);
  }
  .grain {
    position: fixed; inset: -8%; z-index: 13; pointer-events: none;
    opacity: .11; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .9s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 25% { transform: translate(-4%,3%); }
    50% { transform: translate(3%,-4%); } 75% { transform: translate(-3%,-2%); }
  }
  .flash {
    position: fixed; inset: 0; z-index: 14; pointer-events: none;
    background: #fff8ec;
    transition: opacity 3.6s cubic-bezier(.2,.6,.2,1) .2s;
  }
  .loaded .flash { opacity: 0; }

  @media (max-width: 760px) {
    .haiku-wrap { left: 22px; top: 4dvh; gap: 18px; }
    .haiku { font-size: 21px; }
    .caption { display: none; }
    .person { right: 52%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .camera, .swing, #tanzaku, .clouds, .fog, #rays, .grain, .flicker, .glint { animation: none !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="2.4"/>
  </filter>
  <filter id="ink">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="8"/>
    <feDisplacementMap in="SourceGraphic" scale="1.3"/>
  </filter>
</svg>

<div class="camera">

  <!-- Photographic environment, rendered procedurally -->
  <div class="bg-layer" id="bgLayer">
    <canvas id="bg"></canvas>
    <canvas class="clouds" id="clouds"></canvas>
    <canvas id="rays"></canvas>
    <canvas id="glitter"></canvas>
    <div class="fog f1"></div>
    <div class="fog f2"></div>
  </div>

  <canvas id="scene"></canvas>

  <div class="figure-layer" id="figLayer">

    <!-- The man: a traveller in straw hat & hakama, backlit -->
    <svg class="person" viewBox="0 0 240 500" role="img" aria-label="man">
      <defs>
        <filter id="rimM" x="-30%" y="-20%" width="160%" height="140%" color-interpolation-filters="sRGB">
          <feOffset in="SourceAlpha" dx="2.6" dy="1.4" result="o"/>
          <feComposite in="SourceAlpha" in2="o" operator="out" result="e"/>
          <feGaussianBlur in="e" stdDeviation=".8" result="eb"/>
          <feFlood flood-color="#ffdcaa"/>
          <feComposite in2="eb" operator="in" result="rim"/>
          <feGaussianBlur in="rim" stdDeviation="7" result="w"/>
          <feComponentTransfer in="w" result="wrap"><feFuncA type="linear" slope=".75"/></feComponentTransfer>
          <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="wrap"/><feMergeNode in="rim"/><feMergeNode in="rim"/></feMerge>
        </filter>
        <radialGradient id="strawG" cx="22%" cy="80%" r="90%">
          <stop offset="0" stop-color="#e9bf78"/><stop offset=".35" stop-color="#8f6a3e"/><stop offset="1" stop-color="#3a2b22"/>
        </radialGradient>
        <linearGradient id="haoriG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#55433f"/><stop offset=".4" stop-color="#3a2d2d"/><stop offset="1" stop-color="#2a2022"/>
        </linearGradient>
        <linearGradient id="hakamaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3f3233"/><stop offset="1" stop-color="#2c2224"/>
        </linearGradient>
      </defs>
      <g filter="url(#rimM)">
        <path fill="url(#hakamaG)" d="M68 236 L172 236 L194 488 C 144 490 96 486 46 488 Z">
          <animate attributeName="d" dur="3.8s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
            values="M68 236 L172 236 L194 488 C 144 490 96 486 46 488 Z;M68 236 L172 236 L189 488 C 140 492 88 489 38 486 Z;M68 236 L172 236 L194 488 C 144 490 96 486 46 488 Z"/>
        </path>
        <g stroke="rgba(0,0,0,.3)" stroke-width="1.4" fill="none">
          <path d="M96 240 L82 486"/><path d="M120 240 L118 488"/><path d="M144 240 L154 488"/>
        </g>
        <path d="M72 116 C 92 106 148 106 168 116 L 178 262 L 62 262 Z" fill="url(#haoriG)"/>
        <g fill="none" stroke="rgba(230,205,170,.22)" stroke-width="1.1">
          <circle cx="120" cy="158" r="10"/>
          <path d="M113 160 q3.5 -5 7 0 q3.5 5 7 0"/>
        </g>
        <path fill="url(#haoriG)" d="M74 118 C 52 128 40 176 38 238 Q 52 250 68 246 L 82 152 Z">
          <animate attributeName="d" dur="3.2s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
            values="M74 118 C 52 128 40 176 38 238 Q 52 250 68 246 L 82 152 Z;M74 118 C 48 130 32 178 26 238 Q 40 252 64 246 L 82 152 Z;M74 118 C 52 128 40 176 38 238 Q 52 250 68 246 L 82 152 Z"/>
        </path>
        <path fill="url(#haoriG)" d="M166 118 C 188 128 200 176 202 238 Q 188 250 172 246 L 158 152 Z">
          <animate attributeName="d" dur="3.6s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
            values="M166 118 C 188 128 200 176 202 238 Q 188 250 172 246 L 158 152 Z;M166 118 C 184 130 192 178 192 240 Q 180 250 166 246 L 158 152 Z;M166 118 C 188 128 200 176 202 238 Q 188 250 172 246 L 158 152 Z"/>
        </path>
        <g stroke-linecap="round">
          <line x1="40" y1="252" x2="178" y2="228" stroke="#120d0d" stroke-width="8"/>
          <line x1="40" y1="250" x2="178" y2="226" stroke="rgba(255,220,170,.18)" stroke-width="1.5"/>
          <line x1="185" y1="227" x2="224" y2="220" stroke="#2a2220" stroke-width="7"/>
          <line x1="185" y1="227" x2="224" y2="220" stroke="#0e0a0a" stroke-width="7" stroke-dasharray="3 4"/>
          <ellipse cx="181" cy="227.5" rx="3" ry="9" fill="#8a6a3a" transform="rotate(-10 181 227.5)"/>
          <circle cx="40" cy="252" r="4" fill="#8a6a3a"/>
        </g>
        <path d="M104 96 L136 96 L138 118 L102 118Z" fill="#1a1110"/>
        <path d="M8 98 Q 120 14 232 98 Q 120 116 8 98 Z" fill="url(#strawG)"/>
        <g stroke="rgba(30,18,10,.35)" stroke-width="1" fill="none">
          <path d="M120 44 L30 99"/><path d="M120 44 L60 104"/><path d="M120 44 L90 107"/>
          <path d="M120 44 L120 109"/><path d="M120 44 L150 107"/><path d="M120 44 L180 104"/><path d="M120 44 L210 99"/>
          <path d="M40 80 Q120 52 200 80"/><path d="M24 92 Q120 64 216 92"/>
        </g>
        <ellipse cx="120" cy="43" rx="6" ry="4" fill="#3a2a1c"/>
        <path d="M46 488 L194 488 L196 500 L44 500Z" fill="#1c1415"/>
      </g>
    </svg>

    <div class="block">
      <!-- The girl: furisode, obi and a backlit paper parasol -->
      <svg class="girl" viewBox="0 0 300 640" role="img" aria-label="girl">
        <defs>
          <filter id="rimG" x="-30%" y="-15%" width="160%" height="130%" color-interpolation-filters="sRGB">
            <feOffset in="SourceAlpha" dx="3.2" dy=".8" result="o"/>
            <feComposite in="SourceAlpha" in2="o" operator="out" result="e"/>
            <feGaussianBlur in="e" stdDeviation=".9" result="eb"/>
            <feFlood flood-color="#ffdca6"/>
            <feComposite in2="eb" operator="in" result="rim"/>
            <feGaussianBlur in="rim" stdDeviation="8" result="w"/>
            <feComponentTransfer in="w" result="wrap"><feFuncA type="linear" slope=".7"/></feComponentTransfer>
            <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="wrap"/><feMergeNode in="rim"/><feMergeNode in="rim"/></feMerge>
          </filter>
          <linearGradient id="kimG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3e2b2b"/><stop offset=".35" stop-color="#251a1c"/><stop offset="1" stop-color="#140d10"/>
          </linearGradient>
          <linearGradient id="bounceG" x1="0" y1="0" x2="0" y2="1">
            <stop offset=".6" stop-color="#7a4a30" stop-opacity="0"/><stop offset="1" stop-color="#7a4a30" stop-opacity=".22"/>
          </linearGradient>
          <linearGradient id="obiG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6a4f30"/><stop offset=".4" stop-color="#3b2b1f"/><stop offset="1" stop-color="#20160f"/>
          </linearGradient>
          <radialGradient id="umbG" cx="28%" cy="78%" r="95%">
            <stop offset="0" stop-color="#ffe0a0"/><stop offset=".22" stop-color="#ffa457"/>
            <stop offset=".55" stop-color="#d4502c"/><stop offset="1" stop-color="#5e1810"/>
          </radialGradient>
          <pattern id="seigaiha" width="24" height="12" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#e8c49a" stroke-width=".7">
              <circle cx="0" cy="12" r="11"/><circle cx="0" cy="12" r="7"/>
              <circle cx="24" cy="12" r="11"/><circle cx="24" cy="12" r="7"/>
              <circle cx="12" cy="6" r="11"/><circle cx="12" cy="6" r="7"/>
            </g>
          </pattern>
        </defs>

        <g filter="url(#rimG)">
          <!-- parasol: oiled paper glowing with the sun behind it -->
          <g transform="rotate(-12 180 150)">
            <line x1="180" y1="160" x2="148" y2="262" stroke="#1d1310" stroke-width="3" stroke-linecap="round"/>
            <path d="M64 150 Q180 24 296 150 Q180 170 64 150Z" fill="url(#umbG)"/>
            <g id="ribs" stroke="rgba(60,12,6,.5)" stroke-width="1.1" fill="none"></g>
            <path d="M64 150 Q180 24 296 150" stroke="rgba(255,235,200,.35)" stroke-width="1" fill="none"/>
            <path d="M64 150 Q180 170 296 150" stroke="#4a120b" stroke-width="3" fill="none"/>
            <ellipse cx="128" cy="128" rx="46" ry="18" fill="rgba(255,240,210,.18)"/>
            <circle cx="180" cy="86" r="4" fill="#1d1310"/>
          </g>

          <path fill="url(#kimG)" d="M92 138 C 104 132 136 132 148 138 L 158 262 C 164 364 170 474 178 604 C 140 610 96 600 58 606 C 66 474 74 364 82 262 Z">
            <animate attributeName="d" dur="3.6s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
              values="M92 138 C 104 132 136 132 148 138 L 158 262 C 164 364 170 474 178 604 C 140 610 96 600 58 606 C 66 474 74 364 82 262 Z;M92 138 C 104 132 136 132 148 138 L 158 262 C 163 364 167 474 173 604 C 136 607 90 611 50 601 C 62 474 72 364 82 262 Z;M92 138 C 104 132 136 132 148 138 L 158 262 C 164 364 170 474 178 604 C 140 610 96 600 58 606 C 66 474 74 364 82 262 Z"/>
          </path>
          <path d="M82 262 L158 262 L178 610 L58 610Z" fill="url(#seigaiha)" opacity=".07"/>
          <path d="M82 262 L158 262 L178 610 L58 610Z" fill="url(#bounceG)"/>
          <g stroke="rgba(255,215,170,.07)" stroke-width="2" fill="none">
            <path d="M96 300 C 92 400 86 500 80 600"/><path d="M128 300 C 132 420 138 500 146 600"/>
          </g>

          <path fill="url(#kimG)" d="M94 142 C 70 156 58 222 54 330 C 52 388 66 416 96 410 L 104 178 Z">
            <animate attributeName="d" dur="3.2s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
              values="M94 142 C 70 156 58 222 54 330 C 52 388 66 416 96 410 L 104 178 Z;M94 142 C 64 160 46 228 40 336 C 36 394 56 422 92 412 L 104 178 Z;M94 142 C 70 156 58 222 54 330 C 52 388 66 416 96 410 L 104 178 Z"/>
          </path>
          <path fill="url(#kimG)" d="M146 142 C 168 156 178 220 180 330 C 182 388 168 414 142 410 L 136 178 Z">
            <animate attributeName="d" dur="3.5s" repeatCount="indefinite" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
              values="M146 142 C 168 156 178 220 180 330 C 182 388 168 414 142 410 L 136 178 Z;M146 142 C 165 158 171 222 171 332 C 171 390 157 416 133 410 L 136 178 Z;M146 142 C 168 156 178 220 180 330 C 182 388 168 414 142 410 L 136 178 Z"/>
          </path>

          <path d="M82 244 L158 244 L160 290 L80 290Z" fill="url(#obiG)"/>

<script>
(() => {
  "use strict";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PAD = 30;
  let SPEED = 1;       // lab: 1 is real time
  let GUST_KICK = 2.2; // lab: how hard one gust hits

  /* =========================================================
     Utilities
     ========================================================= */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixRGB = (a, b, t) => { const A = hx(a), B = hx(b); return A.map((v, i) => Math.round(v + (B[i] - v) * t)); };
  const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const mixHex = (a, b, t) => rgba(mixRGB(a, b, t));
  const mk = (w, h = w) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  class Noise {
    constructor(seed, size = 256) {
      const r = mulberry32(seed);
      this.S = size;
      this.v = new Float32Array(size * size);
      for (let i = 0; i < this.v.length; i++) this.v[i] = r();
    }
    at(i, j, px, py) {
      i = ((i % px) + px) % px; j = ((j % py) + py) % py;
      return this.v[(i % this.S) + (j % this.S) * this.S];
    }
    n(x, y, px, py) {
      const xi = Math.floor(x), yi = Math.floor(y);
      let xf = x - xi, yf = y - yi;
      xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
      const a = this.at(xi, yi, px, py), b = this.at(xi + 1, yi, px, py);
      const c = this.at(xi, yi + 1, px, py), d = this.at(xi + 1, yi + 1, px, py);
      return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
    }
    fbm(x, y, oct, px) {
      let s = 0, amp = 0.5, f = 1, norm = 0;
      for (let o = 0; o < oct; o++) {
        s += amp * this.n(x * f, y * f, px * f, 256);
        norm += amp; amp *= 0.5; f *= 2;
      }
      return s / norm;
    }
  }
  const noise = new Noise(11);

  function ridge(rng, n, rough) {
    const a = new Float32Array(n + 1);
    a[0] = rng() - 0.5; a[n] = rng() - 0.5;
    let step = n, d = 1;
    while (step > 1) {
      const half = step / 2;
      for (let i = half; i < n; i += step) a[i] = (a[i - half] + a[i + half]) / 2 + (rng() - 0.5) * d;
      d *= rough; step = half;
    }
    let mn = Infinity, mx = -Infinity;
    for (const v of a) { mn = Math.min(mn, v); mx = Math.max(mx, v); }
    for (let i = 0; i <= n; i++) a[i] = (a[i] - mn) / (mx - mn || 1);
    return a;
  }

  function addTrees(h, rng, count, maxH) {
    const base = h.slice(), n = h.length - 1;
    for (let k = 0; k < count; k++) {
      const ci = Math.floor(rng() * n);
      const wi = 1 + rng() * 2.5;
      const ht = maxH * (0.4 + rng() * 0.8);
      for (let i = Math.ceil(ci - wi); i <= Math.floor(ci + wi); i++) {
        if (i < 0 || i > n) continue;
        const v = base[ci] + ht * (1 - Math.abs(i - ci) / wi);
        if (v > h[i]) h[i] = v;
      }
    }
  }

  function glow(g, x, y, r, stops) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  /* =========================================================
     State
     ========================================================= */
  let VW = 0, VH = 0, BW = 0, BH = 0;
  const SUN = { x: 0, y: 0 };        // in background-layer space
  const SUNS = { x: 0, y: 0 };       // on screen
  let HORIZON = 0, LAKEB = 0;
  let SIG2 = 1;

  const $ = id => document.getElementById(id);
  const bgC = $("bg"), cloudsC = $("clouds"), raysC = $("rays"), glitterC = $("glitter");
  const sceneC = $("scene"), frontC = $("front"), grassC = $("grass"), spikesC = $("spikes");
  const sceneX = sceneC.getContext("2d"), frontX = frontC.getContext("2d");
  const grassX = grassC.getContext("2d"), glitterX = glitterC.getContext("2d");

  /* =========================================================
     Background: sky, sun, mountains, lake, hill
     ========================================================= */
  function drawPagoda(g, x, y, s, col) {
    g.fillStyle = col;
    let cy = y;
    g.fillRect(x - 14 * s, cy - 4 * s, 28 * s, 4 * s);
    cy -= 4 * s;
    for (let i = 0; i < 5; i++) {
      const wb = (12 - i * 1.7) * s;
      g.fillRect(x - wb * 0.6, cy - 7 * s, wb * 1.2, 7 * s);
      cy -= 7 * s;
      const wr = wb + 7 * s;
      g.beginPath();
      g.moveTo(x - wr, cy + 1.5 * s);
      g.quadraticCurveTo(x - wr * 0.5, cy - 0.5 * s, x - wb * 0.7, cy - 3 * s);
      g.lineTo(x + wb * 0.7, cy - 3 * s);
      g.quadraticCurveTo(x + wr * 0.5, cy - 0.5 * s, x + wr, cy + 1.5 * s);
      g.lineTo(x + wb, cy); g.lineTo(x - wb, cy);
      g.closePath(); g.fill();
      cy -= 3 * s;
    }
    g.fillRect(x - 0.6 * s, cy - 14 * s, 1.2 * s, 14 * s);
    for (let k = 0; k < 4; k++) g.fillRect(x - 1.6 * s, cy - 3 * s - k * 3 * s, 3.2 * s, 0.9 * s);
  }

  function renderBackground() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = BW, H = BH;
    bgC.width = Math.round(W * dpr); bgC.height = Math.round(H * dpr);
    const g = bgC.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rng = mulberry32(7);

    const hz = H * 0.665, lakeB = H * 0.855;
    HORIZON = hz; LAKEB = lakeB;
    SUN.x = W * 0.38; SUN.y = H * 0.54;

    // Sky
    let gr = g.createLinearGradient(0, 0, 0, hz);
    gr.addColorStop(0, "#a2979f");
    gr.addColorStop(0.3, "#c6b0a4");
    gr.addColorStop(0.62, "#e7c69e");
    gr.addColorStop(1, "#f8dfb2");
    g.fillStyle = gr;
    g.fillRect(0, 0, W, hz + 2);

    // Sun scattering
    glow(g, SUN.x, SUN.y, Math.max(W, H) * 0.85, [
      [0, "rgba(255,246,222,.9)"], [0.06, "rgba(255,228,178,.62)"],
      [0.2, "rgba(250,204,150,.26)"], [0.5, "rgba(240,190,150,.07)"], [1, "rgba(240,190,150,0)"]
    ]);
    glow(g, SUN.x, SUN.y, H * 0.06, [[0, "#fffef8"], [0.55, "rgba(255,250,232,.95)"], [1, "rgba(255,240,200,0)"]]);

    // Mountain ranges with aerial perspective
    const HAZE = "#efd2ab", INK = "#2c2027";
    const layers = [
      { base: 0.47, amp: 0.13, rough: 0.56, t: 0.13, tree: 0 },
      { base: 0.53, amp: 0.10, rough: 0.58, t: 0.25, tree: 0 },
      { base: 0.59, amp: 0.07, rough: 0.6,  t: 0.39, tree: 3, pagoda: true },
      { base: 0.635, amp: 0.045, rough: 0.66, t: 0.55, tree: 6 }
    ];
    const n = 512, ridges = [];
    const sxr = SUN.x / W;

    layers.forEach(L => {
      const r = ridge(rng, n, L.rough);
      const h = new Float32Array(n + 1);
      for (let i = 0; i <= n; i++) h[i] = r[i] * L.amp * H;
      if (L.tree) addTrees(h, rng, n * 1.4, L.tree * (H / 900));
      const top = H * L.base - L.amp * H * 0.5;
      const ys = new Float32Array(n + 1);
      for (let i = 0; i <= n; i++) ys[i] = H * L.base + L.amp * H * 0.5 - h[i];

      const col = mixHex(HAZE, INK, L.t);
      const lg = g.createLinearGradient(0, top, 0, hz);
      lg.addColorStop(0, col);
      lg.addColorStop(1, mixHex(HAZE, INK, L.t * 0.4));
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(0, hz + 1);
      for (let i = 0; i <= n; i++) g.lineTo((i / n) * W, ys[i]);
      g.lineTo(W, hz + 1);
      g.closePath();
      g.fill();

      // backlit ridge edge
      const rg = g.createLinearGradient(0, 0, W, 0);
      rg.addColorStop(0, "rgba(255,238,205,0)");
      rg.addColorStop(clamp(sxr - 0.28, 0.01, 0.98), "rgba(255,238,205,0)");
      rg.addColorStop(sxr, `rgba(255,240,210,${0.55 - L.t * 0.3})`);
      rg.addColorStop(clamp(sxr + 0.28, 0.02, 0.99), "rgba(255,238,205,0)");
      rg.addColorStop(1, "rgba(255,238,205,0)");
      g.strokeStyle = rg; g.lineWidth = 1.3;
      g.beginPath();
      for (let i = 0; i <= n; i++) g[i ? "lineTo" : "moveTo"]((i / n) * W, ys[i] + 0.5);
      g.stroke();

      if (L.pagoda) {
        const px = W * 0.27, idx = Math.round((px / W) * n);
        drawPagoda(g, px, ys[idx] + 3, (H / 900) * 0.75, col);
      }
      ridges.push({ ys, col });

      // haze pooling in the valleys
      const hb = g.createLinearGradient(0, hz - H * 0.12, 0, hz);
      hb.addColorStop(0, "rgba(239,210,171,0)");
      hb.addColorStop(1, "rgba(239,210,171,.38)");
      g.fillStyle = hb;
      g.fillRect(0, hz - H * 0.12, W, H * 0.12);
    });

    // veiling glare around the sun
    g.globalCompositeOperation = "lighter";
    glow(g, SUN.x, SUN.y, H * 0.5, [[0, "rgba(255,230,190,.32)"], [0.4, "rgba(255,210,160,.09)"], [1, "rgba(0,0,0,0)"]]);
    g.globalCompositeOperation = "source-over";

    // Lake
    const lk = g.createLinearGradient(0, hz, 0, lakeB);
    lk.addColorStop(0, "#f2d4a7");
    lk.addColorStop(0.25, "#d6b594");
    lk.addColorStop(1, "#5a4749");
    g.fillStyle = lk;
    g.fillRect(0, hz, W, lakeB - hz + 2);

    g.save();
    g.beginPath(); g.rect(0, hz, W, lakeB - hz); g.clip();
    [1, 2, 3].forEach(li => {
      g.globalAlpha = 0.18 + li * 0.07;
      g.fillStyle = ridges[li].col;
      g.beginPath(); g.moveTo(0, hz);
      for (let i = 0; i <= n; i++) g.lineTo((i / n) * W, hz + (hz - ridges[li].ys[i]) * 0.85);
      g.lineTo(W, hz); g.closePath(); g.fill();
    });
    g.globalAlpha = 1;

    // ripples
    for (let y = hz + 1; y < lakeB; y += 1 + (y - hz) * 0.03) {
      const p = (y - hz) / (lakeB - hz);
      for (let k = 0; k < 3; k++) {
        g.fillStyle = rng() < 0.5
          ? `rgba(255,240,215,${0.04 + rng() * 0.08})`
          : `rgba(40,25,30,${0.04 + rng() * 0.08})`;
        g.fillRect(rng() * W, y, W * (0.05 + rng() * 0.3), 0.6 + p * 1.6);
      }
    }

    // sun path on the water
    g.globalCompositeOperation = "lighter";
    for (let y = hz; y < lakeB; y += 1.4) {
      const p = (y - hz) / (lakeB - hz);
      const half = W * (0.006 + 0.075 * Math.pow(p, 1.2));
      const a = 0.5 * Math.pow(1 - p, 1.5) + 0.04;
      const segs = 2 + Math.floor(rng() * 4);
      for (let s = 0; s < segs; s++) {
        const cx = SUN.x + (rng() - 0.5) * 2 * half * rng();
        const len = half * (0.1 + rng() * 0.5);
        g.fillStyle = `rgba(255,236,200,${a * rng()})`;
        g.fillRect(cx - len / 2, y, len, 0.9 + p);
      }
    }
    g.globalCompositeOperation = "source-over";
    g.restore();

    // far shoreline treeline
    const shore = new Float32Array(n + 1);
    for (let i = 0; i <= n; i++) shore[i] = 1 + rng();
    addTrees(shore, rng, n * 1.6, 5 * (H / 900));
    g.fillStyle = mixHex(HAZE, INK, 0.6);
    g.beginPath(); g.moveTo(0, hz + 3);
    for (let i = 0; i <= n; i++) g.lineTo((i / n) * W, hz + 1 - shore[i]);
    g.lineTo(W, hz + 3); g.closePath(); g.fill();

    // near hill the figures stand on
    const hr = ridge(rng, 256, 0.55);
    const yb = H * 0.84;
    const hy = i => yb - hr[i] * H * 0.035;
    const hg = g.createLinearGradient(0, yb - H * 0.035, 0, H);
    hg.addColorStop(0, "#2c2023");
    hg.addColorStop(1, "#0b0708");
    g.fillStyle = hg;
    g.beginPath(); g.moveTo(0, H);
    for (let i = 0; i <= 256; i++) g.lineTo((i / 256) * W, hy(i));
    g.lineTo(W, H); g.closePath(); g.fill();
    const rr = g.createLinearGradient(0, 0, W, 0);
    rr.addColorStop(0, "rgba(255,220,170,0)");
    rr.addColorStop(clamp(sxr - 0.3, 0.01, 0.98), "rgba(255,220,170,0)");
    rr.addColorStop(sxr, "rgba(255,226,180,.75)");
    rr.addColorStop(clamp(sxr + 0.3, 0.02, 0.99), "rgba(255,220,170,0)");
    rr.addColorStop(1, "rgba(255,220,170,0)");
    g.strokeStyle = rr; g.lineWidth = 1.6;
    g.beginPath();
    for (let i = 0; i <= 256; i++) g[i ? "lineTo" : "moveTo"]((i / 256) * W, hy(i) + 0.6);
    g.stroke();
  }

  /* ---------- Clouds (tileable fBm, lit from below) ---------- */
  function renderClouds() {
    const cw = 360, ch = 150;
    cloudsC.width = cw * 2; cloudsC.height = ch;
    const g = cloudsC.getContext("2d");
    const img = g.createImageData(cw, ch);
    const shade = [170, 146, 146], lit = [255, 242, 222];
    for (let y = 0; y < ch; y++) {
      const vm = smoothstep(0, 0.22, y / ch) * (1 - smoothstep(0.45, 0.95, y / ch));
      for (let x = 0; x < cw; x++) {
        const nx = (x / cw) * 6, ny = (y / ch) * 2.5;
        const nv = noise.fbm(nx, ny, 5, 6);
        const n2 = noise.fbm(nx + 0.04, ny + 0.12, 5, 6);
        const a = smoothstep(0.5, 0.8, nv) * vm;
        const l = clamp((nv - n2) * 6 + 0.55, 0, 1);
        const i = (y * cw + x) * 4;
        img.data[i]     = lerp(shade[0], lit[0], l);
        img.data[i + 1] = lerp(shade[1], lit[1], l);
        img.data[i + 2] = lerp(shade[2], lit[2], l);
        img.data[i + 3] = a * 210;
      }
    }
    g.putImageData(img, 0, 0);
    g.putImageData(img, cw, 0);
  }

  /* ---------- Crepuscular rays ---------- */
  function renderRays() {
    const s = 512;
    raysC.width = raysC.height = s;
    const g = raysC.getContext("2d");
    const rng = mulberry32(21);
    g.translate(s / 2, s / 2);
    for (let i = 0; i < 120; i++) {
      const ang = rng() * Math.PI * 2;
      const wd = 0.004 + Math.pow(rng(), 3) * 0.05;
      g.fillStyle = `rgba(255,232,190,${0.02 + rng() * 0.1})`;
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, s / 2, ang, ang + wd); g.closePath(); g.fill();
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = "destination-in";
    const m = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    m.addColorStop(0, "rgba(0,0,0,1)"); m.addColorStop(0.15, "rgba(0,0,0,.85)");
    m.addColorStop(0.5, "rgba(0,0,0,.3)"); m.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = m; g.fillRect(0, 0, s, s);

    const S = Math.max(BW, BH) * 2.4;
    Object.assign(raysC.style, {
      width: S + "px", height: S + "px",
      left: SUN.x - S / 2 + "px", top: SUN.y - S / 2 + "px"
    });
  }

  /* ---------- Drifting mist ---------- */
  function renderFog() {
    const w = 512, h = 96, c = mk(w, h), g = c.getContext("2d");
    const img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      const vm = Math.pow(Math.sin(Math.PI * y / h), 1.4);
      for (let x = 0; x < w; x++) {
        const nv = noise.fbm((x / w) * 8, (y / h) * 1.5 + 40, 5, 8);
        const i = (y * w + x) * 4;
        img.data[i] = 255; img.data[i + 1] = 236; img.data[i + 2] = 212;
        img.data[i + 3] = smoothstep(0.35, 0.8, nv) * vm * 230;
      }
    }
    g.putImageData(img, 0, 0);
    const url = c.toDataURL();
    document.querySelectorAll(".fog").forEach(f => (f.style.backgroundImage = `url(${url})`));
  }

  /* ---------- Diffraction spikes ---------- */
  function renderSpikes() {
    const s = 512;
    spikesC.width = spikesC.height = s;
    const g = spikesC.getContext("2d");
    g.translate(s / 2, s / 2);
    for (let i = 0; i < 12; i++) {
      g.save();
      g.rotate(i * (Math.PI / 6) + 0.21);
      const len = (i % 2 ? 0.55 : 1) * s / 2;
      const lg = g.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, "rgba(255,248,230,.9)");
      lg.addColorStop(1, "rgba(255,230,190,0)");
      g.fillStyle = lg;
      g.beginPath(); g.moveTo(0, -1.4); g.lineTo(len, 0); g.lineTo(0, 1.4); g.fill();
      g.restore();
    }
  }

  /* =========================================================
     Petals: translucent, backlit, with depth of field
     ========================================================= */
  const SPR = 1.6;                    // sprite canvas : petal size
  const SHAPES = [
    { w: 0, notch: 8, skew: 0 },
    { w: 1, notch: 6, skew: 2 },
    { w: -1, notch: 9.5, skew: -2 }
  ];
  const PAL_LIT   = { base: "#f29a83", mid: "#ffd4c0", edge: "#fff6e8", vein: "rgba(220,120,90,.2)",  deep: "rgba(214,98,74,.55)" };
  const PAL_SHADE = { base: "#c66d8a", mid: "#e6a9bc", edge: "#f6dbe3", vein: "rgba(150,60,90,.22)",  deep: "rgba(160,72,104,.55)" };

  function petalPath(g, v) {
    g.beginPath();
    g.moveTo(32, 60);
    g.bezierCurveTo(14 - v.w * 4, 50, 4 - v.w * 4 + v.skew, 30, 14 + v.skew, 12);
    g.quadraticCurveTo(20, 4, 27, 7);
    g.lineTo(32, 7 + v.notch);
    g.lineTo(37, 7);
    g.quadraticCurveTo(44, 4, 50 - v.skew * 0.5, 12);
    g.bezierCurveTo(60 + v.w * 4, 30, 50 + v.w * 4, 50, 32, 60);
    g.closePath();
  }

  function makePetal(v, pal, seed) {
    const c = mk(160), g = c.getContext("2d");
    const rng = mulberry32(seed);
    g.translate(30, 30);
    g.scale(100 / 64, 100 / 64);
    g.globalAlpha = 0.93;

    petalPath(g, v);
    const gr = g.createRadialGradient(32, 58, 1, 32, 32, 46);
    gr.addColorStop(0, pal.base);
    gr.addColorStop(0.35, pal.mid);
    gr.addColorStop(1, pal.edge);
    g.fillStyle = gr;
    g.fill();

    g.save();
    g.clip();
    g.globalAlpha = 1;
    glow(g, 32, 61, 12, [[0, pal.deep], [1, "rgba(0,0,0,0)"]]);
    g.strokeStyle = pal.vein; g.lineWidth = 0.35;
    for (let k = 0; k < 15; k++) {
      const ang = -0.9 + k * (1.8 / 14) + (rng() - 0.5) * 0.05;
      g.beginPath();
      g.moveTo(32, 59);
      g.quadraticCurveTo(32 + Math.sin(ang) * 22, 58 - Math.cos(ang) * 26, 32 + Math.sin(ang) * 50, 58 - Math.cos(ang) * 50);
      g.stroke();
    }
    const cup = g.createLinearGradient(8, 30, 56, 30);
    cup.addColorStop(0, "rgba(60,20,30,.12)");
    cup.addColorStop(0.5, "rgba(0,0,0,0)");
    cup.addColorStop(1, "rgba(255,255,255,.14)");
    g.fillStyle = cup; g.fillRect(0, 0, 64, 64);
    for (let k = 0; k < 160; k++) {
      g.fillStyle = rng() < 0.5 ? "rgba(255,255,255,.05)" : "rgba(120,40,60,.04)";
      g.fillRect(rng() * 64, rng() * 64, 0.6, 0.6);
    }
    g.restore();

    petalPath(g, v);
    g.globalAlpha = 1;
    g.strokeStyle = "rgba(255,250,238,.55)";
    g.lineWidth = 0.7;
    g.stroke();
    return c;
  }

  function blurSprite(src, levels) {
    let cur = src, s = src.width;
    for (let i = 0; i < levels; i++) {
      s = Math.max(4, s >> 1);
      const t = mk(s), g = t.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(cur, 0, 0, s, s);
      cur = t;
    }
    while (s < src.width) {
      s = Math.min(src.width, s * 2);
      const t = mk(s), g = t.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(cur, 0, 0, s, s);
      cur = t;
    }
    return cur;
  }

  function hazed(src) {
    const c = mk(src.width), g = c.getContext("2d");
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = "source-atop";
    g.fillStyle = "rgba(240,212,176,.5)";
    g.fillRect(0, 0, c.width, c.height);
    return blurSprite(c, 1);
  }

  const S_LIT = [], S_SHADE = [], S_LITB = [], S_SHADEB = [], S_FAR = [];
  SHAPES.forEach((v, i) => {
    const lit = makePetal(v, PAL_LIT, 100 + i);
    const shade = makePetal(v, PAL_SHADE, 200 + i);
    S_LIT.push(lit); S_SHADE.push(shade);
    S_LITB.push(blurSprite(lit, 4)); S_SHADEB.push(blurSprite(shade, 4));
    S_FAR.push(hazed(lit));
  });

  const DUST = (() => {
    const c = mk(32), g = c.getContext("2d");
    glow(g, 16, 16, 16, [[0, "rgba(255,248,230,1)"], [0.3, "rgba(255,230,190,.45)"], [1, "rgba(255,230,190,0)"]]);
    return c;
  })();
  const BOKEH = (() => {
    const c = mk(128), g = c.getContext("2d");
    glow(g, 64, 64, 64, [
      [0, "rgba(255,236,205,.10)"], [0.8, "rgba(255,236,205,.16)"],
      [0.9, "rgba(255,242,220,.38)"], [1, "rgba(255,242,220,0)"]
    ]);
    return c;
  })();

  /* ---------- Original 3D rotation ---------- */
  function rotateVector(x, y, z, ax, ay, az) {
    let cos = Math.cos(az), sin = Math.sin(az);
    const x1 = x * cos - y * sin;
    const y1 = x * sin + y * cos;
    const z1 = z;
    cos = Math.cos(ay); sin = Math.sin(ay);
    const x2 = x1 * cos + z1 * sin;
    const y2 = y1;
    const z2 = -x1 * sin + z1 * cos;
    cos = Math.cos(ax); sin = Math.sin(ax);
    return { x: x2, y: y2 * cos - z2 * sin, z: y2 * sin + z2 * cos };
  }

  /* ---------- Original physics, extended with depth layers ---------- */
  const baseSettings = {
    minWind: 1, maxWind: 10,
    minSize: 14, maxSize: 38,
    emitterY: 0.15, emitterSpread: 0.85,
    gravity: 0.6, turbulence: 0.8,
    rotationSpeed: 0, tumbleStrength: 0.4, staticTilt: 0,
    particleCount: 150,
    opacity: 1,
    direction: -1 // -1 = right to left, 1 = left to right
  };

  class Particle {
    constructor(field, onScreen) { this.f = field; this.reset(onScreen); }

    reset(onScreen = false) {
      const { s, c } = this.f;
      this.shape = (Math.random() * SHAPES.length) | 0;
      this.width = c.minSize + Math.random() * (c.maxSize - c.minSize);
      this.height = this.width;

      const centerY = VH * s.emitterY, spread = VH * s.emitterSpread;
      this.y = centerY - spread / 2 + Math.random() * spread;
      if (onScreen) this.x = Math.random() * VW;
      else this.x = s.direction === -1
        ? VW + this.width + Math.random() * VW * 0.6
        : -this.width - Math.random() * VW * 0.6;

      const sizeFactor = (this.width - c.minSize) / (c.maxSize - c.minSize || 1);
      this.windFactor = clamp(1 - (sizeFactor * 0.5 + Math.random() * 0.5), 0.1, 1);
      this.alpha = s.opacity * (0.5 + 0.5 * sizeFactor);

      this.vx = 0; this.vy = 0;
      this.waveOffset = Math.random() * Math.PI * 2;
      this.angleZ = Math.random() * Math.PI * 2;
      this.spinZ = (Math.random() - 0.5) * s.rotationSpeed;
      this.angleX = Math.random() * Math.PI;
      this.angleY = Math.random() * Math.PI;
      this.spinX = (Math.random() - 0.5) * 0.1;
      this.spinY = (Math.random() - 0.5) * 0.1;
    }

    update(gust) {
      const { s, c } = this.f;
      const targetSpeed = (c.minWind + (c.maxWind - c.minWind) * this.windFactor) * (1 + gust);
      this.vx += (targetSpeed - this.vx) * 0.1 * SPEED;
      this.x += this.vx * s.direction * SPEED;

      const gravityMod = 1.5 - this.windFactor;
      this.vy += s.gravity * 0.05 * gravityMod * SPEED;
      const wave = Math.sin(this.x * 0.01 * s.direction + this.waveOffset);
      this.vy += wave * s.turbulence * 0.05 * (1 + gust * 0.6) * SPEED;
      this.vy *= Math.pow(0.98, SPEED);
      this.y += this.vy * SPEED;

      this.angleZ += (this.spinZ + this.vx * 0.002) * SPEED;
      if (s.tumbleStrength > 0) {
        const t = s.tumbleStrength * (1 + gust);
        this.angleX += this.spinX * t * SPEED;
        this.angleY += this.spinY * t * SPEED;
      }

      const buffer = 200;
      const outByX = s.direction === -1 ? this.x < -buffer : this.x > VW + buffer;
      if (outByX || this.y > VH + buffer || this.y < -buffer * 2) this.reset(false);
    }

    draw(ctx) {
      const f = this.f;
      const U = rotateVector(1, 0, 0, this.angleX, this.angleY + f.tilt, this.angleZ);
      const V = rotateVector(0, 1, 0, this.angleX, this.angleY + f.tilt, this.angleZ);
      const face = Math.abs(U.x * V.y - U.y * V.x);
      const d = this.width * SPR, h = d / 2;

      if (f.kind === "far") {
        ctx.setTransform(f.dpr * U.x, f.dpr * U.y, f.dpr * V.x, f.dpr * V.y, f.dpr * this.x, f.dpr * this.y);
        ctx.globalAlpha = this.alpha * (0.55 + 0.45 * face);
        ctx.drawImage(S_FAR[this.shape], -h, -h, d, d);
        return;
      }

      const dx = this.x - SUNS.x, dy = this.y - SUNS.y;
      const prox = Math.exp(-(dx * dx + dy * dy) / (2 * SIG2));
      const lit = Math.min(1, 0.2 + face * 0.5 + prox * 0.6);
      const near = f.kind === "near";
      const L = near ? S_LITB : S_LIT, S = near ? S_SHADEB : S_SHADE;

      if (near) {
        for (let k = 3; k >= 1; k--) {
          ctx.setTransform(f.dpr * U.x, f.dpr * U.y, f.dpr * V.x, f.dpr * V.y,
            f.dpr * (this.x - this.vx * f.s.direction * k * 1.8), f.dpr * (this.y - this.vy * k * 1.8));
          ctx.globalAlpha = this.alpha * 0.1 * (4 - k);
          ctx.drawImage(L[this.shape], -h, -h, d, d);
        }
      }

      ctx.setTransform(f.dpr * U.x, f.dpr * U.y, f.dpr * V.x, f.dpr * V.y, f.dpr * this.x, f.dpr * this.y);
      ctx.globalAlpha = this.alpha * (0.7 + 0.3 * face);
      ctx.drawImage(S[this.shape], -h, -h, d, d);
      ctx.globalAlpha = this.alpha * lit;
      ctx.drawImage(L[this.shape], -h, -h, d, d);
    }
  }

  class Field {
    constructor(kind, cfg) {
      this.kind = kind;
      this.s = Object.assign({}, baseSettings, cfg);
      this.c = {
        minSize: Math.min(this.s.minSize, this.s.maxSize),
        maxSize: Math.max(this.s.minSize, this.s.maxSize),
        minWind: Math.min(this.s.minWind, this.s.maxWind),
        maxWind: Math.max(this.s.minWind, this.s.maxWind)
      };
      this.tilt = (this.s.staticTilt * Math.PI) / 180;
      this.dpr = 1;
      this.particles = [];
    }
    init() {
      this.particles = [];
      for (let i = 0; i < this.s.particleCount; i++) this.particles.push(new Particle(this, Math.random() < 0.65));
    }
    step(ctx, gust) {
      for (const p of this.particles) { p.update(gust); p.draw(ctx); }
    }
  }

  /* =========================================================
     Grass, dust, bokeh, glitter
     ========================================================= */
  let blades = [], GH = 0;
  function buildGrass() {
    GH = Math.round(VH * 0.24);
    const W = VW + PAD * 2;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    grassC.width = Math.round(W * dpr); grassC.height = Math.round(GH * dpr);
    grassX.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(W / (reduceMotion ? 4 : 2.4));
    blades = [];
    for (let i = 0; i < count; i++) {
      const z = Math.random();
      blades.push({
        x: Math.random() * W,
        z,
        h: GH * (0.22 + Math.random() * 0.55) * (0.55 + 0.6 * z),
        w: 1.1 + 2.6 * z,
        lean: (Math.random() - 0.5) * 0.3 - 0.06,
        phase: Math.random() * Math.PI * 2,
        bucket: Math.min(GRASS_TONES - 1, Math.floor(Math.pow(z, 0.7) * GRASS_TONES)),
        seed: Math.random() < 0.06
      });
    }
    blades.sort((a, b) => a.z - b.z);
  }
  const GRASS_TONES = 6;
  const GRASS_COLS = Array.from({ length: GRASS_TONES }, (_, i) => mixHex("#4b3832", "#0a0607", (i + 0.5) / GRASS_TONES));
  const RIM_LEVELS = 5;

  function drawGrass(t, gust) {
    const W = VW + PAD * 2, H = GH, g = grassX;
    g.clearRect(0, 0, W, H);
    const ground = g.createLinearGradient(0, H * 0.45, 0, H);
    ground.addColorStop(0, "rgba(14,9,10,0)");
    ground.addColorStop(0.45, "rgba(14,9,10,.94)");
    ground.addColorStop(1, "#090506");
    g.fillStyle = ground;
    g.fillRect(0, H * 0.45, W, H * 0.55);

    const sunX = SUNS.x + PAD - gx;
    const rim = g.createLinearGradient(0, 0, 0, H * 0.8);
    rim.addColorStop(0, "rgba(255,214,150,.95)");
    rim.addColorStop(1, "rgba(255,214,150,0)");
    const sw = VW * 0.35;

    // Blades are batched into a few tone buckets: one fill per bucket, back to front.
    for (const b of blades) {
      const sway = Math.sin(t * 1.6 + b.x * 0.012 + b.phase) * 0.12
                 + Math.sin(t * 0.7 + b.x * 0.004) * 0.07
                 - gust * 0.28;
      const bend = (b.lean + sway) * b.h;
      b.tx = b.x + bend;
      b.ty = H + 2 - b.h * (1 - 0.12 * Math.abs(sway));
      b.cx = b.x + bend * 0.15;
      b.cy = H + 2 - b.h * 0.55;
      b.bend = bend;
    }
    for (let k = 0; k < GRASS_TONES; k++) {
      g.fillStyle = GRASS_COLS[k];
      g.beginPath();
      for (const b of blades) {
        if (b.bucket !== k) continue;
        g.moveTo(b.x - b.w / 2, H + 2);
        g.quadraticCurveTo(b.cx - b.w * 0.3, b.cy, b.tx, b.ty);
        g.quadraticCurveTo(b.cx + b.w * 0.3, b.cy, b.x + b.w / 2, H + 2);
        g.closePath();
        if (b.seed) {
          g.moveTo(b.tx + 1.6 + b.z * 1.5, b.ty);
          g.ellipse(b.tx, b.ty, 1.6 + b.z * 1.5, 3 + b.z * 3, b.bend * 0.004, 0, Math.PI * 2);
        }
      }
      g.fill();
    }

    // Backlit rim on blade edges, batched by brightness level.
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = rim;
    g.lineWidth = 0.9;
    for (let lv = 1; lv <= RIM_LEVELS; lv++) {
      g.globalAlpha = lv / RIM_LEVELS;
      g.beginPath();
      for (const b of blades) {
        if (b.z > 0.85) continue;
        const dd = (b.x - sunX) / sw;
        const a = (Math.exp(-dd * dd) * 0.85 + 0.12) * (0.35 + 0.65 * (1 - b.z));
        if (Math.max(1, Math.ceil(a * RIM_LEVELS)) !== lv) continue;
        g.moveTo(b.x - b.w / 2, H + 2);
        g.quadraticCurveTo(b.cx - b.w * 0.3, b.cy, b.tx, b.ty);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
  }

  let dust = [], bokeh = [], sparkles = [];
  function buildAtmos() {
    dust = Array.from({ length: reduceMotion ? 30 : 90 }, () => ({
      x: Math.random() * VW, y: Math.random() * VH,
      vx: 0, vy: 0, r: 0.6 + Math.random() * 1.6, ph: Math.random() * 6.28
    }));
    bokeh = Array.from({ length: 8 }, () => ({
      x: Math.random() * VW, y: VH * (0.25 + Math.random() * 0.6),
      r: 30 + Math.random() * 90, ph: Math.random() * 6.28, sp: 0.15 + Math.random() * 0.35
    }));
    sparkles = Array.from({ length: reduceMotion ? 50 : 160 }, newSparkle);
  }
  function newSparkle() {
    return { p: Math.pow(Math.random(), 1.6), off: (Math.random() - 0.5) * 2 * Math.random(), ph: Math.random() * 6.28, sp: 2 + Math.random() * 5 };
  }

  function drawGlitter(t) {
    const g = glitterX;
    g.clearRect(0, HORIZON - 2, BW, LAKEB - HORIZON + 4);
    g.globalCompositeOperation = "lighter";
    for (const s of sparkles) {
      const v = Math.sin(t * s.sp + s.ph);
      const a = Math.pow(Math.max(0, v), 8);
      if (a < 0.01) { if (Math.random() < 0.02) Object.assign(s, newSparkle()); continue; }
      const y = HORIZON + 2 + s.p * (LAKEB - HORIZON - 4);
      const spread = BW * (0.008 + 0.075 * Math.pow(s.p, 1.2));
      const x = SUN.x + s.off * spread;
      const w = 1.5 + s.p * 8, hh = 0.8 + s.p * 1.2;
      g.fillStyle = `rgba(255,247,226,${a * (1 - s.p * 0.5)})`;
      g.fillRect(x - w / 2, y, w, hh);
    }
    g.globalCompositeOperation = "source-over";
  }

  function drawDust(ctx, t, gust, dpr) {
    ctx.globalCompositeOperation = "lighter";
    const sig = 2 * Math.pow(VW * 0.3, 2);
    for (const d of dust) {
      d.vx += (Math.random() - 0.5) * 0.03 - 0.004 - gust * 0.05;
      d.vy += (Math.random() - 0.5) * 0.03;
      d.vx *= 0.97; d.vy *= 0.97;
      d.x += d.vx * SPEED; d.y += d.vy * SPEED;
      if (d.x < -10) d.x = VW + 10; if (d.x > VW + 10) d.x = -10;
      if (d.y < -10) d.y = VH + 10; if (d.y > VH + 10) d.y = -10;
      const dx = d.x - SUNS.x, dy = d.y - SUNS.y;
      const a = Math.exp(-(dx * dx + dy * dy) / sig) * (0.55 + 0.45 * Math.sin(t * 2 + d.ph));
      if (a < 0.02) continue;
      ctx.globalAlpha = a;
      const s = d.r * 6;
      ctx.setTransform(dpr, 0, 0, dpr, dpr * d.x, dpr * d.y);
      ctx.drawImage(DUST, -s / 2, -s / 2, s, s);
    }
    for (const b of bokeh) {
      b.x -= b.sp * (1 + gust * 3) * SPEED;
      if (b.x < -b.r * 2) { b.x = VW + b.r * 2; b.y = VH * (0.25 + Math.random() * 0.6); }
      const dx = b.x - SUNS.x, dy = b.y - SUNS.y;
      const a = (0.25 + Math.exp(-(dx * dx + dy * dy) / (sig * 1.6)) * 0.75) * (0.7 + 0.3 * Math.sin(t * 0.8 + b.ph));
      ctx.globalAlpha = a;
      ctx.setTransform(dpr, 0, 0, dpr, dpr * b.x, dpr * b.y);
      ctx.drawImage(BOKEH, -b.r, -b.r, b.r * 2, b.r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* =========================================================
     Lens flare
     ========================================================= */
  const flare = $("flare");
  const bloomEl = $("bloom"), coreEl = $("core"), streakEl = $("streak");
  const GHOSTS = [
    { k: 0.42, size: 0.06, cls: "dot" },
    { k: 0.78, size: 0.16, cls: "hex" },
    { k: 1.18, size: 0.09, cls: "warm" },
    { k: 1.5,  size: 0.3,  cls: "ring" },
    { k: 1.85, size: 0.11, cls: "hex" },
    { k: 2.2,  size: 0.05, cls: "dot" }
  ].map(o => {
    const el = document.createElement("div");
    el.className = "ghost " + o.cls;
    flare.appendChild(el);
    return Object.assign(o, { el });
  });

  function placeAt(el, x, y, w, h) {
    el.style.transform = `translate3d(${x - w / 2}px, ${y - h / 2}px, 0)`;
  }

  function updateFlare() {
    const vmax = Math.max(VW, VH), vmin = Math.min(VW, VH);
    placeAt(bloomEl, SUNS.x, SUNS.y, vmax * 1.5, vmax * 1.5);
    placeAt(coreEl, SUNS.x, SUNS.y, vmin * 0.3, vmin * 0.3);
    placeAt(streakEl, SUNS.x, SUNS.y, VW * 1.7, VH * 0.07);
    const ss = vmin * 0.75;
    spikesC.style.width = spikesC.style.height = ss + "px";
    placeAt(spikesC, SUNS.x, SUNS.y, ss, ss);
    const cx = VW / 2, cy = VH / 2;
    for (const gh of GHOSTS) {
      const s = gh.size * vmin;
      gh.el.style.width = gh.el.style.height = s + "px";
      placeAt(gh.el, SUNS.x + (cx - SUNS.x) * gh.k, SUNS.y + (cy - SUNS.y) * gh.k, s, s);
    }
  }

  /* =========================================================
     Roof details & parasol ribs
     ========================================================= */
  const cubic = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const rafters = $("rafters"), tileEnds = $("tileEnds"), ribs = $("ribs");
  for (let t = 0.02; t < 0.92; t += 0.034) {
    const x = cubic(800, 560, 330, 120, t), y = cubic(178, 178, 166, 128, t);
    svgEl("rect", { x: x - 5, y, width: 10, height: 13, fill: "#160f10" }, rafters);
    svgEl("rect", { x: x - 5, y: y + 11, width: 10, height: 2, fill: "rgba(184,149,90,.45)" }, rafters);
  }
  for (let t = 0.01; t < 0.96; t += 0.026) {
    svgEl("circle", {
      cx: cubic(800, 560, 330, 120, t), cy: cubic(150, 150, 140, 105, t),
      r: 5.2, fill: "#130e10", stroke: "rgba(184,149,90,.3)", "stroke-width": ".8"
    }, tileEnds);
  }
  for (let t = 0.04; t < 0.97; t += 0.0766) {
    svgEl("line", { x1: 180, y1: 88, x2: 64 + 232 * t, y2: 150 + 40 * t * (1 - t) }, ribs);
  }

  /* =========================================================
     Haiku reveal
     ========================================================= */
  const haiku = document.querySelector(".haiku");
  let idx = 0;
  [...haiku.childNodes].forEach(node => {
    if (node.nodeType !== 3) return;
    const frag = document.createDocumentFragment();
    for (const ch of node.textContent.trim()) {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.transitionDelay = (1.6 + idx * 0.13) + "s";
      idx++;
      frag.appendChild(s);
    }
    node.replaceWith(frag);
  });

  /* =========================================================
     Build & loop
     ========================================================= */
  const density = clamp((innerWidth * innerHeight) / (1440 * 900), 0.5, 1.2) * (reduceMotion ? 0.4 : 1);
  const far  = new Field("far",  { particleCount: Math.round(130 * density), minSize: 5, maxSize: 14, minWind: 1, maxWind: 6, gravity: 0.5, opacity: 0.8, emitterY: 0.2, emitterSpread: 0.9 });
  const mid  = new Field("mid",  { particleCount: Math.round(46 * density),  minSize: 15, maxSize: 32, minWind: 1.5, maxWind: 8 });
  const near = new Field("near", { particleCount: Math.round(9 * density),   minSize: 60, maxSize: 115, minWind: 4, maxWind: 12, opacity: 0.85, emitterY: 0.45, emitterSpread: 1.2 });

  function sizeCanvas(c, ctx, w, h, maxDpr) {
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    return dpr;
  }

  let built = false;
  function build() {
    VW = innerWidth; VH = innerHeight;
    BW = VW + PAD * 2; BH = VH + PAD * 2;
    SIG2 = Math.pow(VW * 0.38, 2);
    renderBackground();
    renderRays();
    glitterC.width = BW; glitterC.height = BH;
    far.dpr = sizeCanvas(sceneC, sceneX, VW, VH, 1.5);
    const fd = sizeCanvas(frontC, frontX, VW, VH, 2);
    mid.dpr = near.dpr = fd;
    buildGrass();
    if (!built) {
      renderClouds(); renderFog(); renderSpikes();
      far.init(); mid.init(); near.init();
      buildAtmos();
      built = true;
    }
  }

  let gust = 0, tx = 0, ty = 0, cx = 0, cy = 0, gx = 0;
  const bgLayer = $("bgLayer"), figLayer = $("figLayer");
  const hint = document.querySelector(".hint");

  function summonWind() {
    if (reduceMotion) return;
    gust = Math.min(gust + GUST_KICK, GUST_KICK * 1.6);
    hint.classList.remove("show");
  }
  addEventListener("pointerdown", summonWind);
  addEventListener("keydown", e => { if (e.code === "Space") summonWind(); });
  addEventListener("pointermove", e => {
    tx = (e.clientX / innerWidth - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
  });

  let clock = 0, lastNow = 0;
  function frame(now) {
    clock += (lastNow ? Math.min(now - lastNow, 50) : 16) * SPEED;
    lastNow = now;
    const t = clock / 1000;
    gust *= Math.pow(0.972, SPEED);

    if (!reduceMotion) { cx += (tx - cx) * 0.04; cy += (ty - cy) * 0.04; }
    const bx = -cx * 8, by = -cy * 5;
    gx = cx * 16;
    bgLayer.style.transform = `translate3d(${bx}px, ${by}px, 0)`;
    figLayer.style.transform = `translate3d(${cx * 12}px, ${cy * 6}px, 0)`;
    grassC.style.transform = `translate3d(${gx}px, ${cy * 7}px, 0)`;

    SUNS.x = SUN.x - PAD + bx;
    SUNS.y = SUN.y - PAD + by;
    updateFlare();

    drawGlitter(t);

    sceneX.setTransform(1, 0, 0, 1, 0, 0);
    sceneX.clearRect(0, 0, sceneC.width, sceneC.height);
    far.step(sceneX, gust);
    sceneX.globalAlpha = 1;

    drawGrass(t, gust);

    frontX.setTransform(1, 0, 0, 1, 0, 0);
    frontX.clearRect(0, 0, frontC.width, frontC.height);
    mid.step(frontX, gust);
    drawDust(frontX, t, gust, mid.dpr);
    near.step(frontX, gust);
    frontX.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 150); });

  /* ------------------------------------------------------------------
       Lab hooks (InstaLanding Motion). The scene works on its own; when it
       is framed, the lab drives it with postMessage and it reports the wind.
         { source: 'il-motion', type: 'speed', value: 0.25 }   petals, grass, dust and the CSS loops
         { ..., type: 'step', value: 1 | -1 }    a gust / a sudden calm
         { ..., type: 'gust', value: 2.2 }       how hard one gust hits
         { ..., type: 'flare', value: true }     the lens flare
         { ..., type: 'haiku', value: true }     the haiku, seal and caption
         { ..., type: 'autoplay', value: true }  a gust every few seconds
    ------------------------------------------------------------------ */
  const setSpeed = (v) => {
    SPEED = Math.max(0.05, Number(v) || 1);
    document.getAnimations().forEach((a) => (a.playbackRate = SPEED));
  };
  let auto = 0;
  const autoplay = (on, ms = 4200) => {
    clearInterval(auto);
    if (on) auto = setInterval(() => { if (!document.hidden) summonWind(); }, ms);
  };
  const qs = new URLSearchParams(location.search);
  if (qs.has("autoplay")) autoplay(true, Number(qs.get("autoplay")) || 4200);
  addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion') return;
    if (d.type === 'speed') setSpeed(d.value);
    if (d.type === 'step') { if (d.value > 0) summonWind(); else gust = 0; }
    if (d.type === 'gust') GUST_KICK = Number(d.value) || 2.2;
    if (d.type === 'flare') document.getElementById("flare").style.display = d.value ? "" : "none";
    if (d.type === 'haiku') document.querySelectorAll(".haiku-wrap, .caption").forEach((el) => (el.style.visibility = d.value ? "" : "hidden"));
    if (d.type === 'autoplay') autoplay(Boolean(d.value));
  });
  if (parent !== window) {
    let last = "";
    const report = () => {
      const text = gust < 0.05 ? "BREEZE · CLICK FOR A GUST" : `GUST ${gust.toFixed(2)} · DYING DOWN`;
      if (text !== last) {
        last = text;
        parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, "*");
      }
      setTimeout(() => requestAnimationFrame(report), 120);
    };
    requestAnimationFrame(report);
  }

  build();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("loaded")));
  setTimeout(() => hint.classList.add("show"), 7000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
