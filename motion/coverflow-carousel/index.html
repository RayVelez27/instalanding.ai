<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coverflow Carousel · InstaLanding Motion</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: hsl(0, 0%, 10%);
    --min-size: 200px;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 0;
    margin: 0;
    background: var(--bg);
    /* The page really scrolls (ScrollTrigger drives the carousel from it), the bar is just hidden */
    scrollbar-width: none;
  }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

  /* Reel mode (?autoplay): a clean, hands-off loop for previews */
  body.is-reel .controls, body.is-reel .scroll-icon { display: none; }
  body.no-reflect .box { -webkit-box-reflect: none; }
  body.no-reflect .box:before, body.no-reflect .box:after { display: none; }

  .drag-proxy {
    visibility: hidden;
    position: absolute;
  }

  .controls {
    position: absolute;
    top: calc(50% + clamp(var(--min-size), 20vmin, 20vmin));
    left: 50%;
    transform: translate(-50%, -50%) scale(1.5);
    display: flex;
    justify-content: space-between;
    min-width: var(--min-size);
    height: 44px;
    width: 20vmin;
    z-index: 300;
  }

  button {
    height: 48px;
    width: 48px;
    border-radius: 50%;
    position: absolute;
    top: 0%;
    outline: transparent;
    cursor: pointer;
    background: none;
    appearance: none;
    border: 0;
    transition: transform 0.1s;
    transform: translate(0, calc(var(--y, 0)));
  }
  button:before {
    border: 2px solid hsl(0, 0%, 90%);
    background: linear-gradient(hsla(0, 0%, 80%, 0.65), hsl(0, 0%, 0%)) hsl(0, 0%, 0%);
    content: '';
    box-sizing: border-box;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 80%;
    width: 80%;
    border-radius: 50%;
  }
  button:active:before {
    background: linear-gradient(hsl(0, 0%, 0%), hsla(0, 0%, 80%, 0.65)) hsl(0, 0%, 0%);
  }
  button:nth-of-type(1) { right: 100%; }
  button:nth-of-type(2) { left: 100%; }

  button span {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }

  button:hover { --y: -5%; }

  button svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg) translate(2%, 0);
    height: 30%;
    fill: hsl(0, 0%, 90%);
  }
  button:nth-of-type(1) svg {
    transform: translate(-50%, -50%) rotate(180deg) translate(2%, 0);
  }

  .scroll-icon {
    height: 30px;
    position: fixed;
    top: 1rem;
    right: 1rem;
    color: hsl(0, 0%, 90%);
    animation: action 4s infinite;
  }

  @keyframes action {
    0%, 25%, 50%, 100% { transform: translate(0, 0); }
    12.5%, 37.5% { transform: translate(0, 25%); }
  }

  .boxes {
    height: 100vh;
    width: 100%;
    overflow: hidden;
    position: absolute;
    transform-style: preserve-3d;
    perspective: 800px;
    touch-action: none;
  }

  .box {
    transform-style: preserve-3d;
    position: absolute;
    top: 50%;
    left: 50%;
    height: 20vmin;
    width: 20vmin;
    min-height: var(--min-size);
    min-width: var(--min-size);
    display: none;
  }
  .box:after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    height: 100%;
    width: 100%;
    background-image: var(--src);
    background-size: cover;
    transform: translate(-50%, -50%) rotate(180deg) translate(0, -100%) translate(0, -0.5vmin);
    opacity: 0.75;
  }
  .box:before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    height: 100%;
    width: 100%;
    background: linear-gradient(var(--bg) 50%, transparent);
    transform: translate(-50%, -50%) rotate(180deg) translate(0, -100%) translate(0, -0.5vmin) scale(1.01);
    z-index: 2;
  }
  .box img {
    position: absolute;
    height: 100%;
    width: 100%;
    top: 0;
    left: 0;
    object-fit: cover;
  }
  .box:nth-of-type(odd) { background: hsl(90, 80%, 70%); }
  .box:nth-of-type(even) { background: hsl(90, 80%, 40%); }

  @supports (-webkit-box-reflect: below) {
    .box {
      -webkit-box-reflect: below 0.5vmin linear-gradient(transparent 0 50%, white 100%);
    }
    .box:after,
    .box:before {
      display: none;
    }
  }
</style>
</head>
<body>
  <div class="boxes">
    <!-- album boxes are generated by the script below -->
    <div class="controls">
      <button class="next">
        <span>Previous album</span>
        <svg viewBox="0 0 448 512" width="100" title="Previous Album">
          <path d="M424.4 214.7L72.4 6.6C43.8-10.3 0 6.1 0 47.9V464c0 37.5 40.7 60.1 72.4 41.3l352-208c31.4-18.5 31.5-64.1 0-82.6z"/>
        </svg>
      </button>
      <button class="prev">
        <span>Next album</span>
        <svg viewBox="0 0 448 512" width="100" title="Next Album">
          <path d="M424.4 214.7L72.4 6.6C43.8-10.3 0 6.1 0 47.9V464c0 37.5 40.7 60.1 72.4 41.3l352-208c31.4-18.5 31.5-64.1 0-82.6z"/>
        </svg>
      </button>
    </div>
  </div>

  <svg class="scroll-icon" viewBox="0 0 24 24">
    <path fill="currentColor" d="M20 6H23L19 2L15 6H18V18H15L19 22L23 18H20V6M9 3.09C11.83 3.57 14 6.04 14 9H9V3.09M14 11V15C14 18.3 11.3 21 8 21S2 18.3 2 15V11H14M7 9H2C2 6.04 4.17 3.57 7 3.09V9Z"/>
  </svg>
  <div class="drag-proxy"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.0/Draggable.min.js"></script>

  <script>
  /* ------------------------------------------------------------------
     Code-generated album covers (replaces the image URLs)
  ------------------------------------------------------------------ */
  const rng = seed => () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }

  const svg = (bg, body, label, ink = 'rgba(255,255,255,0.85)') =>
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'>` +
    `<rect width='300' height='300' fill='${bg}'/>${body}` +
    `<text x='16' y='284' font-family='monospace' font-size='13' letter-spacing='2' fill='${ink}'>${label}</text>` +
    `</svg>`

  const COVER_ART = [
    // 1. Setting sun rings
    () => {
      let b = ''
      for (let i = 0; i < 9; i++) {
        b += `<circle cx='150' cy='210' r='${170 - i * 19}' fill='hsl(${345 + i * 6}, 85%, ${45 + i * 4}%)'/>`
      }
      return svg('hsl(260, 45%, 18%)', b, 'DUSKLINE')
    },
    // 2. Diagonal stripes
    () => {
      let b = ''
      for (let i = -10; i < 22; i++) {
        b += `<line x1='${i * 26 - 150}' y1='0' x2='${i * 26}' y2='300' stroke='hsl(${200 + (i % 3) * 15}, 80%, ${50 + (i % 2) * 15}%)' stroke-width='11'/>`
      }
      return svg('hsl(210, 60%, 15%)', b, 'TRANSIT')
    },
    // 3. Dot field
    () => {
      let b = ''
      for (let x = 0; x < 10; x++) for (let y = 0; y < 10; y++) {
        const d = Math.hypot(x - 4.5, y - 4.5)
        b += `<circle cx='${x * 30 + 15}' cy='${y * 30 + 15}' r='${Math.max(1.5, 12 - d * 2)}' fill='hsl(${150 + d * 10}, 70%, 60%)'/>`
      }
      return svg('hsl(170, 30%, 10%)', b, 'SIGNAL')
    },
    // 4. Waves
    () => {
      let b = ''
      for (let i = 0; i < 14; i++) {
        let d = `M0 ${20 + i * 20}`
        for (let x = 0; x <= 300; x += 10) {
          d += ` L${x} ${20 + i * 20 + Math.sin(x / 30 + i * 0.6) * 12}`
        }
        b += `<path d='${d}' fill='none' stroke='hsl(${30 + i * 4}, 90%, ${55 + i}%)' stroke-width='3'/>`
      }
      return svg('hsl(15, 30%, 12%)', b, 'TIDES')
    },
    // 5. Triangle mosaic
    () => {
      const r = rng(5)
      let b = ''
      const s = 50
      for (let x = 0; x < 6; x++) for (let y = 0; y < 6; y++) {
        const X = x * s, Y = y * s
        const h = 300 + r() * 80
        b += `<polygon points='${X},${Y} ${X + s},${Y} ${X},${Y + s}' fill='hsl(${h % 360}, 70%, ${35 + r() * 35}%)'/>`
        b += `<polygon points='${X + s},${Y} ${X + s},${Y + s} ${X},${Y + s}' fill='hsl(${(h + 20) % 360}, 70%, ${35 + r() * 35}%)'/>`
      }
      return svg('#000', b, 'PRISM')
    },
    // 6. Crescent night
    () => {
      const r = rng(6)
      let b = ''
      for (let i = 0; i < 70; i++) {
        b += `<circle cx='${r() * 300}' cy='${r() * 300}' r='${r() * 1.6 + 0.3}' fill='white' opacity='${0.4 + r() * 0.6}'/>`
      }
      b += `<circle cx='180' cy='120' r='62' fill='hsl(45, 80%, 85%)'/>`
      b += `<circle cx='158' cy='104' r='56' fill='hsl(230, 50%, 14%)'/>`
      b += `<rect y='230' width='300' height='70' fill='hsl(230, 40%, 8%)'/>`
      return svg('hsl(230, 50%, 14%)', b, 'NOCTURNE')
    },
    // 7. Bauhaus shapes
    () => {
      const b =
        `<rect x='30' y='40' width='120' height='150' fill='hsl(220, 70%, 40%)'/>` +
        `<path d='M150 230 A90 90 0 0 1 300 230 Z' transform='translate(-30 0)' fill='hsl(5, 75%, 50%)'/>` +
        `<circle cx='215' cy='95' r='50' fill='hsl(45, 95%, 55%)'/>` +
        `<line x1='20' y1='240' x2='280' y2='240' stroke='#111' stroke-width='6'/>`
      return svg('hsl(40, 40%, 90%)', b, 'FORM/FUNCTION', '#111')
    },
    // 8. Soft glow blobs
    () => {
      const b =
        `<defs><filter id='f'><feGaussianBlur stdDeviation='28'/></filter></defs>` +
        `<g filter='url(#f)'>` +
        `<circle cx='100' cy='110' r='80' fill='hsl(280, 90%, 60%)'/>` +
        `<circle cx='200' cy='170' r='90' fill='hsl(190, 90%, 55%)'/>` +
        `<circle cx='140' cy='220' r='60' fill='hsl(330, 90%, 65%)'/>` +
        `</g>`
      return svg('hsl(260, 40%, 10%)', b, 'AFTERGLOW')
    },
    // 9. Tilted checkerboard
    () => {
      let b = `<g transform='rotate(18 150 150)'>`
      for (let x = -4; x < 14; x++) for (let y = -4; y < 14; y++) {
        if ((x + y) % 2 === 0) b += `<rect x='${x * 30}' y='${y * 30}' width='30' height='30' fill='hsl(80, 75%, 55%)'/>`
      }
      b += `</g>`
      return svg('hsl(150, 35%, 14%)', b, 'GRIDLOCK')
    },
    // 10. Sunburst
    () => {
      let b = ''
      const n = 24
      for (let i = 0; i < n; i++) {
        const a1 = (i / n) * Math.PI * 2, a2 = ((i + 0.5) / n) * Math.PI * 2
        b += `<polygon points='150,150 ${150 + Math.cos(a1) * 300},${150 + Math.sin(a1) * 300} ${150 + Math.cos(a2) * 300},${150 + Math.sin(a2) * 300}' fill='hsl(40, 95%, 58%)'/>`
      }
      b += `<circle cx='150' cy='150' r='46' fill='hsl(15, 90%, 50%)'/>`
      return svg('hsl(30, 90%, 48%)', b, 'HIGH NOON', '#2a1200')
    },
  ]

  const COVERS = COVER_ART.map(make => 'data:image/svg+xml,' + encodeURIComponent(make()))

  // Build the boxes (mirrors the Pug loop)
  const BOXES_EL = document.querySelector('.boxes')
  const CONTROLS_EL = document.querySelector('.controls')
  COVERS.forEach((src, b) => {
    const box = document.createElement('div')
    box.className = 'box'
    box.style.setProperty('--src', `url("${src}")`)
    const span = document.createElement('span')
    span.textContent = b + 1
    const img = document.createElement('img')
    img.src = src
    img.alt = `Album ${b + 1}`
    box.append(span, img)
    BOXES_EL.insertBefore(box, CONTROLS_EL)
  })

  /* ------------------------------------------------------------------
     Carousel (original logic)
  ------------------------------------------------------------------ */
  gsap.registerPlugin(ScrollTrigger)
  gsap.registerPlugin(Draggable)

  gsap.set('.box', { yPercent: -50 })

  const STAGGER = 0.1
  const DURATION = 1
  const OFFSET = 0
  const BOXES = gsap.utils.toArray('.box')

  const LOOP = gsap.timeline({ paused: true, repeat: -1, ease: 'none' })

  const SHIFTS = [...BOXES, ...BOXES, ...BOXES]

  SHIFTS.forEach((BOX, index) => {
    const BOX_TL = gsap
      .timeline()
      .set(BOX, { xPercent: 250, rotateY: -50, opacity: 0, scale: 0.5 })
      // Opacity && Scale
      .to(BOX, { opacity: 1, scale: 1, duration: 0.1 }, 0)
      .to(BOX, { opacity: 0, scale: 0.5, duration: 0.1 }, 0.9)
      // Panning
      .fromTo(BOX, { xPercent: 250 }, {
        xPercent: -350, duration: 1, immediateRender: false, ease: 'power1.inOut',
      }, 0)
      // Rotations
      .fromTo(BOX, { rotateY: -50 }, {
        rotateY: 50, immediateRender: false, duration: 1, ease: 'power4.inOut',
      }, 0)
      // Scale && Z
      .to(BOX, { z: 100, scale: 1.25, duration: 0.1, repeat: 1, yoyo: true }, 0.4)
      .fromTo(BOX, { zIndex: 1 }, {
        zIndex: BOXES.length, repeat: 1, yoyo: true, ease: 'none', duration: 0.5, immediateRender: false,
      }, 0)
    LOOP.add(BOX_TL, index * STAGGER)
  })

  const CYCLE_DURATION = STAGGER * BOXES.length
  const START_TIME = CYCLE_DURATION + DURATION * 0.5 + OFFSET

  const LOOP_HEAD = gsap.fromTo(LOOP, { totalTime: START_TIME }, {
    totalTime: `+=${CYCLE_DURATION}`, duration: 1, ease: 'none', repeat: -1, paused: true,
  })

  const PLAYHEAD = { position: 0 }

  const POSITION_WRAP = gsap.utils.wrap(0, LOOP_HEAD.duration())

  const SCRUB = gsap.to(PLAYHEAD, {
    position: 0,
    onUpdate: () => {
      LOOP_HEAD.totalTime(POSITION_WRAP(PLAYHEAD.position))
    },
    paused: true,
    duration: 0.25,
    ease: 'power3',
  })

  let iteration = 0
  const TRIGGER = ScrollTrigger.create({
    start: 0,
    end: '+=2000',
    horizontal: false,
    pin: '.boxes',
    onUpdate: self => {
      const SCROLL = self.scroll()
      if (SCROLL > self.end - 1) {
        WRAP(1, 1)                       // forwards in time
      } else if (SCROLL < 1 && self.direction < 0) {
        WRAP(-1, self.end - 1)           // backwards in time
      } else {
        const NEW_POS = (iteration + self.progress) * LOOP_HEAD.duration()
        SCRUB.vars.position = NEW_POS
        SCRUB.invalidate().restart()
      }
    },
  })

  const WRAP = (iterationDelta, scrollTo) => {
    iteration += iterationDelta
    TRIGGER.scroll(scrollTo)
    TRIGGER.update()
  }

  const SNAP = gsap.utils.snap(1 / BOXES.length)

  const progressToScroll = progress =>
    gsap.utils.clamp(1, TRIGGER.end - 1, gsap.utils.wrap(0, 1, progress) * TRIGGER.end)

  const scrollToPosition = position => {
    const SNAP_POS = SNAP(position)
    const PROGRESS = (SNAP_POS - LOOP_HEAD.duration() * iteration) / LOOP_HEAD.duration()
    const SCROLL = progressToScroll(PROGRESS)
    if (PROGRESS >= 1 || PROGRESS < 0) return WRAP(Math.floor(PROGRESS), SCROLL)
    TRIGGER.scroll(SCROLL)
  }

  ScrollTrigger.addEventListener('scrollEnd', () => scrollToPosition(SCRUB.vars.position))

  const NEXT = () => scrollToPosition(SCRUB.vars.position - 1 / BOXES.length)
  const PREV = () => scrollToPosition(SCRUB.vars.position + 1 / BOXES.length)

  document.addEventListener('keydown', event => {
    if (event.code === 'ArrowLeft' || event.code === 'KeyA') NEXT()
    if (event.code === 'ArrowRight' || event.code === 'KeyD') PREV()
  })

  document.querySelector('.boxes').addEventListener('click', e => {
    const BOX = e.target.closest('.box')
    if (BOX) {
      const TARGET = BOXES.indexOf(BOX)
      const CURRENT = gsap.utils.wrap(0, BOXES.length, Math.floor(BOXES.length * SCRUB.vars.position))
      let BUMP = TARGET - CURRENT
      if (TARGET > CURRENT && TARGET - CURRENT > BOXES.length * 0.5) {
        BUMP = (BOXES.length - BUMP) * -1
      }
      if (CURRENT > TARGET && CURRENT - TARGET > BOXES.length * 0.5) {
        BUMP = BOXES.length + BUMP
      }
      scrollToPosition(SCRUB.vars.position + BUMP * (1 / BOXES.length))
    }
  })

  window.BOXES = BOXES
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) SCRUB.duration(0)

  document.querySelector('.next').addEventListener('click', NEXT)
  document.querySelector('.prev').addEventListener('click', PREV)

  gsap.set('.box', { display: 'block' })
  gsap.set('button', { z: 200 })

  Draggable.create('.drag-proxy', {
    type: 'x',
    trigger: '.box',
    onPress() {
      this.startOffset = SCRUB.vars.position
    },
    onDrag() {
      SCRUB.vars.position = this.startOffset + (this.startX - this.x) * 0.001
      SCRUB.invalidate().restart()
    },
    onDragEnd() {
      scrollToPosition(SCRUB.vars.position)
    },
  })
  </script>

  <script>
  /* ------------------------------------------------------------------
     Lab hooks (InstaLanding Motion). The page works on its own; when it
     is framed, the lab drives it with postMessage and it reports which
     cover sits in the middle.
       ?autoplay=2200   step forward every 2.2s, controls hidden (previews)
       { source: 'il-motion', type: 'speed', value: 0.25 }   slow motion
       { ..., type: 'perspective', value: 800 }               camera depth (px)
       { ..., type: 'reflect', value: false }                 floor reflection
       { ..., type: 'step', value: 1 | -1 }                   next / previous
       { ..., type: 'autoplay', value: true | false }
  ------------------------------------------------------------------ */
  ;(() => {
    const qs = new URLSearchParams(location.search)
    const TITLES = ['DUSKLINE', 'TRANSIT', 'SIGNAL', 'TIDES', 'PRISM', 'NOCTURNE', 'FORM/FUNCTION', 'AFTERGLOW', 'GRIDLOCK', 'HIGH NOON']
    let timer = 0, kick = 0
    // The first step comes almost at once, so a short hover preview already moves
    const autoplay = (on, ms = 2200) => {
      clearInterval(timer); clearTimeout(kick)
      if (on) {
        kick = setTimeout(() => PREV(), 350)
        timer = setInterval(() => { if (!document.hidden) PREV() }, ms)
      }
    }
    if (qs.has('autoplay')) {
      document.body.classList.add('is-reel')
      autoplay(true, Number(qs.get('autoplay')) || 2200)
    }
    addEventListener('message', (e) => {
      const d = e.data
      if (!d || d.source !== 'il-motion') return
      if (d.type === 'speed') gsap.globalTimeline.timeScale(Math.max(0.05, Number(d.value) || 1))
      if (d.type === 'perspective') BOXES_EL.style.perspective = `${Number(d.value) || 800}px`
      if (d.type === 'reflect') document.body.classList.toggle('no-reflect', !d.value)
      if (d.type === 'step') (d.value > 0 ? PREV : NEXT)()
      if (d.type === 'autoplay') autoplay(Boolean(d.value))
    })
    if (parent === window) return
    let last = -1
    const report = () => {
      const n = BOXES.length
      const i = gsap.utils.wrap(0, n, Math.round(n * SCRUB.vars.position))
      if (i !== last) {
        last = i
        parent.postMessage({ source: 'il-motion-demo', type: 'status', text: `CENTRE ${String(i + 1).padStart(2, '0')}/${n} · ${TITLES[i]}` }, '*')
      }
      requestAnimationFrame(report)
    }
    requestAnimationFrame(report)
  })()
  </script>
</body>
</html>
