        let e = p;
        if (a[2] === 2) {                                   // cubic
          const ip = comps[a[3]];
          e = cubicEase(ip && ip.b ? ip.b : [0.42, 0, 0.58, 1], p);
        }
        return a[1] + (b[1] - a[1]) * e;
      }
    }
    return last[1];
  }
  const PROP = { 13: "x", 14: "y", 15: "r", 16: "sx", 17: "sy" };
  function applyAnim(anim, seconds) {
    let frame = seconds * anim.fps;
    if (anim.loop === 0) frame = Math.min(frame, anim.dur);
    else frame = frame % anim.dur;
    for (const k of anim.keys) {
      const c = comps[k.obj]; if (!c) continue;
      for (const p of k.props) if (PROP[p.key]) c[PROP[p.key]] = sampleProp(p.kf, frame);
    }
  }

  /* ---------- state machine ---------- */
  const SM = SCENE.sm;
  const inputs = SM.inputs.map(i => !!i.v);
  const layers = SM.layers.map(L => {
    const entry = L.states.findIndex(s => s.t === "EntryState");
    const any = L.states.findIndex(s => s.t === "AnyState");
    return { L, cur: entry, any, time: 0 };
  });
  const condOk = tr => tr.conds.every(([id, op]) => op === 0 ? inputs[id] : !inputs[id]);
  function advance(dt) {
    for (const ly of layers) {
      for (let guard = 0; guard < 8; guard++) {
        const anyTr = ly.any >= 0 ? ly.L.states[ly.any].tr : [];
        const cands = anyTr.concat(ly.L.states[ly.cur].tr);
        const tr = cands.find(t => t.to !== ly.cur && condOk(t));
        if (!tr) break;
        ly.cur = tr.to; ly.time = 0;
        if (ly.L.states[ly.cur].t === "AnimationState") break;
      }
      const st = ly.L.states[ly.cur];
      if (st.t === "AnimationState") {
        const anim = SCENE.anims[st.anim];
        ly.time += dt * (anim.speed || 1);
        applyAnim(anim, ly.time);
      }
    }
  }

  /* ---------- pointer listeners (hover enter / exit) ---------- */
  const targets = new Map();
  for (const ls of SM.listeners) {
    if (!targets.has(ls.target)) {
      const hitShapes = [];
      const walk = c => { if (c.t === "Shape") hitShapes.push(shapes.find(s => s.s === c)); c.kids.forEach(walk); };
      walk(comps[ls.target]);
      targets.set(ls.target, { hitShapes: hitShapes.filter(Boolean), over: false, listeners: [] });
    }
    targets.get(ls.target).listeners.push(ls);
  }
  function hitShape(sh, x, y) {
    if (!sh.s.W) return false;
    const [lx, ly] = apply(inv(sh.s.W), x, y);
    if (sh.rect) {
      const r = sh.rect;
      return lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h;
    }
    return false;
  }
  function fire(tg, type) {
    for (const ls of tg.listeners) if (ls.type === type) {
      for (const [id, v] of ls.acts) inputs[id] = v === 2 ? !inputs[id] : !!v;
    }
  }
  function pointerAt(ax, ay) {
    for (const tg of targets.values()) {
      const hit = ax != null && tg.hitShapes.some(sh => hitShape(sh, ax, ay));
      if (hit !== tg.over) { tg.over = hit; fire(tg, hit ? 0 : 1); }
    }
  }
  const toArtboard = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left - fitX) / fitScale, (e.clientY - r.top - fitY) / fitScale];
  };
  canvas.addEventListener("pointermove", e => pointerAt(...toArtboard(e)));
  canvas.addEventListener("pointerdown", e => pointerAt(...toArtboard(e)));
  canvas.addEventListener("pointerleave", () => pointerAt(null, null));
  canvas.addEventListener("pointercancel", () => pointerAt(null, null));

  /* ---------- layout: contain + center, like Rive's default fit ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    // Frame the board stack (incl. hover-lift headroom and glow) instead of the whole artboard.
    const box = { x: 100, y: 108, w: 372, h: 336 };
    fitScale = Math.min(cw / box.w, ch / box.h);
    fitX = (cw - box.w * fitScale) / 2 - box.x * fitScale;
    fitY = (ch - box.h * fitScale) / 2 - box.y * fitScale;
    view = [fitScale*dpr, 0, 0, fitScale*dpr, fitX*dpr, fitY*dpr];
  }
  window.addEventListener("resize", resize);
  resize();

  let last = null, SPEED = 1;
  function frame(now) {
    const dt = (last == null ? 0 : Math.min((now - last) / 1000, 0.1)) * SPEED;
    last = now;
    advance(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ------------------------------------------------------------------
       Lab hooks (InstaLanding Motion). The stack works on its own; when it
       is framed, the lab drives it with postMessage and it reports which
       board is up.
         { source: 'il-motion', type: 'speed', value: 0.25 }   every lift and settle (they run on dt)
         { ..., type: 'step', value: 1 | -1 }    lift the next / previous board
         { ..., type: 'gap', value: 140 }        ms between boards in the wave
         { ..., type: 'glow', value: true }      the gradient glow under the stack
         { ..., type: 'autoplay', value: true }  a wave runs through the stack, back to front
    ------------------------------------------------------------------ */
  const order = [...targets.values()];              // back of the stack first, as the listeners list them
  let up = -1, gap = 140, auto = 0, waveTimers = [];
  const lift = (i) => {
    order.forEach((tg, k) => { const on = k === i; if (tg.over !== on) { tg.over = on; fire(tg, on ? 0 : 1); } });
    up = i;
  };
  const step = (dir) => lift(((up < 0 ? (dir > 0 ? -1 : 0) : up) + dir + order.length) % order.length);
  const wave = () => {
    waveTimers.forEach(clearTimeout); waveTimers = [];
    order.forEach((_, k) => waveTimers.push(setTimeout(() => lift(k), (k * gap) / Math.max(SPEED, 0.05))));
    waveTimers.push(setTimeout(() => lift(-1), (order.length * gap + 500) / Math.max(SPEED, 0.05)));
  };
  const autoplay = (on, ms = 3800) => {
    clearInterval(auto); waveTimers.forEach(clearTimeout);
    if (on) { wave(); auto = setInterval(() => { if (!document.hidden) wave(); }, ms); }
  };
  const qs = new URLSearchParams(location.search);
  if (qs.has('autoplay')) autoplay(true, Number(qs.get('autoplay')) || 3800);
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion') return;
    if (d.type === 'speed') SPEED = Math.max(0.05, Number(d.value) || 1);
    if (d.type === 'step') { clearInterval(auto); step(d.value > 0 ? 1 : -1); }
    if (d.type === 'gap') gap = Math.max(30, Number(d.value) || 140);
    if (d.type === 'glow') fillsOf(comps[1]).forEach((f) => (f.vis = d.value ? 1 : 0));
    if (d.type === 'autoplay') autoplay(Boolean(d.value));
  });
  // a pointer on the canvas takes over from the wave and the steps
  canvas.addEventListener('pointerenter', () => { clearInterval(auto); waveTimers.forEach(clearTimeout); up = -1; });
  if (parent !== window) {
    let lastText = '';
    const report = () => {
      const k = order.findIndex((tg) => tg.over);
      const text = k < 0 ? 'HOVER A BOARD' : `BOARD ${String(k + 1).padStart(2, '0')} / ${order.length} LIFTED`;
      if (text !== lastText) { lastText = text; parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, '*'); }
      setTimeout(() => requestAnimationFrame(report), 90);
    };
    requestAnimationFrame(report);
  }
})();
</script>
</body>
</html>
