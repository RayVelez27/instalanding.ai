  ring.rect(bb.x0 - m, bb.y0 - m, bb.w + 2 * m, bb.h + 2 * m);
  ring.addPath(p2d);
  ctx.shadowColor = color; ctx.shadowBlur = blur * PX();
  ctx.shadowOffsetX = ox * PX(); ctx.shadowOffsetY = oy * PX();
  ctx.fillStyle = '#000';
  ctx.fill(ring, 'evenodd');
  ctx.restore();
}
function glossSpot(p2d, rule, bb, a, fx, fy, fr) {
  ctx.save();
  ctx.clip(p2d, rule);
  const cx = bb.x0 + bb.w * fx, cy = bb.y0 + bb.h * fy, r = Math.max(bb.w, bb.h) * fr;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`);
  g.addColorStop(0.45, `rgba(255,255,255,${a * 0.35})`);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(bb.x0, bb.y0, bb.w, bb.h);
  ctx.restore();
}
function sheenStreak(p2d, rule, bb, a) {
  // soft specular band, top-left
  ctx.save();
  ctx.clip(p2d, rule);
  const cx = bb.x0 + bb.w * 0.3, cy = bb.y0 + bb.h * 0.2;
  ctx.translate(cx, cy); ctx.rotate(-0.6); ctx.scale(1, 0.38);
  const r = Math.max(bb.w, bb.h) * 0.3;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-r, -r, 2 * r, 2 * r);
  ctx.restore();
}

// material presets
const MAT = {
  // large soft-touch toy body
  body: { drop: [0.42, 38, 22], grad: [0.24, -0.2], gloss: 0.32, streak: 0.42, light: 0.55, dark: 0.32, rim: true },
  prop: { drop: [0.28, 10, 6], grad: [0.22, -0.2], gloss: 0.22, streak: 0.3, light: 0.4, dark: 0.3 },
  dark: { drop: [0.3, 10, 6], grad: [0.2, -0.25], gloss: 0.16, streak: 0.22, light: 0.28, dark: 0.35 },
  white: { drop: [0.22, 12, 6], grad: [0, -0.08], gloss: 0.5, streak: 0.0, light: 0.9, dark: 0.18 },
  leaf: { drop: [0, 0, 0], grad: [0.22, -0.18], gloss: 0.2, streak: 0, light: 0.35, dark: 0.25 },
  flat: { drop: [0.25, 6, 3], grad: [0.12, -0.12], gloss: 0, streak: 0, light: 0.18, dark: 0.2 },
  line: { lineShadow: [0.22, 6, 3] },
  lens: { lens: true, lineShadow: [0.22, 6, 3] },
  phone: { drop: [0.28, 14, 8], grad: [0, -0.1], gloss: 0, streak: 0, light: 0.9, dark: 0.15, glare: true, lineShadow: [0, 0, 0] },
  center: { drop: [0.2, 4, 2], grad: [0.3, -0.22], gloss: 0.45, streak: 0, light: 0.4, dark: 0.4, radial: true },
};
const PREMIUM = {};
const assign = (ids, m) => ids.forEach(id => (PREMIUM[id] = MAT[m]));
assign([695, 708, 711, 726, 753, 766], 'body');               // body shapes
assign([534], 'dark');                                         // mustache
assign([361, 427, 371, 437], 'dark');                          // kicks uppers
assign([392, 458], 'white');                                   // kicks soles/laces
assign([588], 'phone');                                        // phone body
assign([567, 578, 583, 612], 'leaf');                          // phone leaves, flower stem
assign([597], 'white');                                        // petals
assign([594], 'center');                                       // flower centre
assign([557, 560], 'lens');                                    // glasses lenses
assign([552, 769, 775, 781, 787, 682, 687, 648, 656, 665, 673, 642], 'line'); // strokes
assign([625], 'flat');                                         // wink eye
PREMIUM[793] = { ground: true };

function drawPremium(s, p2d, op, bb, m) {
  if (m.ground) return drawGround(s, p2d, op, bb);
  if (m.lens) drawLens(p2d, bb, op);
  for (const p of s.paints) {
    if (!p.isVisible || !p.color) continue;
    const col = p.color.colorValue;
    const a = (A8(col) / 255) * op;
    if (a <= 0) continue;
    const rule = p.fillRule === 1 ? 'evenodd' : 'nonzero';
    if (p.t === 'Fill') premiumFill(p2d, rule, bb, col, a, m);
    else premiumStroke(p2d, bb, p, col, a, m);
  }
}
function premiumFill(p2d, rule, bb, col, a, m) {
  const base = rgbOf(col);
  if (m.drop && m.drop[0] > 0) dropShadow(p2d, rule, css(shade(col, -0.7), m.drop[0] * a), m.drop[1], m.drop[2]);
  let g;
  if (m.radial) {
    const r = Math.max(bb.w, bb.h) * 0.75;
    g = ctx.createRadialGradient(bb.x0 + bb.w * 0.35, bb.y0 + bb.h * 0.3, 0, bb.x0 + bb.w * 0.35, bb.y0 + bb.h * 0.3, r);
  } else g = ctx.createLinearGradient(bb.x0, bb.y0, bb.x1, bb.y1);
  g.addColorStop(0, css(shade(col, m.grad[0]), a));
  g.addColorStop(0.5, css(base, a));
  g.addColorStop(1, css(shade(col, m.grad[1]), a));
  ctx.fillStyle = g;
  ctx.fill(p2d, rule);
  const unit = Math.min(bb.w, bb.h);
  if (m.dark) innerShadow(p2d, rule, bb, css(shade(col, -0.6), m.dark * a), -unit * 0.03, -unit * 0.06, unit * 0.12);
  if (m.light) innerShadow(p2d, rule, bb, `rgba(255,255,255,${m.light * a})`, unit * 0.012, unit * 0.025, unit * 0.04);
  if (m.gloss) glossSpot(p2d, rule, bb, m.gloss * a, 0.28, 0.22, 0.6);
  if (m.streak) sheenStreak(p2d, rule, bb, m.streak * a);
  if (m.rim) { // thin crisp edge for definition
    ctx.save(); ctx.clip(p2d, rule);
    ctx.lineWidth = 3; ctx.strokeStyle = css(shade(col, -0.35), 0.16 * a); ctx.stroke(p2d);
    ctx.restore();
  }
  if (m.glare) drawGlare(p2d, rule, bb, a);
}
function premiumStroke(p2d, bb, p, col, a, m) {
  ctx.save();
  ctx.lineWidth = p.thickness; ctx.lineCap = CAPS[p.cap] || 'butt';
  ctx.lineJoin = JOINS[p.join] || 'miter'; ctx.miterLimit = 4;
  const ls = m.lineShadow || [0.22, 6, 3];
  if (ls[0] > 0) {
    ctx.shadowColor = css(shade(col, -0.6), ls[0] * a);
    ctx.shadowBlur = ls[1] * PX(); ctx.shadowOffsetY = ls[2] * PX();
  }
  const g = ctx.createLinearGradient(bb.x0, bb.y0, bb.x1 + 0.01, bb.y1 + 0.01);
  g.addColorStop(0, css(shade(col, 0.16), a));
  g.addColorStop(1, css(shade(col, -0.12), a));
  ctx.strokeStyle = g;
  ctx.stroke(p2d);
  ctx.restore();
}
function drawLens(p2d, bb, op) {
  ctx.save();
  ctx.clip(p2d);
  const g = ctx.createLinearGradient(bb.x0, bb.y0, bb.x1, bb.y1);
  g.addColorStop(0, `rgba(255,255,255,${0.42 * op})`);
  g.addColorStop(0.5, `rgba(205,228,245,${0.18 * op})`);
  g.addColorStop(1, `rgba(150,190,225,${0.28 * op})`);
  ctx.fillStyle = g;
  ctx.fill(p2d);
  // two diagonal glare bars
  ctx.fillStyle = `rgba(255,255,255,${0.55 * op})`;
  const w = bb.w, h = bb.h, x = bb.x0, y = bb.y0;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.18, y + h); ctx.lineTo(x + w * 0.42, y + h); ctx.lineTo(x + w * 1.02, y + h * 0.1); ctx.lineTo(x + w * 0.78, y + h * 0.1);
  ctx.closePath(); ctx.globalAlpha = 0.35; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.5, y + h); ctx.lineTo(x + w * 0.58, y + h); ctx.lineTo(x + w * 1.18, y + h * 0.1); ctx.lineTo(x + w * 1.1, y + h * 0.1);
  ctx.closePath(); ctx.globalAlpha = 0.25; ctx.fill();
  ctx.restore();
}
function drawGlare(p2d, rule, bb, a) {
  ctx.save();
  ctx.clip(p2d, rule);
  const w = bb.w, h = bb.h, x = bb.x0, y = bb.y0;
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, `rgba(255,255,255,${0.0})`);
  g.addColorStop(1, `rgba(196,212,224,${0.35 * a})`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.35, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h * 0.75);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawGround(s, p2d, op, bb) {
  const p = s.paints.find(k => k.isVisible && k.color);
  if (!p) return;
  const col = shade(p.color.colorValue, -0.25);
  const a = (A8(p.color.colorValue) / 255) * op;
  // react to the body's idle bob: lower body -> tighter, darker contact shadow
  const body = C[694];
  const t = Math.max(0, Math.min(1, (body.y + 84.5) / 12));
  const cx = bb.x0 + bb.w / 2, cy = bb.y0 + bb.h / 2;
  const rx = bb.w / 2 * (1.06 - t * 0.06), ry = bb.h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.12);
  g.addColorStop(0, css(col, (0.75 + t * 0.12) * a));
  g.addColorStop(0.55, css(col, 0.42 * a));
  g.addColorStop(1, css(col, 0));
  ctx.fillStyle = g;
  ctx.fillRect(-rx * 1.2, -rx * 1.2, rx * 2.4, rx * 2.4);
  // tight contact shadow under the feet
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 0.5);
  g.addColorStop(0, css(shade(p.color.colorValue, -0.55), (0.22 + t * 0.08) * a));
  g.addColorStop(1, css(col, 0));
  ctx.fillStyle = g;
  ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.setTransform(...view);
  const bounds = new Path2D(); bounds.rect(0, 0, AW, AH);
  ctx.clip(bounds);
  drawPaints(artboard, bounds, 1);
  for (let i = shapes.length - 1; i >= 0; i--) {
    const s = shapes[i];
    if (s.collapsed || !s.paints.length) continue;
    const W = world(s);
    const iw = inv(W); if (!iw) continue;
    const p2d = new Path2D();
    const bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const p of s.paths) if (!p.collapsed) {
      const lc = transformCmds(pathCmds(p), mul(iw, world(p)));
      for (const c of lc) for (let j = 1; j < c.length; j += 2) {
        if (c[j] < bb.x0) bb.x0 = c[j]; if (c[j] > bb.x1) bb.x1 = c[j];
        if (c[j + 1] < bb.y0) bb.y0 = c[j + 1]; if (c[j + 1] > bb.y1) bb.y1 = c[j + 1];
      }
      toPath2D(lc, p2d);
    }
    bb.w = bb.x1 - bb.x0; bb.h = bb.y1 - bb.y0;
    ctx.save();
    if (s.clips) for (const cl of s.clips) {
      if (!cl.isVisible) continue;
      const cp = new Path2D();
      for (const cs of cl.sourceShapes) toPath2D(shapeWorldCmds(cs), cp);
      ctx.setTransform(...view);
      ctx.clip(cp, cl.fillRule === 1 ? 'evenodd' : 'nonzero');
    }
    ctx.setTransform(...mul(view, W));
    const prem = PREMIUM[s.id];
    if (prem && (bb.w > 0 || bb.h > 0)) drawPremium(s, p2d, s.renderOpacity, bb, prem); else drawPaints(s, p2d, s.renderOpacity);
    ctx.restore();
  }
  ctx.restore();
}
function updateArtboard() {
  updateCollapse(artboard, false);
  frameId++;
  C.forEach(c => { if (TRANSFORM.has(c.t)) world(c); });
}

// ---------- loop ----------
function toArtboard(e) {
  const r = canvas.getBoundingClientRect();
  const iv = inv(view);
  return tp(iv, (e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
}
canvas.addEventListener('pointermove', e => { const [x, y] = toArtboard(e); updateArtboard(); pointerEvent(4, x, y); });
canvas.addEventListener('pointerdown', e => { const [x, y] = toArtboard(e); updateArtboard(); pointerEvent(2, x, y); });
canvas.addEventListener('pointerup', e => { const [x, y] = toArtboard(e); updateArtboard(); pointerEvent(3, x, y); });
window.addEventListener('resize', resize);
resize();
let last = null;
function tick(now) {
  const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.1);
  last = now;
  for (const l of layers) l.advance(dt);
  updateArtboard();
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.characterCreator = { inputs, layers };
})();

</script>
