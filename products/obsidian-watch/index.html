<!DOCTYPE html>
<!--
  OBSIDIAN · Series I smartwatch
  A 46 mm titanium smartwatch on a studio-lit black set: the watch face is decoded from a Rive file
  and replayed by a small vector runtime on Canvas 2D (no Rive code), with its own crystal glare,
  bevel and a window-light streak that follows the pointer. One file; the Goldman display font is
  inlined. No libraries.

  SCREENS    Time (the real local time and date), Heart (a live BPM that drifts and a step count),
             Daylight and Weather. Each change plays the watch's own transition.
  CONTROLS   press the upper crown button to go forward and the lower one to go back, or use the
             arrow keys (A / D too); the tabs at the bottom jump to a screen. Every press clicks
             (a synthesised two-tick sound) and buzzes on phones; Sound on / off is remembered.
  API        window.watchUI.forward(), .rewind(), .screen()

  Obsidian is a fictional brand; the heart rate, steps and weather are simulated in the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>Obsidian — Series I</title>
<style>
  :root { --fg: #ececee; --mute: #7c7d84; --line: rgba(255,255,255,.09); --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(60% 55% at 50% 46%, #1d1e22 0%, #0d0d0f 55%, #050506 100%),
      #050506;
    color: var(--fg); overflow: hidden;
    font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  }
  /* overhead softbox */
  body::before {
    content: ""; position: fixed; inset: -10% 0 auto 0; height: 70%; pointer-events: none;
    background: radial-gradient(40% 60% at 50% 0%, rgba(255,255,255,.07), transparent 70%);
  }
  /* film grain */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #watch { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: manipulation;
    opacity: 0; transform: scale(.965) translateY(10px); filter: blur(6px);
    transition: opacity 1.4s var(--ease), transform 1.6s var(--ease), filter 1.2s var(--ease); }
  .ready #watch { opacity: 1; transform: none; filter: none; }

  .ui { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(18px, 4vw, 44px); pointer-events: none; z-index: 2;
    opacity: 0; transform: translateY(-6px); transition: opacity 1s .5s var(--ease), transform 1s .5s var(--ease); }
  .ready .ui { opacity: 1; transform: none; }
  .ui > * { pointer-events: auto; }
  header.ui { top: max(22px, env(safe-area-inset-top)); }
  footer.ui { bottom: max(26px, env(safe-area-inset-bottom)); flex-direction: column; gap: 16px; transform: translateY(6px); }

  .brand { display: flex; align-items: baseline; gap: 14px; }
  .mark { font-family: Goldman, ui-sans-serif; font-size: 15px; letter-spacing: .42em; font-weight: 400; }
  .model { color: var(--mute); letter-spacing: .18em; text-transform: uppercase; font-size: 10.5px; }
  .meta { display: flex; align-items: center; gap: 18px; color: var(--mute); letter-spacing: .14em; text-transform: uppercase; font-size: 10.5px; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 0 rgba(255,59,48,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,.55); } 70% { box-shadow: 0 0 0 7px rgba(255,59,48,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); } }
  #clock { color: var(--fg); font-family: Goldman, ui-sans-serif; letter-spacing: .12em; }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #sound { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--mute); letter-spacing: .14em; text-transform: uppercase; font-size: 10px; transition: color .3s, border-color .3s; }
  #sound:hover { color: var(--fg); border-color: rgba(255,255,255,.22); }
  #sound i { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  #sound i b { width: 2px; background: currentColor; border-radius: 1px; height: 3px; transition: height .3s; }
  #sound[data-on="1"] i b { animation: eq 1.2s ease-in-out infinite; }
  #sound[data-on="1"] i b:nth-child(2) { animation-delay: -.4s; } #sound[data-on="1"] i b:nth-child(3) { animation-delay: -.8s; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 10px; } }

  .now { display: flex; align-items: baseline; gap: 12px; }
  .now small { color: var(--mute); letter-spacing: .2em; text-transform: uppercase; font-size: 10px; }
  #screen-name { font-family: Goldman, ui-sans-serif; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; min-width: 8ch; }

  nav { position: relative; display: flex; gap: 4px; padding: 5px; border-radius: 999px;
    background: rgba(255,255,255,.035); border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 40px -20px rgba(0,0,0,.8); }
  nav button { position: relative; z-index: 1; padding: 9px clamp(10px, 2.4vw, 18px); border-radius: 999px; color: var(--mute);
    letter-spacing: .16em; text-transform: uppercase; font-size: 10.5px; transition: color .4s var(--ease); white-space: nowrap; }
  nav button:hover { color: #c9c9cd; }
  nav button[aria-current="true"] { color: #0b0b0c; }
  #ink { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ffffff, #d9d9dc); box-shadow: 0 6px 18px -6px rgba(255,255,255,.35);
    transition: transform .6s var(--ease), width .6s var(--ease); }
  .keys { display: flex; align-items: center; gap: 10px; color: #5d5e64; letter-spacing: .14em; text-transform: uppercase; font-size: 9.5px; }
  kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px;
    border: 1px solid var(--line); border-bottom-width: 2px; color: #9b9ca2; font: 500 10px ui-sans-serif, system-ui; }
  #sound { white-space: nowrap; }
  @media (max-width: 640px) { .model, .live { display: none; } .keys .k-hint { display: none; } .mark { font-size: 13px; letter-spacing: .36em; } #sound span { display: none; } #sound { padding: 9px 11px; } }
  @media (prefers-reduced-motion: reduce) { #watch, .ui { transition: none; } .dot, #sound i b { animation: none !important; } }
</style>
</head>
<body>
<canvas id="watch" role="img" aria-label="Obsidian Series I smartwatch. Use the upper crown button or the right arrow key to go forward, the lower button or left arrow to go back."></canvas>

<header class="ui">
  <div class="brand"><span class="mark">OBSIDIAN</span><span class="model">Series I · 46 mm Titanium</span></div>
  <div class="meta">
    <span class="live"><span class="dot"></span><span id="clock">--:--:--</span><span>Live</span></span>
    <button id="sound" type="button" aria-pressed="true"><i><b></b><b></b><b></b></i><span>Sound on</span></button>
  </div>
</header>

<footer class="ui">
  <div class="now"><small>Now showing</small><span id="screen-name">Time</span></div>
  <nav aria-label="Watch screens">
    <span id="ink"></span>
    <button type="button" data-screen="0">Time</button>
    <button type="button" data-screen="1">Heart</button>
    <button type="button" data-screen="2">Daylight</button>
    <button type="button" data-screen="3">Weather</button>
  </nav>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd><span class="k-hint">or press the crown buttons</span></div>
</footer>

function grainCanvas(n = 128) {
  const g = document.createElement('canvas'); g.width = g.height = n; const x = g.getContext('2d'), im = x.createImageData(n, n);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
  x.putImageData(im, 0, 0); return g;
}
const grain = grainCanvas();
function strapPath(c, top) {
  const W0 = 214, W1 = 200, y0 = top ? CY - 150 : CY + 150, y1 = top ? vTop - 20 : vBot + 20, r = 26;
  c.beginPath();
  if (top) { c.moveTo(CX - W0/2, y0); c.lineTo(CX - W1/2, y1); c.lineTo(CX + W1/2, y1); c.lineTo(CX + W0/2, y0); }
  else { c.moveTo(CX - W0/2, y0); c.lineTo(CX - W1/2, y1); c.lineTo(CX + W1/2, y1); c.lineTo(CX + W0/2, y0); }
  c.closePath();
}
function buildUnder() {
  const c = uctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, uc.width, uc.height);
  // contact shadow
  set(c); c.save();
  c.filter = `blur(${46 * S * dpr}px)`; c.fillStyle = 'rgba(0,0,0,0.85)';
  c.beginPath(); c.ellipse(CX + 6, CY + 34, 205, 200, 0, 0, TAU); c.fill(); c.restore();
  // straps
  for (const top of [true, false]) {
    c.save(); set(c);
    strapPath(c, top); c.clip();
    const y0 = top ? CY - 150 : CY + 150, yEnd = top ? vTop : vBot;
    const lg = c.createLinearGradient(CX - 107, 0, CX + 107, 0);
    lg.addColorStop(0, '#060607'); lg.addColorStop(0.07, '#1d1e21'); lg.addColorStop(0.16, '#111214');
    lg.addColorStop(0.5, '#17181b'); lg.addColorStop(0.84, '#111214'); lg.addColorStop(0.93, '#1d1e21'); lg.addColorStop(1, '#060607');
    c.fillStyle = lg; c.fillRect(CX - 120, Math.min(y0, yEnd) - 30, 240, Math.abs(yEnd - y0) + 60);
    // centre channel + vent slots
    c.strokeStyle = 'rgba(0,0,0,0.65)'; c.lineWidth = 1.4;
    for (const x of [CX - 58, CX + 58]) { c.beginPath(); c.moveTo(x, y0); c.lineTo(x, yEnd); c.stroke(); }
    c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 0.8;
    for (const x of [CX - 56.6, CX + 59.4]) { c.beginPath(); c.moveTo(x, y0); c.lineTo(x, yEnd); c.stroke(); }
    const dir = top ? -1 : 1;
    for (let i = 0; i < 9; i++) {
      const y = y0 + dir * (60 + i * 26);
      c.fillStyle = 'rgba(0,0,0,0.7)'; roundRect(c, CX - 34, y - 4.5, 68, 9, 4.5); c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 0.7; roundRect(c, CX - 34, y - 4.5 + 0.8 * dir, 68, 9, 4.5); c.stroke();
    }
    // texture
    c.globalAlpha = 0.05; c.globalCompositeOperation = 'overlay';
    c.fillStyle = c.createPattern(grain, 'repeat'); c.fillRect(CX - 120, Math.min(y0, yEnd) - 30, 240, Math.abs(yEnd - y0) + 60);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    // case shadow falling on the strap
    const sg = c.createLinearGradient(0, y0 - dir * 40, 0, y0 + dir * 70);
    sg.addColorStop(0, 'rgba(0,0,0,0.9)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sg; c.fillRect(CX - 120, Math.min(y0 - dir * 40, y0 + dir * 70), 240, 110);
    // fade into the backdrop
    c.globalCompositeOperation = 'destination-in';
    const span = Math.abs(yEnd - y0), fg = c.createLinearGradient(0, y0, 0, yEnd);
    fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(Math.min(0.9, 140 / span), 'rgba(0,0,0,1)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = fg; c.fillRect(CX - 120, Math.min(y0, yEnd) - 30, 240, span + 60);
    c.restore();
  }
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// --- light that follows the pointer ---
let lightA = -2.3, lightTarget = -2.3, lightK = 0.6, lightKT = 0.6;
window.addEventListener('pointermove', e => {
  const r = view.getBoundingClientRect(), px = (e.clientX - r.left) * dpr, py = (e.clientY - r.top) * dpr;
  const wx = (px - B[4]) / B[0], wy = (py - B[5]) / B[3];
  lightTarget = Math.atan2(wy - CY, wx - CX); lightKT = Math.min(1, Math.hypot(wx - CX, wy - CY) / 380) * 0.6 + 0.4;
});
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };

// --- compositing ---
const hasConic = typeof vctx.createConicGradient === 'function';
function composite(t) {
  const c = vctx;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, view.width, view.height);
  c.drawImage(uc, 0, 0);
  c.drawImage(wc, 0, 0);

  // brushed-metal sheen over the case/bezel
  c.save(); set(c);
  c.beginPath(); c.arc(CX, CY, R_CASE, 0, TAU); c.arc(CX, CY, R_CRYSTAL + 1, 0, TAU, true); c.clip('evenodd');
  if (hasConic) {
    const g = c.createConicGradient(lightA, CX, CY), N = 18;
    for (let i = 0; i <= N; i++) {
      const p = i / N, k = Math.cos(p * TAU) * 0.5 + 0.5, k2 = Math.cos(p * TAU * 2) * 0.5 + 0.5;
      const v = Math.pow(k, 6) * 0.55 + Math.pow(k2, 10) * 0.18;
      g.addColorStop(p, `rgba(255,255,255,${v * lightK})`);
    }
    c.globalCompositeOperation = 'soft-light'; c.fillStyle = g; c.fillRect(CX - 200, CY - 200, 400, 400);
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.22; c.fillRect(CX - 200, CY - 200, 400, 400);
  }
  c.restore();

  // specular rim on the case edge
  c.save(); set(c);
  const lx = Math.cos(lightA), ly = Math.sin(lightA);
  let rg = c.createLinearGradient(CX + lx * R_CASE, CY + ly * R_CASE, CX - lx * R_CASE, CY - ly * R_CASE);
  rg.addColorStop(0, `rgba(255,255,255,${0.55 * lightK})`); rg.addColorStop(0.35, 'rgba(255,255,255,0.04)'); rg.addColorStop(0.7, 'rgba(255,255,255,0)'); rg.addColorStop(1, `rgba(255,255,255,${0.12 * lightK})`);
  c.strokeStyle = rg; c.lineWidth = 1.1; c.beginPath(); c.arc(CX, CY, R_CASE - 0.8, 0, TAU); c.stroke();
  c.restore();

  // OLED bloom on lit pixels
  bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0, 0, bc.width, bc.height);
  bctx.filter = 'blur(2.5px)'; bctx.drawImage(wc, 0, 0, bc.width, bc.height); bctx.filter = 'none';
  c.save(); set(c); c.beginPath(); c.arc(CX, CY, R_CRYSTAL - 2, 0, TAU); c.clip();
  c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.42;
  c.drawImage(bc, 0, 0, view.width, view.height);
  c.globalAlpha = 0.18; c.filter = `blur(${10 * S * dpr}px)`; c.drawImage(bc, 0, 0, view.width, view.height); c.filter = 'none';
  c.restore();

  // sapphire crystal
  c.save(); set(c); c.beginPath(); c.arc(CX, CY, R_CRYSTAL, 0, TAU); c.clip();
  const vg = c.createRadialGradient(CX, CY, R_CRYSTAL * 0.72, CX, CY, R_CRYSTAL);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  c.fillStyle = vg; c.fillRect(CX - R_CRYSTAL, CY - R_CRYSTAL, R_CRYSTAL * 2, R_CRYSTAL * 2);
  // crescent glare
  const gx = CX + lx * R_CRYSTAL * 0.9, gy = CY + ly * R_CRYSTAL * 0.9;
  c.beginPath(); c.arc(CX, CY, R_CRYSTAL, 0, TAU);
  c.arc(CX - lx * R_CRYSTAL * 0.16, CY - ly * R_CRYSTAL * 0.16, R_CRYSTAL * 1.02, 0, TAU, true);
  const cg = c.createLinearGradient(gx, gy, CX - lx * R_CRYSTAL * 0.2, CY - ly * R_CRYSTAL * 0.2);
  cg.addColorStop(0, `rgba(255,255,255,${0.20 * lightK})`); cg.addColorStop(0.5, `rgba(255,255,255,${0.05 * lightK})`); cg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = cg; c.fill('evenodd');
  // broad soft reflection
  const sg = c.createLinearGradient(CX + lx * R_CRYSTAL, CY + ly * R_CRYSTAL, CX, CY);
  sg.addColorStop(0, `rgba(255,255,255,${0.07 * lightK})`); sg.addColorStop(0.55, 'rgba(255,255,255,0.012)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = sg; c.fillRect(CX - R_CRYSTAL, CY - R_CRYSTAL, R_CRYSTAL * 2, R_CRYSTAL * 2);
  // window-light streak
  c.save(); c.translate(CX, CY); c.rotate(lightA + Math.PI / 2);
  const st = c.createLinearGradient(-R_CRYSTAL, 0, R_CRYSTAL, 0);
  st.addColorStop(0.18, 'rgba(255,255,255,0)'); st.addColorStop(0.26, `rgba(255,255,255,${0.045 * lightK})`); st.addColorStop(0.31, 'rgba(255,255,255,0)');
  st.addColorStop(0.35, `rgba(255,255,255,${0.025 * lightK})`); st.addColorStop(0.38, 'rgba(255,255,255,0)');
  c.fillStyle = st; c.beginPath(); c.ellipse(0, -R_CRYSTAL * 0.45, R_CRYSTAL, R_CRYSTAL * 0.6, 0, 0, TAU); c.fill();
  c.restore();
  // crystal edge bevel
  const eg = c.createLinearGradient(CX + lx * R_CRYSTAL, CY + ly * R_CRYSTAL, CX - lx * R_CRYSTAL, CY - ly * R_CRYSTAL);
  eg.addColorStop(0, `rgba(255,255,255,${0.42 * lightK})`); eg.addColorStop(0.3, 'rgba(255,255,255,0.03)'); eg.addColorStop(0.75, 'rgba(255,255,255,0)'); eg.addColorStop(1, `rgba(255,255,255,${0.16 * lightK})`);
  c.strokeStyle = eg; c.lineWidth = 1.6; c.beginPath(); c.arc(CX, CY, R_CRYSTAL - 0.8, 0, TAU); c.stroke();
  c.restore();
}

// --- input ---
const hitBtn = (ex, ey) => {
  const px = ex * dpr, py = ey * dpr;
  for (const [dir, sh] of Object.entries(btn)) {
    const t = mul(B, sh.world); wctx.setTransform(t[0], t[1], t[2], t[3], t[4], t[5]);
    wctx.lineWidth = 8; if (wctx.isPointInPath(sh.path2d, px, py) || wctx.isPointInStroke(sh.path2d, px, py)) return dir;
  }
  return null;
};
view.addEventListener('pointerdown', e => {
  const r = view.getBoundingClientRect(), d = hitBtn(e.clientX - r.left, e.clientY - r.top);
  if (d) { e.preventDefault(); request(d); }
});
view.addEventListener('pointermove', e => {
  const r = view.getBoundingClientRect(); view.style.cursor = hitBtn(e.clientX - r.left, e.clientY - r.top) ? 'pointer' : 'default';
});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'd') { request('forward'); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'a') { request('rewind'); e.preventDefault(); }
});
document.querySelectorAll('[data-screen]').forEach(el => el.addEventListener('click', () => {
  const target = +el.dataset.screen; let s = curScreen() + queue.reduce((a, q) => a + (q === 'forward' ? 1 : -1), 0);
  s = Math.max(0, Math.min(3, s));
  while (s < target && queue.length < 3) { queue.push('forward'); s++; }
  while (s > target && queue.length < 3) { queue.push('rewind'); s--; }
}));
const soundBtn = $('#sound');
const paintSound = () => { soundBtn.dataset.on = soundOn ? '1' : '0'; soundBtn.setAttribute('aria-pressed', soundOn); soundBtn.querySelector('span').textContent = soundOn ? 'Sound on' : 'Sound off'; };
soundBtn.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('watch-sound', soundOn ? 'on' : 'off'); } catch (e) {} paintSound(); if (soundOn) click(0.7); });
paintSound();

// --- HUD ---
const navItems = [...document.querySelectorAll('[data-screen]')], ink = $('#ink'), clockEl = $('#clock'), screenName = $('#screen-name');
const NAMES = ['Time', 'Heart rate', 'Daylight', 'Weather'];
let lastScreen = -1;
function hud(d) {
  const s = curScreen();
  if (s !== lastScreen) {
    lastScreen = s;
    navItems.forEach((el, i) => el.setAttribute('aria-current', i === s ? 'true' : 'false'));
    const el = navItems[s]; ink.style.transform = `translateX(${el.offsetLeft}px)`; ink.style.width = el.offsetWidth + 'px';
    screenName.textContent = NAMES[s];
  }
  clockEl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// --- go ---
async function start() {
  const bin = atob(FONT_B64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  try { const ff = new FontFace(FONT, buf.buffer); await ff.load(); document.fonts.add(ff);
        const ui = new FontFace('Goldman', buf.buffer); await ui.load(); document.fonts.add(ui); } catch (e) { console.warn('font', e); }
  layout(); window.addEventListener('resize', () => { layout(); lastScreen = -1; });
  advanceSM(0);
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    pump();
    for (const [sh, p] of press) { const tg = pressTarget.get(sh); press.set(sh, p + (tg - p) * (tg > p ? 0.55 : 0.22)); }
    lightA = lerpAngle(lightA, lightTarget, 0.06); lightK += (lightKT - lightK) * 0.06;
    const d = liveData(now);
    advanceSM(dt);
    base = B; render();
    composite(now);
    hud(d);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  document.body.classList.add('ready');
}
window.watchUI = { forward: () => request('forward'), rewind: () => request('rewind'), screen: curScreen };
start();
})();

</script>
</body>
