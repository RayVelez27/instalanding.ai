  :root {
    --bg: #03040c;
    --ink: #eef0f7;
    --muted: rgba(226, 230, 245, 0.52);
    --faint: rgba(226, 230, 245, 0.28);
    --line: rgba(255, 255, 255, 0.07);
    --accent: 52 121 248;          /* updated per tier */
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'CyGeist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    overflow-x: hidden;
    padding: clamp(20px, 4vh, 48px) 16px;
  }

  /* ---------- ambient backdrop ---------- */
  .backdrop { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .backdrop::before {               /* tier-tinted aurora */
    content: ""; position: absolute; inset: -20%;
    background:
      radial-gradient(38% 32% at 50% 46%, rgb(var(--accent) / .16), transparent 70%),
      radial-gradient(60% 45% at 50% 110%, rgba(110, 60, 220, .16), transparent 70%),
      radial-gradient(50% 40% at 50% -10%, rgba(70, 90, 200, .10), transparent 70%);
    transition: background 1.2s var(--ease);

const targets = [...new Set(listeners.map((l) => l.target))];
function fire(type, tid) {
  for (const l of listeners) if (l.target === tid && l.type === type) VM[l.prop] = l.value;
}
function pointerMove(x, y) {
  canvas.style.cursor = targets.some((t) => hit(t, x, y)) ? 'pointer' : 'default';
  for (const tid of targets) {
    const h = hit(tid, x, y);
    if (h && !hovered.has(tid)) { hovered.add(tid); fire(0, tid); }
    else if (!h && hovered.has(tid)) { hovered.delete(tid); fire(1, tid); }
  }
}
canvas.addEventListener('pointermove', (e) => { const [x, y] = toArt(e); pointerMove(x, y); });
canvas.addEventListener('pointerleave', () => { for (const tid of [...hovered]) { hovered.delete(tid); fire(1, tid); } });
canvas.addEventListener('pointerdown', (e) => {
  const [x, y] = toArt(e); pointerMove(x, y);
  downTargets = new Set(targets.filter((t) => hit(t, x, y))); downTargets.forEach((t) => fire(2, t));
});
canvas.addEventListener('pointerup', (e) => {
  const [x, y] = toArt(e);
  for (const t of targets) if (hit(t, x, y)) { fire(3, t); if (downTargets.has(t)) fire(6, t); }

// ---------- sizing / loop ----------
function resize() {
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));

let lastTier = -1;

  hover(i) { VM[0] = i; },

let last = null;
function tick(now) {

boot();
})();

</script>
<script>
(function () {
  const ACCENT = ['52 121 248', '255 98 17', '201 106 255'];
  const CODE = ['SEC·PRO', 'SEC·ADP', 'SEC·ESS'];
  // hover enum: 1 Proactive, 2 Adaptive, 3 Essential
  const btns = [...document.querySelectorAll('.tiers button')];
  const pill = document.querySelector('.pill');
  const root = document.documentElement;
  function paint(i) {
    root.style.setProperty('--accent', ACCENT[i]);
    pill.style.transform = `translateX(${i * 100}%)`;
    btns.forEach((b, k) => { b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1; });
    document.getElementById('tierNum').textContent = String(i + 1).padStart(2, '0');
    document.getElementById('tierCode').textContent = CODE[i];
  }
  const ready = () => window.CyberStage;
  btns.forEach((b, k) => {
    b.addEventListener('click', () => ready() && CyberStage.select(k));
    b.addEventListener('pointerenter', () => ready() && CyberStage.hover(k + 1));
    b.addEventListener('pointerleave', () => ready() && CyberStage.hover(0));
    b.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const n = (k + (e.key === 'ArrowRight' ? 1 : 2)) % 3;
        CyberStage.select(n); btns[n].focus();
      }
    });
  });
  document.addEventListener('keydown', (e) => {
    if (!ready() || (e.target.closest && e.target.closest('.tiers'))) return;
    if (e.key === 'ArrowRight') CyberStage.select((CyberStage.tier + 1) % 3);
    if (e.key === 'ArrowLeft') CyberStage.select((CyberStage.tier + 2) % 3);
  });
  window.addEventListener('tierchange', (e) => paint(e.detail));
  const wait = setInterval(() => { if (window.__stageReady) { clearInterval(wait); requestAnimationFrame(() => document.body.classList.add('ready')); } }, 30);
})();
</script>
