      else if (d.type === 'NestedArtboard') {
        if (d.instance && d.renderOpacity > 0) {
          const w = d.world; ctx.transform(w[0], w[1], w[2], w[3], w[4], w[5]);
          d.instance.drawContent(ctx, false);

      } else if (d.type === 'Text') this.drawText(ctx, d);

    }
    drawShape(ctx, s) {
      if (s.renderOpacity === 0 || !s.paints.length) return;
      let worldCmds = null, localCmds = null, localCW = null;
      for (const paint of s.paints) {
        if (!paint.isVisible || !paint.mutator) continue;
        const isStroke = paint.type === 'Stroke';
        if (isStroke && paint.thickness <= 0) continue;
        const local = !isStroke || paint.transformAffectsStroke;
        let cmds;
        if (local) {
          if (!isStroke && paint.fillRule === 2) { if (!localCW) localCW = this.shapeLocalPath(s, true); cmds = localCW; }
          else { if (!localCmds) localCmds = this.shapeLocalPath(s, false); cmds = localCmds; }
        } else { if (!worldCmds) worldCmds = this.shapeWorldPath(s); cmds = worldCmds; }
        this.drawPaint(ctx, s, paint, cmds, null, local ? s.world : null, s.renderOpacity, s.blendModeValue);
      }
    }
    makeStyle(ctx, paint, ro, spaceWorld) {
      const m = paint.mutator;
      if (m.type === 'SolidColor') {
        const a = ((m.colorValue >>> 24) & 255) / 255 * ro;
        if (a <= 0) return null;
        return cssColor(m.colorValue, ro);
      }
      const stops = (m.stops || []).slice().sort((a, b) => a.position - b.position);
      const op = m.opacity * ro;
      let visible = false;
      for (const st of stops) if (((st.colorValue >>> 24) & 255) / 255 * op > 0) visible = true;
      if (!visible) return null;
      let sx = m.startX, sy = m.startY, ex = m.endX, ey = m.endY;
      if (spaceWorld) {
        const w = spaceWorld;
        const a = [mapX(w, sx, sy), mapY(w, sx, sy)], b = [mapX(w, ex, ey), mapY(w, ex, ey)];
        sx = a[0]; sy = a[1]; ex = b[0]; ey = b[1];

  class Player {
    constructor(data, opts) {
      opts = opts || {};
      this.file = new SceneFile(data);
      const self = this;
      this.file.makeArtboard = (i) => (data.artboards[i] ? new Artboard(self.file, i) : null);

      this.artboard.advanceNested(sec);

    get height() { return this.artboard.root.height; }

    pointer(type, x, y) {
      const ab = this.artboard, root = ab.root;
      const ax = x - root.width * root.originX, ay = y - root.height * root.originY;
      let hit = false;
      if (this.sm && this.sm.pointer(type, ax, ay)) hit = true;
      for (const n of ab.nested) {
        if (!n.instance || (n.drawableFlags & 1)) continue;
        const iw = inv(n.world); if (!iw) continue;
        const lx = mapX(iw, ax, ay), ly = mapY(iw, ax, ay);

</script>
<script>

(async function () {
  'use strict';
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const data = JSON.parse(document.getElementById('scene-data').textContent);

  // Embedded font (Sofia Sans Extra Condensed, variable weight)
  try {
    const bin = atob(document.getElementById('scene-font').textContent.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const face = new FontFace('SceneFont', bytes.buffer, { weight: '1 1000' });
    await face.load();
    document.fonts.add(face);
  } catch (e) { console.warn('Font failed to load', e); }

  const player = new ScenePlayer(data, { artboard: 1 });
  const AW = player.width, AH = player.height;
  let dpr = 1, cssW = 0, cssH = 0, scale = 1, offX = 0, offY = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    cssW = canvas.clientWidth; cssH = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    const VB = [-2, 4, 83, 65];                 // the drawn area (labels included), in artboard units
    scale = Math.min(cssW / VB[2], cssH / VB[3]);   // "contain" fit
    offX = (cssW - VB[2] * scale) / 2 - VB[0] * scale; offY = (cssH - VB[3] * scale) / 2 - VB[1] * scale;
  }
  window.addEventListener('resize', resize);
  resize();

  function toArtboard(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale];
  }
  function pointer(type, e) {
    const [x, y] = toArtboard(e);
    const hit = player.pointer(type, x, y);
    canvas.style.cursor = hit ? 'pointer' : 'default';
  }
  canvas.addEventListener('pointermove', (e) => pointer('move', e));
  canvas.addEventListener('pointerdown', (e) => { pointer('move', e); pointer('down', e); });
  canvas.addEventListener('pointerup', (e) => pointer('up', e));
  canvas.addEventListener('pointerleave', () => { player.pointer('move', -1e5, -1e5); canvas.style.cursor = 'default'; });
  canvas.addEventListener('pointercancel', () => player.pointer('move', -1e5, -1e5));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    player.advance(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
    player.draw(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((t) => { last = t; frame(t); });
})();

</script>
