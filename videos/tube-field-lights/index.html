</script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; background: #000; }
      #root canvas { display: block; position: absolute; inset: 0; z-index: 1; }
      #engulf { position: absolute; inset: 0; z-index: 10; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div id="engulf" data-engulf></div>
    </div>

    <script>
      "use strict";
      THREE.ColorManagement.enabled = false; // r83 had no colour management
      // ─────────────────────────────────────────────────────────────
      //  Tube Field Lights. A dark grid of rounded-square tubes (after
      //  the original "lights through tubes" pen) lit by pink point-light
      //  balls that rise up through the field, glowing as they pass the
      //  rings, fade out, and recycle to a new column.
      //
      //  The original re-randomised every ball's position each cycle via a
      //  recursive TimelineMax — not seekable. Here every ball's cycle,
      //  rise, glow envelope and (seeded) column are pure functions of t,
      //  so tl.seek(t) reproduces an identical frame (render-safe). Legacy
      //  Three.js (r83) is kept only to build the merged tube geometry.
      // ─────────────────────────────────────────────────────────────
      const W = 1920, H = 1080;
      const AMB_K = Math.PI * 1.6, SPOT_K = Math.PI * 12, PT_K = Math.PI * 6; // r83 -> r180 light levels
      function clamp01(x){ return Math.max(0, Math.min(1, x)); }
      function lerpN(a, b, u){ return a + (b - a) * u; }
      function hash2(a, b){
        let h = 2166136261 >>> 0;
        h = Math.imul(h ^ (a + 0x9e3779b9), 16777619);
        h = Math.imul(h ^ (b + 0x85ebca6b), 16777619);
        return h >>> 0;
      }
      function mulberry32(seed){
        let s = seed >>> 0;
        return function(){
          s = (s + 0x6D2B79F5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ===== Scene / camera / renderer ===== */
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(6, W / H, 0.1, 1200);
      camera.position.set(150, 200, 400);
      camera.lookAt(scene.position);
      scene.add(camera);

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, logarithmicDepthBuffer: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      document.getElementById("root").appendChild(renderer.domElement);

      /* ===== Base lights ===== */
      // Reference base: ambient 0.03 + a soft overhead spotlight, so the
      // tubes read near-black and the pink point-lights do the work.
      // (The original's angle: Math.PI is invalid — clamped here to a valid cone.)
      scene.add(new THREE.AmbientLight(0xffffff, 0.045 * AMB_K));
      const sun = new THREE.SpotLight(0xffffff, 0.45 * SPOT_K);
      sun.angle = Math.PI / 2.2; sun.penumbra = 1.0; sun.distance = 100; sun.decay = 1.0;
      sun.position.set(0, 50, 0);
      sun.target.position.set(0, 0, 0);
      scene.add(sun); scene.add(sun.target);

      /* ===== Tube geometry (rounded-square ring, extruded vertical) ===== */
      const getPath = (radius, fineness, reverse) => {
        const c = radius * 0.55191502449;
        const path = new THREE.CurvePath();
        path.curves = [
          new THREE.CubicBezierCurve(new THREE.Vector2(0, radius), new THREE.Vector2(c, radius), new THREE.Vector2(radius, c), new THREE.Vector2(radius, 0)),
          new THREE.CubicBezierCurve(new THREE.Vector2(radius, 0), new THREE.Vector2(radius, -c), new THREE.Vector2(c, -radius), new THREE.Vector2(0, -radius)),
          new THREE.CubicBezierCurve(new THREE.Vector2(0, -radius), new THREE.Vector2(-c, -radius), new THREE.Vector2(-radius, -c), new THREE.Vector2(-radius, 0)),
          new THREE.CubicBezierCurve(new THREE.Vector2(-radius, 0), new THREE.Vector2(-radius, c), new THREE.Vector2(-c, radius), new THREE.Vector2(0, radius)),
        ];
        const points = path.getPoints(fineness);
        if (reverse) points.reverse();
        return points;
      };
      function createShape({ innerRadius = 4, outerRadius = 6, fineness = 30 }){
        const baseShape = new THREE.Shape(getPath(outerRadius, fineness, false));
        baseShape.holes.push(new THREE.Path(getPath(innerRadius, fineness, true)));
        return baseShape;
      }
      function Tube({ amount = 4, radius = 6, thickness = 2 }){
        const shape = createShape({ innerRadius: radius - thickness, outerRadius: radius, fineness: 14 });
        const props = { amount: amount, depth: amount, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.2, bevelSegments: 1 };
        const geometry = new THREE.ExtrudeGeometry(shape, props);
        geometry.center();
        geometry.computeVertexNormals();
        geometry.rotateX(Math.PI * 0.5);
        geometry.rotateZ(Math.PI);
        return geometry;
      }

      const SIDE = 10, AMOUNT = 15, RADIUS = 6, THICKNESS = 2, OFFSET = 0.3;
      const SPACING = (RADIUS + OFFSET) * 2; // 12.6
      function buildField(){
        const tube = Tube({ amount: AMOUNT, radius: RADIUS, thickness: THICKNESS });
        // merge SIDE x SIDE copies of the tube into one non-indexed BufferGeometry
        const one = tube.index ? tube.toNonIndexed() : tube;
        const src = one.attributes.position.array, pos = new Float32Array(src.length * SIDE * SIDE);
        let o = 0;
        for (let j = 0; j < SIDE; j++) for (let i = 0; i < SIDE; i++) {
          for (let k = 0; k < src.length; k += 3) { pos[o++] = src[k] + i * SPACING; pos[o++] = src[k + 1]; pos[o++] = src[k + 2] + j * SPACING; }
        }
        const buffer = new THREE.BufferGeometry();
        buffer.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        buffer.center();
        buffer.computeVertexNormals(); // clean normals so the lights actually hit
        // NOTE: a 2-material array fails to draw with this r83 buffer geometry;
        // a single Lambert renders the whole field and lights correctly.
        const material = new THREE.MeshLambertMaterial({ color: 0x333333, emissive: 0x000000, flatShading: true, side: THREE.DoubleSide });
        return new THREE.Mesh(buffer, material);
      }
      const fieldMesh = buildField();
      scene.add(fieldMesh);

      /* ===== Light balls — deterministic, seekable ===== */
      const PINK = 0xf82c91;
      const NB = 3;                 // number of rising balls (reference uses 3)
      const P = 1.5;                // seconds per rise cycle (quick, like the reference)
      const CYCLES = 8;             // cycles per loop → DURATION = P * CYCLES = 12s
      const Y0 = -5, Y1 = 18;       // rise exactly like the reference (-5 → 18)
      const LRAD = 12.4;            // reference lateral step for ball columns
      const balls = [];
      for (let b = 0; b < NB; b++) {
        const group = new THREE.Group();
        const light = new THREE.PointLight(PINK, 4.0, 18, 1.0);
        group.add(light);
        const mat = new THREE.MeshBasicMaterial({ color: PINK, transparent: true, opacity: 0 });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(2, 20, 20), mat);
        group.add(mesh);
        scene.add(group);
        balls.push({ group, light, mesh, mat });
      }
      // Reference column picker: THREE.Math.randInt(-2, 2) * 12.4 + 12.4 * 0.5
      function cellPos(r){ return (Math.floor(r * 5) - 2) * LRAD + LRAD * 0.5; }

      /* ===== Special GREEN ball: rises at 3.5s, freezes mid-air for 2s while
         the pink balls keep bouncing, then blooms until it engulfs the frame. ===== */
      const GREEN_NUM = 0x33f06a;
      const G_START = 3.5, G_RISE_DUR = 0.8, G_FREEZE = 2.0;
      const G_FROZEN = G_START + G_RISE_DUR;     // 4.30 — reaches mid-air, freezes
      const SHINE_START = G_FROZEN + G_FREEZE;    // 6.30 — begins to shine
      const SHINE_DUR = 4.2;                      // fully engulfed by ~10.5s
      const RETRACT_START = 11.0, RETRACT_END = 13.7; // the light retracts back into the ball
      const G_X = 6.2, G_Z = 6.2, G_YMID = 12.5;  // frozen mid-air spot, suspended high above the tubes
      const greenGroup = new THREE.Group();
      const greenLight = new THREE.PointLight(GREEN_NUM, 0.0, 8, 1.0);
      greenGroup.add(greenLight);
      const greenMat = new THREE.MeshBasicMaterial({ color: GREEN_NUM, transparent: true, opacity: 0 });
      const greenMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 20, 20), greenMat);
      greenGroup.add(greenMesh);
      greenGroup.position.set(G_X, -5, G_Z);
      greenGroup.visible = false;
      scene.add(greenGroup);
      const engulf = document.querySelector("[data-engulf]");
      const _proj = new THREE.Vector3();

      function applyTime(t) {
        // During the final retract, everything but the green ball is gone.
        const retracting = t >= RETRACT_START;
        fieldMesh.visible = !retracting;
        for (let b = 0; b < NB; b++) {
          const ball = balls[b];
          if (retracting) { ball.group.visible = false; continue; }
          ball.group.visible = true;
          const localT = t + b * (P / NB) * 1.61803; // spread phases
          const cyc = Math.floor(localT / P);
          const u = clamp01((localT - cyc * P) / P);
          // seed by cycle MOD CYCLES so the whole field repeats every loop → seamless.
          const rnd = mulberry32(hash2(b * 2654435761, (((cyc % CYCLES) + CYCLES) % CYCLES) * 40503));
          let x = cellPos(rnd()), z = cellPos(rnd());
          // Keep the pink balls out of the GREEN ball's tunnel while it is
          // suspended there: if this bounce-cycle overlaps the green event and
          // landed on the green column, reroute it to a neighbouring tunnel.
          const cycStart = cyc * P - b * (P / NB) * 1.61803;
          const greenBusy = (cycStart + P) > G_START && cycStart < (SHINE_START + 1.5);
          if (greenBusy && Math.abs(x - G_X) < 0.01 && Math.abs(z - G_Z) < 0.01) { x = -6.2; }
          const smoothstep = (a, bb, x) => { const k = clamp01((x - a) / (bb - a)); return k * k * (3 - 2 * k); };
          // THE BOUNCE: the original's SlowMo yoyoMode (3rd arg `true`) drives
          // the sub-timeline progress 0 → 1 → 0, so the ball rises to the top,
          // hovers (slow-mo at the apex), then drops back DOWN into the tubes
          // — which is also why the original's .set only ever sets x/z, never y.
          // sin(πu) models exactly that: 0 at both ends, slow turnaround at peak.
          const p = Math.sin(Math.PI * u);
          const y = lerpN(Y0, Y1, p);
          // brief fade at the very bottom of the bounce hides the column teleport.
          const fade = smoothstep(0.0, 0.12, p);
          ball.group.position.set(x, y, z);
          // steady intensity (~4); glow distance holds at 6 then widens to 18
          // toward the apex (the "-=1.2" overlap), narrowing again on the descent.
          ball.light.intensity = 4.6 * fade * PT_K;
          ball.light.distance = lerpN(6, 18, smoothstep(0.4, 1.0, p));
          ball.mat.opacity = fade;
          ball.mesh.scale.setScalar(1.0);
        }

        // ----- GREEN ball: rise → freeze → bloom -----
        let gShine = 0, gy = G_YMID;
        if (t < G_START) {
          greenGroup.visible = false;
        } else {
          greenGroup.visible = true;
          if (t < G_FROZEN) {
            // rises from below to its mid-air spot
            const rp = clamp01((t - G_START) / G_RISE_DUR), e = rp * rp * (3 - 2 * rp);
            gy = lerpN(-5, G_YMID, e);
            greenLight.intensity = 4.0 * PT_K; greenLight.distance = 8;
            greenMat.opacity = clamp01(rp * 2.5);
            greenMesh.scale.setScalar(1);
          } else if (t < SHINE_START) {
            // frozen, dead still, with a faint "charging" pulse
            gy = G_YMID;
            const pulse = 0.5 + 0.5 * Math.sin((t - G_FROZEN) * Math.PI * 2.0);
            greenLight.intensity = (3.4 + 1.3 * pulse) * PT_K; greenLight.distance = 8;
            greenMat.opacity = 1; greenMesh.scale.setScalar(1);
          } else if (t < RETRACT_START) {
            // shines, accelerating, until it engulfs everything
            gy = G_YMID;
            gShine = clamp01((t - SHINE_START) / SHINE_DUR);
            const acc = gShine * gShine;
            greenLight.intensity = lerpN(5, 60, acc) * PT_K;
            greenLight.distance = lerpN(8, 150, gShine);
            greenMat.opacity = 1; greenMesh.scale.setScalar(lerpN(1, 8, acc));
          } else {
            // RETRACT: the light pulls back into the ball, which drifts to the
            // dead centre of the frame and floats there, alone, on black.
            const rp = clamp01((t - RETRACT_START) / (RETRACT_END - RETRACT_START));
            const e = rp * rp * (3 - 2 * rp);
            greenGroup.position.set(lerpN(G_X, 0, e), lerpN(G_YMID, 0, e), lerpN(G_Z, 0, e));
            greenLight.intensity = lerpN(60, 7, e) * PT_K; greenLight.distance = lerpN(150, 22, e);
            greenMat.opacity = 1; greenMesh.scale.setScalar(lerpN(8, 2.6, e));
          }
          if (t < RETRACT_START) greenGroup.position.set(G_X, gy, G_Z);
        }

        renderer.render(scene, camera);

        // ----- engulf overlay: grows from the green ball into a full-frame
        // white-green wash, then RETRACTS back into the ball as a soft green halo.
        _proj.set(greenGroup.position.x, greenGroup.position.y, greenGroup.position.z).project(camera);
        const sx = (_proj.x * 0.5 + 0.5) * 100;
        const sy = (1 - (_proj.y * 0.5 + 0.5)) * 100;
        const at = "circle at " + sx.toFixed(1) + "% " + sy.toFixed(1) + "%";
        if (t < SHINE_START) {
          engulf.style.opacity = "0";
        } else if (t < RETRACT_START) {
          // GROW → engulf
          const s = clamp01((t - SHINE_START) / SHINE_DUR);
          const g1 = lerpN(0.4, 48, s), g2 = lerpN(3, 185, s);
          const outer = "#" + Math.round(lerpN(0x1f, 0x46, s)).toString(16).padStart(2, "0") + "d070";
          engulf.style.background = "radial-gradient(" + at + ", #ffffff 0%, #ffffff " + g1.toFixed(1) +
            "%, #5dffa0 " + g2.toFixed(1) + "%, " + outer + " " + (g2 + 50).toFixed(1) + "%)";
          engulf.style.opacity = clamp01(s * 1.2).toFixed(3);
        } else {
          // RETRACT → collapse the wash back into a tight green halo on the ball
          const rp = clamp01((t - RETRACT_START) / (RETRACT_END - RETRACT_START));
          const e = rp * rp * (3 - 2 * rp);
          const g1 = lerpN(48, 0, e);                          // white core shrinks away
          const g2 = lerpN(185, 17, e);                        // wash collapses to a halo
          engulf.style.background = "radial-gradient(" + at + ", rgba(255,255,255," + (1 - e).toFixed(3) + ") 0%, rgba(255,255,255," + (1 - e).toFixed(3) +
            ") " + g1.toFixed(1) + "%, #4dff93 " + g2.toFixed(1) + "%, rgba(45,220,110,0) " + (g2 + 24).toFixed(1) + "%)";
          engulf.style.opacity = lerpN(1.0, 0.78, e).toFixed(3);
        }
      }

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 14, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
      function tick(){ applyTime(tl.time()); requestAnimationFrame(tick); }
      applyTime(0); tick();
      window.__hf = { get duration(){ return tl.duration(); }, seek: function(t){ tl.seek(t); applyTime(t); } };
    </script>
  
<style>
  /* InstaLanding: the 1920x1080 stage, scaled to fit the window and centred on black */
  html { width: 100% !important; height: 100% !important; overflow: hidden !important; background: #000 !important; }
  body { position: absolute !important; left: 0; top: 0; margin: 0 !important; transform-origin: 0 0; }
  #il-replay { position: fixed; right: 16px; bottom: 16px; z-index: 2147483647; padding: 9px 16px; border: 1px solid rgba(255,255,255,.28);
    border-radius: 99px; background: rgba(20,20,24,.55); color: #fff; font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #il-replay.on { opacity: 1; pointer-events: auto; }
  #il-replay:hover { background: rgba(60,60,70,.7); }
</style>
<script>
/* InstaLanding player: play the template's timeline in real time (the original waits for a
   renderer to seek it), fit the stage, and offer Replay at the end. ?t=4.5 holds one frame. */
(function () {
  var W = 1920, H = 1080;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    document.body.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
  var btn = document.createElement("button");
  btn.id = "il-replay"; btn.type = "button"; btn.textContent = "Replay";
  document.documentElement.appendChild(btn);
  var tries = 0;
  (function start() {
    var tl = window.__timelines && window.__timelines.main;
    if (!tl) { if (tries++ < 200) setTimeout(start, 25); return; }
    var qs = new URLSearchParams(location.search);
    if (qs.has("t")) { tl.pause(); tl.seek(Math.min(tl.duration(), +qs.get("t") || 0)); window.__READY__ = true; return; }
    var replay = function () { btn.classList.remove("on"); tl.restart(); };
    tl.eventCallback("onComplete", function () { btn.classList.add("on"); });
    btn.addEventListener("click", replay);
    addEventListener("keydown", function (e) { if (e.code === "Space" && btn.classList.contains("on")) { e.preventDefault(); replay(); } });
    tl.play(0);
  })();
})();
</script>
