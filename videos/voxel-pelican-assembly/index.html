    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background:
          radial-gradient(circle at 80% 15%, #fff1b8 0 10%, transparent 18%),
          linear-gradient(#9edcff 0%, #c8f1ff 48%, #ffe2a9 100%);
      }
      #mc { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 1; }
      .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 60%, rgba(20,30,45,0.26) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <canvas id="mc" width="1920" height="1080"></canvas>
      <div class="vignette"></div>
    </div>

    <script>
      "use strict";
      // ─────────────────────────────────────────────────────────────
      //  Voxel Pelican Assembly — a "Pelican Riding a Bicycle" seaside
      //  diorama (Three.js) that builds itself block-by-block from the
      //  ground up (0 → 100), then comes alive (wheels turning, pelican
      //  bobbing, waves, clouds, gulls, lighthouse beam). Every block's
      //  pop-in and every motion is a pure function of t — the wall-clock
      //  loop and mouse controls are removed — so tl.seek(t) is exact.
      // ─────────────────────────────────────────────────────────────
      function clamp01(x){ return Math.max(0, Math.min(1, x)); }
      function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
      function easeOutBack(x){ const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }

      const mcEl = document.getElementById('mc');
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0xcff4ff, 12, 34);
      const renderer = new THREE.WebGLRenderer({ canvas: mcEl, antialias: true, alpha: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const camera = new THREE.OrthographicCamera(-8, 8, 6, -6, 0.1, 1000);
      const target = new THREE.Vector3(0, 2.4, 0);
      let azimuth = Math.PI * 0.26;
      let elevation = Math.PI * 0.17;
      const distance = 13;
      function lerpN(a, b, u){ return a + (b - a) * u; }
      (function(){ const aspect = 1920/1080, view = 7.3; camera.left = -view*aspect; camera.right = view*aspect; camera.top = view; camera.bottom = -view; })();
      function updateCamera() {
        const r = distance * Math.cos(elevation);
        camera.position.set(target.x + r*Math.sin(azimuth), target.y + distance*Math.sin(elevation), target.z + r*Math.cos(azimuth));
        camera.lookAt(target);
        camera.updateProjectionMatrix();
      }

      scene.add(new THREE.HemisphereLight(0xbff4ff, 0xc58d5a, 2.25));
      const sunLight = new THREE.DirectionalLight(0xffffff, 2.55);
      sunLight.position.set(6, 9, 7);
      sunLight.castShadow = true;
      sunLight.shadow.camera.left = -10; sunLight.shadow.camera.right = 10; sunLight.shadow.camera.top = 10; sunLight.shadow.camera.bottom = -10;
      sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
      scene.add(sunLight);
      const fill = new THREE.DirectionalLight(0x9bd1ff, 0.82);
      fill.position.set(-7, 4, -6);
      scene.add(fill);

      const palette = {
        ink: 0x17202a, tire: 0x18222d, tireHi: 0x2c3c4e, metal: 0xc7d2dc, metalDark: 0x758594, chrome: 0xe7f1f5,
        bike: 0x1fb7a6, bikeDark: 0x0b7f79, bikeLight: 0x8df2df, seat: 0x2b2430, wood: 0xbe7f44, woodDark: 0x8f5a2f, woodLight: 0xdfa96a,
        sand: 0xf3d28f, sandDark: 0xdfb972, shell: 0xffeed4, shellPink: 0xffb6aa, ocean: 0x1aa6c5, oceanDark: 0x157da3, oceanLight: 0x78e5f4, foam: 0xf7ffff,
        white: 0xfffbec, warmWhite: 0xf7eddb, shadeWhite: 0xded8cc, wing: 0xe9edf0, wingShade: 0xaeb7c2, featherLine: 0x8795a4,
        beak: 0xffa536, beakTop: 0xffbd48, beakTip: 0x4c3426, pouch: 0xffc06e, pouchShade: 0xe98b4a, leg: 0xf47b20, legDark: 0xbd4a18,
        helmet: 0x38b7ff, helmetDark: 0x1677c7, helmetLight: 0x9be7ff, grass: 0x58a84d, grassDark: 0x347b3d, flower: 0xff5e8f, red: 0xe64132, yellow: 0xffd84d,
        lighthouseRed: 0xd83a38, lighthouseWhite: 0xf7f3e9, skyWhite: 0xffffff, cloudShade: 0xd7eef8, crab: 0xff5d3d, star: 0xff8f3f, buoyRed: 0xe84b4b, rope: 0xc09055, signGreen: 0x227f69, signFace: 0xf7f2d2
      };

      const materialCache = new Map();
      const geometryCache = new Map();
      function material(color, options = {}) {
        const key = [color, options.opacity ?? 1, options.emissive ?? 0, options.roughness ?? .72, options.metalness ?? 0].join('|');
        if (!materialCache.has(key)) {
          materialCache.set(key, new THREE.MeshStandardMaterial({
            color, roughness: options.roughness ?? .72, metalness: options.metalness ?? 0,
            emissive: options.emissive ?? 0x000000, emissiveIntensity: options.emissiveIntensity ?? 0.7,
            transparent: (options.opacity ?? 1) < 1, opacity: options.opacity ?? 1, depthWrite: (options.opacity ?? 1) >= .65
          }));
        }
        return materialCache.get(key);
      }
      function geometry(w, h, d) {
        const key = `${w.toFixed(4)}|${h.toFixed(4)}|${d.toFixed(4)}`;
        if (!geometryCache.has(key)) geometryCache.set(key, new THREE.BoxGeometry(w, h, d));
        return geometryCache.get(key);
      }

      const world = new THREE.Group();
      scene.add(world);
      const allBlocks = []; // every voxel, for the assembly reveal
      let collectBlocks = true; // false while building the ride-on bridge

      function box({ group = world, x = 0, y = 0, z = 0, w = 1, h = 1, d = 1, color = 0xffffff, rx = 0, ry = 0, rz = 0, opacity = 1, emissive = 0x000000, roughness = .72, metalness = 0, cast = true, receive = true }) {
        const mesh = new THREE.Mesh(geometry(w, h, d), material(color, { opacity, emissive, roughness, metalness }));
        mesh.position.set(x, y, z); mesh.rotation.set(rx, ry, rz); mesh.castShadow = cast; mesh.receiveShadow = receive;
        mesh.visible = false; // hidden until it assembles
        group.add(mesh); if (collectBlocks) allBlocks.push(mesh); return mesh;
      }
      function rod(group, a, b, thickness, color, options = {}) {
        const start = new THREE.Vector3(a.x, a.y, a.z), end = new THREE.Vector3(b.x, b.y, b.z);
        const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
        const dir = new THREE.Vector3().subVectors(end, start);
        const mesh = box({ group, x: mid.x, y: mid.y, z: mid.z, w: dir.length(), h: thickness, d: options.depth ?? thickness, color, opacity: options.opacity ?? 1, metalness: options.metalness ?? 0, roughness: options.roughness ?? .72 });
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.normalize());
        return mesh;
      }
      function voxelEllipsoid(group, cx, cy, cz, rx, ry, rz, step, colorFn) {
        const nx = Math.ceil(rx/step), ny = Math.ceil(ry/step), nz = Math.ceil(rz/step);
        for (let ix = -nx; ix <= nx; ix++) for (let iy = -ny; iy <= ny; iy++) for (let iz = -nz; iz <= nz; iz++) {
          const x = ix*step, y = iy*step, z = iz*step;
          const inside = (x*x)/(rx*rx) + (y*y)/(ry*ry) + (z*z)/(rz*rz);
          if (inside <= 1.02) { const color = typeof colorFn === 'function' ? colorFn(x, y, z, inside) : colorFn; box({ group, x: cx+x, y: cy+y, z: cz+z, w: step*.96, h: step*.96, d: step*.96, color }); }
        }
      }
      function mulberry32(seed) { return function() { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      const rand = mulberry32(777);
      const animated = { waves: [], clouds: [], gulls: [], lights: [], bobbers: [] };

      const env = new THREE.Group();
      world.add(env);

      box({ group: env, x: 0, y: -0.13, z: 0.2, w: 14.5, h: .18, d: 8.8, color: palette.sand, receive: true, cast: false });
      box({ group: env, x: 0, y: -0.09, z: -4.95, w: 15, h: .16, d: 4.15, color: palette.oceanDark, receive: true, cast: false });
      box({ group: env, x: 0, y: -0.035, z: -5.35, w: 15, h: .09, d: 3.35, color: palette.ocean, receive: true, cast: false });

      for (let i = -7; i <= 7; i++) {
        const x = i * .82; const c = i % 2 === 0 ? palette.woodLight : palette.wood;
        box({ group: env, x, y: .015, z: .42, w: .73, h: .13, d: 3.86, color: c });
        box({ group: env, x: x + .31, y: .105, z: .42, w: .035, h: .025, d: 3.75, color: palette.woodDark });
        box({ group: env, x: x - .31, y: .105, z: .42, w: .028, h: .024, d: 3.75, color: palette.woodDark });
        for (const nz of [-1.25, 1.25]) {
          box({ group: env, x: x - .24, y: .185, z: nz, w: .07, h: .026, d: .07, color: palette.ink });
          box({ group: env, x: x + .24, y: .185, z: nz, w: .07, h: .026, d: .07, color: palette.ink });
        }
        for (let g = 0; g < 3; g++) {
          box({ group: env, x: x + (rand() - .5) * .36, y: .185, z: -1.15 + g * 1.15 + (rand() - .5) * .2, w: .18 + rand() * .16, h: .022, d: .025, color: i % 2 ? palette.woodDark : palette.wood });
        }
      }
      box({ group: env, x: 0, y: .16, z: -1.62, w: 12.1, h: .18, d: .14, color: palette.woodDark });
      box({ group: env, x: 0, y: .16, z: 2.48, w: 12.1, h: .18, d: .14, color: palette.woodDark });

      const fencePosts = [];
      for (let x = -5.9; x <= 5.95; x += 1.18) {
        box({ group: env, x, y: .62, z: -1.78, w: .22, h: 1.08, d: .22, color: palette.woodDark });
        box({ group: env, x, y: 1.2, z: -1.78, w: .32, h: .16, d: .32, color: palette.woodLight });
        fencePosts.push(x);
      }
      for (let i = 0; i < fencePosts.length - 1; i++) {
        rod(env, { x: fencePosts[i] + .08, y: .94, z: -1.78 }, { x: fencePosts[i + 1] - .08, y: .94, z: -1.78 }, .07, palette.rope);
        rod(env, { x: fencePosts[i] + .08, y: .72, z: -1.78 }, { x: fencePosts[i + 1] - .08, y: .72, z: -1.78 }, .06, palette.rope);
      }

      for (let row = 0; row < 4; row++) for (let i = -9; i <= 9; i++) {
        if ((i + row) % 2 === 0) {
          const b = box({ group: env, x: i * .72 + row * .18, y: .06, z: -3.15 - row * .72, w: .38 + rand() * .2, h: .07, d: .13, color: row === 0 ? palette.foam : palette.oceanLight });
          b.userData.wavePhase = rand() * Math.PI * 2; animated.waves.push(b);
        }
      }

      for (let i = 0; i < 72; i++) {
        const nearFront = rand() > .35;
        const x = -6.6 + rand() * 13.2;
        const z = nearFront ? 2.75 + rand() * 1.35 : -2.6 + rand() * .8;
        const colors = [palette.shell, palette.shellPink, palette.sandDark, palette.oceanLight, palette.woodDark];
        const s = .045 + rand() * .075;
        box({ group: env, x, y: .085, z, w: s * (1.4 + rand()), h: .03, d: s, color: colors[Math.floor(rand() * colors.length)], rz: rand() * Math.PI });
      }

      for (const n of neckNodes) voxelEllipsoid(pelican, n[0], n[1], n[2], n[3], n[4], .24, .115, (x, y, z) => z > .13 || y < -.08 ? palette.warmWhite : palette.white);
      box({ group: pelican, x: .72, y: 3.98, z: .28, w: .09, h: .56, d: .07, color: palette.shadeWhite, rz: -.38 });

      box({ group: pelican, x: 1.18, y: 4.68, z: 0, w: .72, h: .16, d: .58, color: palette.helmet });
      box({ group: pelican, x: 1.02, y: 4.76, z: 0, w: .46, h: .16, d: .46, color: palette.helmetLight });
      box({ group: pelican, x: 1.38, y: 4.62, z: .02, w: .34, h: .09, d: .5, color: palette.helmetDark });
      box({ group: pelican, x: 1.53, y: 4.56, z: .12, w: .32, h: .075, d: .35, color: palette.helmetDark, rz: -.06 });
      box({ group: pelican, x: 1.02, y: 4.76, z: .31, w: .06, h: .13, d: .08, color: palette.helmetDark });
      box({ group: pelican, x: 1.22, y: 4.78, z: .31, w: .06, h: .13, d: .08, color: palette.helmetDark });
      rod(pelican, { x: 1.24, y: 4.52, z: .4 }, { x: 1.35, y: 4.17, z: .35 }, .035, palette.ink);
      rod(pelican, { x: 1.02, y: 4.5, z: -.32 }, { x: 1.17, y: 4.16, z: -.3 }, .03, palette.ink);
      box({ group: pelican, x: 2.08, y: 4.32, z: 0, w: 1.55, h: .22, d: .36, color: palette.beakTop });
      box({ group: pelican, x: 2.02, y: 4.45, z: .02, w: 1.32, h: .08, d: .28, color: palette.yellow });
      box({ group: pelican, x: 2.89, y: 4.29, z: 0, w: .34, h: .18, d: .3, color: palette.beak });
      box({ group: pelican, x: 3.11, y: 4.28, z: 0, w: .18, h: .15, d: .25, color: palette.beakTip });
      box({ group: pelican, x: 2.08, y: 4.1, z: 0, w: 1.43, h: .18, d: .32, color: palette.pouch });
      box({ group: pelican, x: 1.98, y: 3.92, z: 0, w: 1.15, h: .18, d: .29, color: palette.pouch });
      box({ group: pelican, x: 2.1, y: 3.76, z: 0, w: .82, h: .17, d: .26, color: palette.pouchShade });
      box({ group: pelican, x: 2.23, y: 3.61, z: 0, w: .46, h: .13, d: .21, color: palette.pouchShade });
      box({ group: pelican, x: 2.05, y: 4.18, z: .205, w: 1.25, h: .035, d: .045, color: palette.beakTip });
      box({ group: pelican, x: 1.8, y: 3.96, z: .19, w: .42, h: .045, d: .04, color: palette.pouchShade, rz: -.18 });
      box({ group: pelican, x: 2.25, y: 3.83, z: .19, w: .38, h: .045, d: .04, color: palette.pouchShade, rz: .12 });
      box({ group: pelican, x: 2.0, y: 4.38, z: .22, w: .085, h: .042, d: .04, color: palette.ink });
      box({ group: pelican, x: 2.68, y: 4.43, z: .19, w: .13, h: .045, d: .04, color: palette.yellow });
      // InstaLanding: legs as two fixed-length bones from a fixed hip, solved each frame so the foot rides its pedal
      const THIGH = .8, SHIN = 1.0;
      const LEGS = [
        { hip: { x: -.18, y: 2.8, z: .2 }, kz: .36, fz: .46, far: false, t: .105, upper: palette.leg, lower: palette.leg },
        { hip: { x: -.55, y: 2.75, z: -.15 }, kz: -.3, fz: -.36, far: true, t: .09, upper: palette.legDark, lower: palette.leg },
      ];
      function solveLeg(L, tx, ty) {
        const h = L.hip, dx = tx - h.x, dy = ty - h.y;
        const d = Math.min(THIGH + SHIN - .001, Math.max(Math.abs(THIGH - SHIN) + .001, Math.hypot(dx, dy)));
        const base = Math.atan2(dy, dx), A = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
        const ka = { x: h.x + Math.cos(base + A) * THIGH, y: h.y + Math.sin(base + A) * THIGH };
        const kb = { x: h.x + Math.cos(base - A) * THIGH, y: h.y + Math.sin(base - A) * THIGH };
        const k = ka.x > kb.x ? ka : kb; // knees point forward
        const fd = Math.hypot(tx - k.x, ty - k.y) || 1;
        return { knee: { x: k.x, y: k.y, z: L.kz }, foot: { x: k.x + (tx - k.x) / fd * SHIN, y: k.y + (ty - k.y) / fd * SHIN, z: L.fz } };
      }
      function makeFoot(group, x, y, z, side) {
        const g = new THREE.Group(); g.position.set(x, y, z); group.add(g);
        box({ group: g, x: 0, y: 0, z: 0, w: .42, h: .11, d: .18, color: palette.leg, rz: side * .05 });
        for (let i = -1; i <= 1; i++) box({ group: g, x: .18 + i * .02, y: -.03, z: i * .11, w: .24, h: .07, d: .08, color: i === 0 ? palette.leg : palette.legDark, rz: side * .12 });
        box({ group: g, x: -.16, y: -.02, z: 0, w: .17, h: .08, d: .15, color: palette.legDark });
        return g;
      }
      for (const L of LEGS) {
        const p = pedalAt(CRANK0, L.far), pose = solveLeg(L, p.x, p.y);
        L.thigh = rod(pelican, L.hip, pose.knee, L.t, L.upper);
        L.shin = rod(pelican, pose.knee, pose.foot, L.t, L.lower);
        L.kneeBox = box({ group: pelican, ...pose.knee, w: L.far ? .14 : .16, h: L.far ? .14 : .16, d: L.far ? .12 : .14, color: palette.legDark });
        L.footGroup = makeFoot(pelican, pose.foot.x + .04, pose.foot.y + .06, L.fz, L.far ? -1 : 1);
      }
      // Pedal from the ride's start, easing up to cadence over 0.6 s; the crank turns clockwise with the wheels
      const CADENCE = Math.PI, EASE_IN = .6;
      function pedalTo(t) {
        const s = Math.max(0, t - RIDE_START), e = s < EASE_IN ? s * s / (2 * EASE_IN) : s - EASE_IN / 2;
        const a = CRANK0 - e * CADENCE;
        for (const P of pedals) { const p = pedalAt(a, P.far); setRod(P.arm, { x: crank.x, y: crank.y, z: P.z0 }, { x: p.x, y: p.y, z: P.z1 }); P.block.position.set(p.x, p.y, P.z1); }
        for (const L of LEGS) {
          const p = pedalAt(a, L.far), pose = solveLeg(L, p.x, p.y - pelican.position.y);
          setRod(L.thigh, L.hip, pose.knee); setRod(L.shin, pose.knee, pose.foot);
          L.kneeBox.position.set(pose.knee.x, pose.knee.y, pose.knee.z);
          L.footGroup.position.set(pose.foot.x + .04, pose.foot.y + .06, L.fz);
        }
      }
      box({ group: pelican, x: .42, y: 4.02, z: .36, w: .3, h: .09, d: .09, color: palette.red, rz: -.25 });
      box({ group: pelican, x: .22, y: 3.98, z: .43, w: .32, h: .08, d: .08, color: palette.red, rz: -.58 });
      box({ group: pelican, x: .08, y: 3.87, z: .46, w: .2, h: .07, d: .07, color: palette.buoyRed, rz: -.72 });

      box({ group: env, x: -.34, y: .115, z: .44, w: 1.95, h: .025, d: .54, color: palette.ink, opacity: .1, cast: false, receive: false });

      function makeGrassPatch(x, z, count, flower = false) {
        const g = new THREE.Group(); g.position.set(x, .1, z); env.add(g);
        for (let i = 0; i < count; i++) { const ox = (rand() - .5) * .45, oz = (rand() - .5) * .32, h = .18 + rand() * .28; box({ group: g, x: ox, y: h / 2, z: oz, w: .055, h, d: .055, color: rand() > .5 ? palette.grass : palette.grassDark, rz: (rand() - .5) * .55 }); }
        if (flower) { box({ group: g, x: .04, y: .44, z: .02, w: .08, h: .08, d: .08, color: palette.flower }); box({ group: g, x: -.06, y: .38, z: .05, w: .07, h: .07, d: .07, color: palette.yellow }); }
      }
      makeGrassPatch(-5.8, 2.92, 8, true);
      makeGrassPatch(5.9, 2.1, 9, true);
      makeGrassPatch(4.6, -2.25, 7, false);
      makeGrassPatch(-4.45, -2.32, 6, false);

      const buoy = new THREE.Group(); buoy.position.set(-3.15, .15, -3.05); env.add(buoy);
      box({ group: buoy, x: 0, y: .24, z: 0, w: .28, h: .48, d: .28, color: palette.foam });
      box({ group: buoy, x: 0, y: .18, z: 0, w: .32, h: .12, d: .32, color: palette.buoyRed });
      box({ group: buoy, x: 0, y: .4, z: 0, w: .32, h: .12, d: .32, color: palette.buoyRed });
      rod(env, { x: -3.15, y: .28, z: -3.05 }, { x: -2.7, y: .18, z: -2.85 }, .04, palette.rope);
      animated.bobbers.push({ object: buoy, baseY: .15, amplitude: .035, k1: 2, k2: 1, phase: .4 });

      box({ group: bike, x: -2.25, y: 2.19, z: .3, w: .055, h: .22, d: .055, color: palette.chrome, metalness: .35 });
      box({ group: bike, x: 2.17, y: 2.19, z: .3, w: .055, h: .22, d: .055, color: palette.chrome, metalness: .35 });
      for (let i = 0; i < 9; i++) box({ group: env, x: -2.9 - i * .18, y: .17 + rand() * .04, z: 1.12 + (rand() - .5) * .18, w: .08 + rand() * .08, h: .03, d: .07 + rand() * .05, color: palette.sandDark, opacity: .55, cast: false });

      /* ===== ASSEMBLY SETUP — order each voxel bottom → top ===== */
      const DURATION = 24, ASSEMBLY_END = 8, ASSEMBLY_SPAN = 6.6, REVEAL = 0.5;
      const BASE = (2 * Math.PI) / 8; // idle base frequency
      const AZ0 = Math.PI * 0.26, EL0 = Math.PI * 0.17; // isometric build angle
      const FLAT_START = 7.8, FLAT_DUR = 1.6;            // ease iso → flat 2D side view
      const RIDE_START = 8.6, RIDE_SPEED = 2.0;          // pelican sets off
      const LOOKAHEAD = 6.0, REVEAL_DIST = 2.2;          // bridge builds ahead
      (function setupAssembly(){
        world.updateMatrixWorld(true);
        const wp = new THREE.Vector3();
        let minY = Infinity, maxY = -Infinity;
        for (const m of allBlocks) { m.getWorldPosition(wp); m.userData.wy = wp.y; if (wp.y < minY) minY = wp.y; if (wp.y > maxY) maxY = wp.y; }
        const span = Math.max(0.001, maxY - minY);
        const jr = mulberry32(4242);
        for (const m of allBlocks) { const ny = (m.userData.wy - minY) / span; m.userData.spawn = ny * ASSEMBLY_SPAN + jr() * 0.22; }
      })();

      /* ===== RIDE-ON BRIDGE — segments materialise ahead of the bike ===== */
      collectBlocks = false; // these reveal by bike position, not by assembly
      const bridge = new THREE.Group(); world.add(bridge);
      const bridgeSegs = [];
      const BR_X0 = 6.0, BR_STEP = 0.82, BR_N = 40;
      for (let i = 0; i < BR_N; i++) {
        const sx = BR_X0 + i * BR_STEP;
        const seg = new THREE.Group(); seg.position.set(sx, 0, 0); bridge.add(seg);
        // SAND ground below the bridge (no water)
        box({ group: seg, x: 0, y: -1.55, z: 0.42, w: BR_STEP + .02, h: 2.0, d: 6.4, color: i % 2 ? palette.sand : palette.sandDark, cast: false, receive: true });
        // a few sandy pebbles/shells dressing the dune top
        if (i % 3 === 0) box({ group: seg, x: (i % 2 ? .2 : -.2), y: -.5, z: 0.42 + (i % 5 - 2) * .9, w: .12, h: .04, d: .1, color: i % 2 ? palette.shell : palette.shellPink });
        // deck plank + grain
        box({ group: seg, x: 0, y: .02, z: 0.42, w: BR_STEP - .02, h: .14, d: 2.5, color: i % 2 ? palette.woodLight : palette.wood, receive: true });
        box({ group: seg, x: .27, y: .105, z: .42, w: .03, h: .025, d: 2.4, color: palette.woodDark });
        box({ group: seg, x: -.27, y: .105, z: .42, w: .03, h: .025, d: 2.4, color: palette.woodDark });
        // short legs onto the sand
        for (const lz of [-1.0, 1.0]) box({ group: seg, x: 0, y: -.42, z: 0.42 + lz, w: .16, h: .82, d: .16, color: palette.woodDark });
        // rail on the FAR side only, so it never blocks the 2D side profile
        box({ group: seg, x: 0, y: .5, z: 0.42 - 1.15, w: .12, h: .82, d: .12, color: palette.woodDark });
        box({ group: seg, x: 0, y: .92, z: 0.42 - 1.15, w: BR_STEP, h: .07, d: .07, color: palette.rope });
        seg.traverse(function(o){ if (o.isMesh) o.visible = true; });
        seg.scale.setScalar(0.0001); seg.visible = false;
        bridgeSegs.push({ group: seg, x: sx });
      }
      collectBlocks = true;

      /* ===== PER FRAME (everything a pure function of t) ===== */
      function applyTime(t) {
        // ── Assemble each voxel: scale-pop from nothing, ground → top. ──
        for (let i = 0; i < allBlocks.length; i++) {
          const m = allBlocks[i];
          const p = clamp01((t - m.userData.spawn) / REVEAL);
          if (p <= 0) { m.visible = false; continue; }
          m.visible = true;
          m.scale.setScalar(Math.max(0.0001, easeOutBack(p)));
        }

        // ── The ride: once assembled the pelican sets off down +X. ──
        const bikeX = t < RIDE_START ? 0 : (t - RIDE_START) * RIDE_SPEED;
        bike.position.x = bikeX;
        pelican.position.x = bikeX;

        // ── Bridge: each segment pops in ahead of the bike as it rides. ──
        for (let i = 0; i < bridgeSegs.length; i++) {
          const seg = bridgeSegs[i];
          const bp = clamp01((bikeX - (seg.x - LOOKAHEAD)) / REVEAL_DIST);
          if (bp <= 0) { seg.group.visible = false; continue; }
          seg.group.visible = true;
          seg.group.scale.setScalar(Math.max(0.0001, easeOutBack(bp)));
        }

        // ── Idle motion — at rest during the build, alive once assembled.
        //    Wheels keep spinning (pedalling, then rolling along the bridge). ──
        const live = Math.max(0, t - ASSEMBLY_END);
        const wheelRot = -live * (BASE * 4);
        backWheel.rotation.z = wheelRot; frontWheel.rotation.z = wheelRot;
        chainGroup.rotation.z = Math.sin(live * BASE * 4) * .015;
        pelican.position.y = Math.sin(live * BASE * 3) * .035;
        pelican.rotation.z = Math.sin(live * BASE * 2) * .012;
        pedalTo(t); // InstaLanding: the legs pedal
        for (const wv of animated.waves) wv.position.y = .06 + Math.sin(live * BASE + wv.userData.wavePhase) * .035;
        for (const c of animated.clouds) c.position.x = c.userData.startX + Math.sin(live * BASE + c.userData.phase) * .35;
        for (const g of animated.gulls) { g.position.y = g.userData.startY + Math.sin(live * BASE + g.userData.phase) * .045; g.rotation.z = Math.sin(live * BASE * 2 + g.userData.phase) * .08; }
        for (const l of animated.lights) { l.scale.x = 1 + Math.sin(live * BASE) * .08; l.material.opacity = .18 + Math.sin(live * BASE) * .055; }
        for (const b of animated.bobbers) { b.object.position.y = b.baseY + Math.sin(live * BASE * b.k1 + b.phase) * b.amplitude; b.object.rotation.z = Math.sin(live * BASE * b.k2 + b.phase) * .025; }

        // ── Camera: isometric during the build, eases to a COMPLETE 2D
        //    flat side-on view for the ride, tracking the bike. ──
        const fp = easeOutCubic(clamp01((t - FLAT_START) / FLAT_DUR));
        azimuth = lerpN(AZ0, 0, fp);
        elevation = lerpN(EL0, 0, fp);
        target.x = bikeX;
        updateCamera();

        renderer.render(scene, camera);
      }

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DURATION, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
      function tick(){ applyTime(tl.time()); requestAnimationFrame(tick); }
      applyTime(0); tick();
      window.__hf = { get duration(){ return tl.duration(); }, seek: function(t){ tl.seek(t); applyTime(t); } };
    </script>
  
<style>
  /* InstaLanding: the 1920x1080 stage, scaled to fit the window and centred on black */
  html { width: 100% !important; height: 100% !important; overflow: hidden !important; background: #000 !important; }
  body { position: absolute !important; left: 0; top: 0; margin: 0 !important; transform-origin: 0 0; }
  #il-replay { position: fixed; right: 16px; bottom: 16px; z-index: 2147483647; padding: 9px 16px; border: 1px solid rgba(255,255,255,.28);
    border-radius: 99px; background: rgba(20,20,24,.55); color: #fff; font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #il-replay.on { opacity: 1; pointer-events: auto; }
  #il-replay:hover { background: rgba(60,60,70,.7); }
</style>
<script>
/* InstaLanding player: play the template's timeline in real time (the original waits for a
   renderer to seek it), fit the stage, and offer Replay at the end. ?t=4.5 holds one frame. */
(function () {
  var W = 1920, H = 1080;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    document.body.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
  var btn = document.createElement("button");
  btn.id = "il-replay"; btn.type = "button"; btn.textContent = "Replay";
  document.documentElement.appendChild(btn);
  var tries = 0;
  (function start() {
    var tl = window.__timelines && window.__timelines.main;
    if (!tl) { if (tries++ < 200) setTimeout(start, 25); return; }
    var qs = new URLSearchParams(location.search);
    if (qs.has("t")) { tl.pause(); tl.seek(Math.min(tl.duration(), +qs.get("t") || 0)); window.__READY__ = true; return; }
    var replay = function () { btn.classList.remove("on"); tl.restart(); };
    tl.eventCallback("onComplete", function () { btn.classList.add("on"); });
    btn.addEventListener("click", replay);
    addEventListener("keydown", function (e) { if (e.code === "Space" && btn.classList.contains("on")) { e.preventDefault(); replay(); } });
    tl.play(0);
  })();
})();
</script>
