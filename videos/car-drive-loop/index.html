        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: var(--hv-w, 1920px);
        height: var(--hv-h, 1080px);
        overflow: hidden;
        background: #0c0c0c;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Circular porthole — the scrolling road + car live inside. */
      /* Full-frame scene, clipped to a circular porthole. The clip radius
         (--reveal) expands at the end to open up the whole picture. */
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #17123a;
        clip-path: circle(var(--reveal, 290px) at 50% 55.5%);
        -webkit-clip-path: circle(var(--reveal, 290px) at 50% 55.5%);
      }
      /* The synthwave landscape (sky, sun, mountains, cacti, balloons)
         is painted to this canvas every frame from the timeline clock. */
      .bgcanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      /* The porthole rim — a thin bezel at the dial-face edge. Scales +
         fades out as the circle opens at the end. */
      .rim {
        position: absolute;
        top: 55.5%;
        left: 50%;
        width: 580px;
        height: 580px;
        margin: -290px 0 0 -290px;
        border-radius: 50%;
        border: 8px solid #2c2c2c;
        box-shadow:
          inset 0 4px 14px rgba(0, 0, 0, 0.5),
          0 0 0 2px #4a4a4a;
        pointer-events: none;
        z-index: 4;
      }

      /* The car sits on the road line, centred in the frame. */
      #car {
        position: absolute;
        width: 680px;
        height: auto;
        left: 50%;
        bottom: 6.4%;
        transform: translateX(-50%);
        --shadow-blur: 0px;
        --shadow-alpha: 0;
        --shadow-color: rgba(1, 185, 61, var(--shadow-alpha));
        filter: drop-shadow(0px 0px var(--shadow-blur) var(--shadow-color));
        z-index: 2;
      }

      /* ── Tick-mark speedometer dial: a ring of dashes that fills with a
         pink→orange→green gradient up to the current speed, scaled + centred
         so it rings the porthole with the car scene as its dial face. ── */
      .speedo {
        position: absolute;
        left: 550px;
        top: 190px;
        width: 820px;
        z-index: 5;
        pointer-events: none;
      }
      .speedo svg { width: 100%; height: auto; display: block; overflow: visible; }
      .speedo .ticks { stroke-dasharray: 1 5.15; fill: transparent; }
      .speedo .neutral { stroke: rgba(255, 255, 255, 0.16); }
    </style>

      #root {
        transform: scale(var(--hv-zoom, 1));
        transform-origin: center center;
        will-change: transform;
      }
    </style>

    <script>
      // ───────────────────────────────────────────────────────────────
      //  Synthwave landscape — sky, sun, mountains, foreground cacti &
      //  rocks, and drifting hot-air balloons. The scene is painted to a
      //  canvas every frame from the timeline clock (tl.time()), so it is
      //  fully deterministic / seekable. The car (an SVG) drives in front.
      // ───────────────────────────────────────────────────────────────
      (function () {
        const cv = document.getElementById("bgcanvas");
        const ctx = cv.getContext("2d", { alpha: false });
        const W = 1920, H = 1080, FGW = 1920;
        const GROUND = 700; // horizon line — cacti bases & the car's wheels

        // reference palette
        const dbl = "rgb(30, 26, 77)";
        const pnk = "rgb(255, 176, 200)";
        const dpnk = "rgb(184, 84, 119)";

        // deterministic PRNG so the stars are identical on every render
        let _s = 20260608;
        const rnd = () => { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; };

        // ───────── static background (sky / stars / sun / mountains) ─────────
        const bg = document.createElement("canvas");
        bg.width = W; bg.height = H;
        (function paintBg() {
          const b = bg.getContext("2d", { alpha: false });

          // sky gradient (deep indigo → sunset pink)
          const sky = b.createLinearGradient(0, 0, 0, GROUND + 80);
          sky.addColorStop(0, dbl);
          sky.addColorStop(1, pnk);
          b.fillStyle = sky;
          b.fillRect(0, 0, W, H);

          // stars (fixed, upper sky only)
          b.fillStyle = "rgba(255, 255, 255, 0.65)";
          for (let i = 0; i < 110; i++) {
            const sy = (GROUND - 140) * rnd();
            b.globalAlpha = 0.25 + 0.5 * rnd();
            b.beginPath();
            b.arc(W * rnd(), sy, 1.4 * rnd() + 0.3, 0, 2 * Math.PI);
            b.fill();
          }
          b.globalAlpha = 1;

          // sun — soft glow + bright disc, centred
          const cx = W * 0.5, cy = 420;
          const glow = b.createRadialGradient(cx, cy, 70, cx, cy, 330);
          glow.addColorStop(0, "rgba(250, 150, 170, 0.85)");
          glow.addColorStop(0.7, "rgba(158, 92, 150, 0)");
          b.fillStyle = glow;
          b.fillRect(0, 0, W, H);
          const disc = b.createRadialGradient(cx, cy, 62, cx, cy, 118);
          disc.addColorStop(0, "rgba(255,255,255,1)");
          disc.addColorStop(0.72, "rgba(255,255,255,0)");
          b.fillStyle = disc;
          b.beginPath(); b.arc(cx, cy, 118, 0, 2 * Math.PI); b.fill();

          // mountains — three jagged bezier ranges, lit pink from below
          const rock = b.createLinearGradient(W * 0.1, 0, W, 120);
          rock.addColorStop(0, dbl);
          rock.addColorStop(0.5, dpnk);
          rock.addColorStop(1, dbl);
          const sunset = (stop) => {
            const g = b.createLinearGradient(0, GROUND, 0, 0);
            g.addColorStop(0, pnk);
            g.addColorStop(stop, "rgba(36, 33, 74, 0)");
            return g;
          };
          const ridge = (topY, amp, phase, segs) => {
            b.beginPath();
            b.moveTo(0, topY + Math.sin(phase) * amp);
            for (let i = 1; i <= segs; i++) {
              const x = (W / segs) * i;
              const y = topY + Math.sin(phase + i * 1.7) * amp;
              const mx = x - (W / segs) / 2;
              const my = topY + Math.sin(phase + (i - 0.5) * 1.7) * amp - amp * 0.7;
              b.quadraticCurveTo(mx, my, x, y);
            }
            b.lineTo(W, H); b.lineTo(0, H); b.closePath();
          };
          // back → front: lower top, taller, more jagged
          ridge(470, 70, 0.3, 7); b.fillStyle = rock; b.fill();
          ridge(470, 70, 0.3, 7); b.fillStyle = sunset(0.62); b.fill();
          ridge(540, 95, 2.1, 6); b.fillStyle = rock; b.fill();
          ridge(540, 95, 2.1, 6); b.fillStyle = sunset(0.55); b.fill();
          ridge(610, 120, 4.4, 5); b.fillStyle = rock; b.fill();
          ridge(610, 120, 4.4, 5); b.fillStyle = sunset(0.42); b.fill();
        })();

        // ───────── foreground strip (ground + cacti + rocks), tileable ─────────
        const fg = document.createElement("canvas");
        fg.width = FGW; fg.height = H;
        (function paintFg() {
          const f = fg.getContext("2d", { alpha: true });
          const dark = "rgb(8, 6, 23)";   // silhouette
          const mid = "rgb(20, 14, 44)";  // slightly lifted

          // ground
          const gnd = f.createLinearGradient(0, GROUND, 0, H);
          gnd.addColorStop(0, "rgb(46, 26, 60)");
          gnd.addColorStop(1, "rgb(98, 52, 70)");
          f.fillStyle = gnd;
          f.fillRect(0, GROUND, FGW, H - GROUND);
          // straight, level horizon — the floor/road ends in a flat line.
          // a darker band fading down from it adds depth without any curve.
          const band = f.createLinearGradient(0, GROUND, 0, GROUND + 40);
          band.addColorStop(0, "rgba(18, 12, 40, 0.9)");
          band.addColorStop(1, "rgba(18, 12, 40, 0)");
          f.fillStyle = band;
          f.fillRect(0, GROUND, FGW, 40);
          // crisp sunset rim glow along the level horizon line
          f.fillStyle = "rgba(255, 168, 198, 0.62)";
          f.fillRect(0, GROUND - 2, FGW, 3);

          // a saguaro cactus (trunk + two arms), as dark strokes
          const cactus = (x, s, color) => {
            f.save(); f.translate(x, GROUND); f.scale(s, s);
            f.strokeStyle = color; f.lineWidth = 17; f.lineCap = "round"; f.lineJoin = "round";
            f.beginPath();
            f.moveTo(0, 6); f.lineTo(0, -210);            // trunk
            f.moveTo(0, -92); f.lineTo(-36, -92); f.lineTo(-36, -150);  // left arm
            f.moveTo(0, -126); f.lineTo(38, -126); f.lineTo(38, -200);  // right arm
            f.stroke(); f.restore();
          };
          // a blocky/segmented cactus
          const blockCactus = (x, w, h, s, color) => {
            f.save(); f.translate(x, GROUND); f.scale(s, s);
            f.fillStyle = color;
            f.beginPath();
            f.roundRect(-w / 2, -h, w, h, w / 2);
            f.roundRect(-w / 2 - w * 0.9, -h * 0.62, w * 0.8, h * 0.5, w / 2);
            f.fill(); f.restore();
          };
          // a leafy agave-style plant (ported bezier blob)
          const leafy = (x, s, color) => {
            f.save(); f.translate(x, GROUND); f.scale(s, s); f.translate(-930, -480);
            f.fillStyle = color; f.beginPath();
            f.moveTo(960, 480);
            f.bezierCurveTo(890, 480, 850, 480, 850, 420);
            f.bezierCurveTo(860, 430, 880, 440, 900, 440);
            f.bezierCurveTo(870, 430, 860, 410, 860, 380);
            f.bezierCurveTo(880, 400, 890, 400, 910, 400);
            f.bezierCurveTo(890, 400, 880, 380, 880, 350);
            f.bezierCurveTo(900, 370, 910, 365, 920, 360);
            f.bezierCurveTo(900, 330, 910, 350, 940, 300);
            f.bezierCurveTo(950, 340, 970, 330, 950, 360);
            f.bezierCurveTo(960, 370, 970, 370, 990, 360);
            f.bezierCurveTo(980, 390, 970, 400, 960, 400);
            f.bezierCurveTo(960, 400, 970, 410, 1000, 390);
            f.bezierCurveTo(1000, 400, 980, 440, 960, 440);
            f.bezierCurveTo(970, 440, 990, 450, 1010, 430);
            f.bezierCurveTo(1010, 460, 990, 480, 960, 480);
            f.closePath(); f.fill(); f.restore();
          };
          // a small spiky agave ball (ported rotating-blades plant)
          const spiky = (x, s, color) => {
            f.save(); f.translate(x, GROUND - 4); f.scale(s, s);
            f.fillStyle = color;
            for (let i = 0; i < 15; i++) {
              f.save(); f.rotate(i * 0.8);
              f.beginPath(); f.roundRect(0, 0, 4, 28, 2); f.fill(); f.restore();
            }
            f.beginPath(); f.arc(0, 0, 7, 0, 2 * Math.PI); f.fill();
            f.restore();
          };
          // a rounded rock formation (stacked arcs)
          const rocks = (x, s, color) => {
            f.save(); f.translate(x, GROUND); f.scale(s, s);
            f.fillStyle = color;
            f.beginPath();
            f.moveTo(-150, 0);
            f.lineTo(-150, -70);
            f.bezierCurveTo(-150, -150, -60, -180, -20, -150);
            f.bezierCurveTo(0, -230, 70, -240, 95, -170);
            f.bezierCurveTo(150, -200, 175, -120, 150, -60);
            f.lineTo(150, 0);
            f.closePath(); f.fill();
            f.restore();
          };

          // lay out the desert foreground (kept clear of the tile seam)
          rocks(280, 1.0, dark);
          leafy(620, 0.55, mid);
          cactus(780, 1.0, dark);
          spiky(940, 1.5, mid);
          blockCactus(1130, 70, 150, 1.0, dark);
          cactus(1340, 0.82, dark);
          leafy(1560, 0.42, mid);
          spiky(1700, 1.1, dark);
        })();

        // ───────── per-frame composite ─────────
        function balloon(s, x, y) {
          ctx.save();
          ctx.translate(x, y); ctx.scale(s, s);
          const g = ctx.createLinearGradient(0, -46, 0, 60);
          g.addColorStop(0, "#3a2a6e");
          g.addColorStop(1, "#a8486a");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, 46, 0.55, Math.PI * 0.5 + 0.95, true);
          ctx.lineTo(-6, 60); ctx.lineTo(9, 60);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#2a1f4e";
          ctx.beginPath(); ctx.roundRect(-7, 62, 16, 12, 4); ctx.fill();
          ctx.restore();
        }

        // speedometer dial — the colored tick wedge fills with the car's
        // speed, driven from the same timeline clock. The fill is a pie-wedge
        // clip path (−135°→angle) that reveals the gradient ticks.
        const fillMask = document.getElementById("fill-mask");
        const speedoEl = document.querySelector(".speedo");
        const polar = (cx, cy, r, deg) => {
          const a = ((deg - 90) * Math.PI) / 180;
          return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
        };
        const arcWedge = (cx, cy, r, a0, a1) => {
          const [sx, sy] = polar(cx, cy, r, a1);
          const [ex, ey] = polar(cx, cy, r, a0);
          const large = a1 - a0 <= 180 ? "0" : "1";
          return `M ${sx} ${sy} A ${r} ${r} 0 ${large} 0 ${ex} ${ey} L ${cx} ${cy}`;
        };

        // ── one shared speed model ──────────────────────────────────────
        // kmhAt(t): the gauge reading (accelerating climb → pinned redline).
        // distAt(t): the integral of that speed, so the scenery, wheels and
        // streaks all move by accumulated distance — the car physically
        // accelerates exactly as the speedometer needle climbs.
        const BUILD = 5.2, VMAX = 3000; // VMAX = top scroll speed (px/s)
        const kmhAt = (t) =>
          t < BUILD ? 180 * Math.pow(t / BUILD, 1.9) : 178 + Math.sin(t * 26) * 2;
        const distAt = (t) =>
          t < BUILD
            ? VMAX * (BUILD / 2.9) * Math.pow(t / BUILD, 2.9)
            : VMAX * (BUILD / 2.9) + VMAX * (t - BUILD);
        const WHEEL_K = 3.43; // deg of wheel spin per px travelled (matches VMAX)

        function render(t) {
          ctx.fillStyle = dbl;
          ctx.fillRect(0, 0, W, H);

          // intensity builds out of control: an accelerating climb that
          // slams into the limit, then strains there at the red redline.
          const kmh = Math.max(0, Math.min(180, kmhAt(t)));
          const spd01 = kmh / 180; // 0..1 speed fraction
          const angleEnd = -135 + (kmh / 180) * 270;
          fillMask.setAttribute("d", arcWedge(100, 100, 100, -135, angleEnd) + " L 100 100");

          // a pulsing red glow swells as the needle buries itself in the red
          const redline = Math.max(0, Math.min(1, (kmh - 148) / 32));
          const glow = redline * (0.62 + 0.38 * Math.sin(t * 13));
          speedoEl.style.filter = glow > 0.03
            ? `drop-shadow(0 0 ${(6 + glow * 30).toFixed(0)}px rgba(255,28,28,${(glow * 0.9).toFixed(2)}))`
            : "none";

          // distant scene, gentle vertical bob
          const bob = Math.sin(t * 0.7) * 12;
          ctx.drawImage(bg, 0, bob);

          // balloons drifting / bobbing in the sky
          balloon(0.95, 770, 250 + Math.sin(t * 0.55) * 28);
          balloon(0.6, 330, 360 + Math.sin(t * 0.8 + 1.1) * 24);
          balloon(0.72, 1470, 300 + Math.sin(t * 0.5 + 2.3) * 32);

          // foreground streams rightward — its scroll is the accumulated
          // distance, so the scenery accelerates with the speedometer.
          const off = ((distAt(t) % FGW) + FGW) % FGW;
          const fbob = Math.sin(t * 0.9) * 5;
          ctx.drawImage(fg, off - FGW, fbob);
          ctx.drawImage(fg, off, fbob);

          // wheels spin at the car's actual speed (so they accelerate too)
          gsap.set(["#front-wheel", "#back-wheel"], { rotation: distAt(t) * WHEEL_K });

          // soft contact shadow under the wheels so the car reads as sitting
          // ON the ground (sits on the foreground, behind the SVG car). Two
          // darker pools under each wheel + a faint body shadow between.
          ctx.save();
          ctx.filter = "blur(7px)";
          ctx.fillStyle = "rgba(5,2,12,0.5)";
          ctx.beginPath();
          ctx.ellipse(960, GROUND + 26 + fbob, 250, 14, 0, 0, Math.PI * 2); // body
          ctx.fill();
          ctx.fillStyle = "rgba(3,1,8,0.62)";
          ctx.beginPath();
          ctx.ellipse(812, GROUND + 28 + fbob, 70, 15, 0, 0, Math.PI * 2);  // front wheel
          ctx.ellipse(1102, GROUND + 28 + fbob, 70, 15, 0, 0, Math.PI * 2); // back wheel
          ctx.fill();
          ctx.restore();

          // motion streaks blasting past to sell the speed
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          for (let i = 0; i < 26; i++) {
            const lane = ((i * 47) % 100) / 100;          // fixed lane per streak
            const sy = 470 + lane * (H - 540);             // mid-to-ground band
            const speed = 5200 + (i % 5) * 1400;           // px / s at full tilt
            const phase = (i * 0.137) % 1;
            const sx = -260 + (((distAt(t) * (speed / VMAX)) / (W + 520) + phase) % 1) * (W + 520);
            const len = 150 + (i % 4) * 90;
            // streaks fade in as the car speeds up (no wind when crawling)
            const a = (sy > GROUND ? 0.16 : 0.12) * spd01;
            const g = ctx.createLinearGradient(sx, 0, sx + len, 0);
            const col = sy > GROUND ? "255,200,220" : "255,255,255";
            g.addColorStop(0, `rgba(${col},0)`);
            g.addColorStop(0.5, `rgba(${col},${a})`);
            g.addColorStop(1, `rgba(${col},0)`);
            ctx.fillStyle = g;
            ctx.fillRect(sx, sy, len, 2.2);
          }
          ctx.restore();
        }

        function tlTime() {
          const tl = window.__timelines && window.__timelines.main;
          return tl ? tl.time() : 0;
        }
        function loop() { render(tlTime()); requestAnimationFrame(loop); }
        loop();
        window.addEventListener("hf-seek", (e) => {
          const t = e && e.detail && typeof e.detail.time === "number" ? e.detail.time : tlTime();
          render(t);
        });

        // ───────────────── GSAP timeline (car + porthole) ─────────────────
        const tl = gsap.timeline({ paused: true });

        // wheels: just set the spin origin — the spin itself is driven by
        // accumulated distance in render() so it accelerates with the car.
        gsap.set(["#front-wheel", "#back-wheel"], { transformOrigin: "center center" });

        // harder engine jitter at speed
        tl.fromTo("#body",
          { x: -4, y: -3 },
          { x: 4, y: 3, ease: "none", yoyo: true, duration: 0.06, repeat: Math.ceil(10 / 0.06) },
          0,
        );

        // pulsing green flux glow
        tl.to("#car", {
          "--shadow-alpha": 0.6, "--shadow-blur": "40px",
          duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 18,
        }, 0);

        // ── the gauge fades and the dial face opens to the whole landscape ──
        const REVEAL = 6.7;
        gsap.set(".scene", { "--reveal": "290px" });
        gsap.set([".rim", ".speedo"], { transformOrigin: "50% 50%" });
        tl.to(".scene", { "--reveal": "1110px", duration: 1.8, ease: "power2.inOut" }, REVEAL);
        tl.to(".rim", { scale: 3.4, opacity: 0, duration: 1.8, ease: "power2.inOut" }, REVEAL);
        // the speedometer ring scales up and dissolves as the circle opens
        tl.to(".speedo", { scale: 1.5, opacity: 0, duration: 1.5, ease: "power2.in" }, REVEAL);

        // hold out to 10s
        tl.to({}, { duration: 10 }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines.main = tl;
      })();
    </script>
  
<style>
  /* InstaLanding: the 1920x1080 stage, scaled to fit the window and centred on black */
  html { width: 100% !important; height: 100% !important; overflow: hidden !important; background: #000 !important; }
  body { position: absolute !important; left: 0; top: 0; margin: 0 !important; transform-origin: 0 0; }
  #il-replay { position: fixed; right: 16px; bottom: 16px; z-index: 2147483647; padding: 9px 16px; border: 1px solid rgba(255,255,255,.28);
    border-radius: 99px; background: rgba(20,20,24,.55); color: #fff; font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #il-replay.on { opacity: 1; pointer-events: auto; }
  #il-replay:hover { background: rgba(60,60,70,.7); }
</style>
<script>
/* InstaLanding player: play the template's timeline in real time (the original waits for a
   renderer to seek it), fit the stage, and offer Replay at the end. ?t=4.5 holds one frame. */
(function () {
  var W = 1920, H = 1080;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    document.body.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
  var btn = document.createElement("button");
  btn.id = "il-replay"; btn.type = "button"; btn.textContent = "Replay";
  document.documentElement.appendChild(btn);
  var tries = 0;
  (function start() {
    var tl = window.__timelines && window.__timelines.main;
    if (!tl) { if (tries++ < 200) setTimeout(start, 25); return; }
    var qs = new URLSearchParams(location.search);
    if (qs.has("t")) { tl.pause(); tl.seek(Math.min(tl.duration(), +qs.get("t") || 0)); window.__READY__ = true; return; }
    var replay = function () { btn.classList.remove("on"); tl.restart(); };
    tl.eventCallback("onComplete", function () { btn.classList.add("on"); });
    btn.addEventListener("click", replay);
    addEventListener("keydown", function (e) { if (e.code === "Space" && btn.classList.contains("on")) { e.preventDefault(); replay(); } });
    tl.play(0);
  })();
})();
</script>
</body>
