    <script>
      "use strict";
      // ─────────────────────────────────────────────────────────────
      //  Iso City — Day & Night. A CSS-3D isometric tower (after Ana
      //  Tudor / the original "day-night" pen) that auto-cycles between
      //  day and night: the sun sets and the moon rises, the sky gradient
      //  shifts, stars fade in, clouds drift up/down and the window-light
      //  hue warms — then it reverses, on a seamless loop.
      //
      //  The toggle's :checked state and CSS transitions/keyframes aren't
      //  seekable, so the cycle is driven entirely from t via CSS custom
      //  properties + inline styles — tl.seek(t) reproduces an identical
      //  frame (render-safe).
      // ─────────────────────────────────────────────────────────────
      function clamp01(x){ return Math.max(0, Math.min(1, x)); }
      function easeInOutCubic(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
      function lerpN(a,b,u){ return a + (b-a)*u; }

      function lerpColor(a, b, u){
        const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
        const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
        return "rgb(" + pa.map((v,i)=>Math.round(lerpN(v, pb[i], u))).join(",") + ")";
      }
      // [r,g,b,a] → [r,g,b,a] rgba lerp.
      function lerpRGBA(a, b, u){
        return "rgba(" + Math.round(lerpN(a[0],b[0],u)) + "," + Math.round(lerpN(a[1],b[1],u)) + "," + Math.round(lerpN(a[2],b[2],u)) + "," + lerpN(a[3],b[3],u).toFixed(3) + ")";
      }

      const content   = document.querySelector("[data-content]");
      const moonSun   = document.querySelector("[data-moonsun]");
      const clouds    = document.querySelector("[data-clouds]");
      const tgContainer = document.querySelector("[data-toggle-container]");
      const tgSun     = document.querySelector("[data-toggle-sun]");
      const tgMoon    = document.querySelector("[data-toggle-moon]");
      const tgClouds  = document.querySelector("[data-toggle-clouds]");
      const tgStars   = document.querySelector("[data-toggle-stars]");
      const info      = document.querySelector("[data-info]");
      const infoSun   = document.querySelector("[data-info-sun]");
      const infoMoon  = document.querySelector("[data-info-moon]");
      const tempDay   = document.querySelector("[data-temp-day]");
      const tempNight = document.querySelector("[data-temp-night]");
      const metaDay   = document.querySelector("[data-meta-day]");
      const metaNight = document.querySelector("[data-meta-night]");

      // ── Timeline: DAY → toggle flips → NIGHT kicks in → flips back → DAY,
      //    looping seamlessly. ──
      const DURATION = 11;
      const CLICK1 = 2.6, CLICK2 = 6.9, TT = 1.3;   // toggle flips + transition time

      // night(t): 0 = day, 1 = night. Each flip triggers a fast transition.
      function nightAt(t) {
        if (t < CLICK1) return 0;
        if (t < CLICK1 + TT) return easeInOutCubic((t - CLICK1) / TT);
        if (t < CLICK2) return 1;
        if (t < CLICK2 + TT) return 1 - easeInOutCubic((t - CLICK2) / TT);
        return 0;
      }
      // Big-sky sun/moon arc + which body, tied to the same transitions.
      function bodyAt(t) {
        if (t < CLICK1) return { bottom: 70, body: "sun" };
        if (t < CLICK1 + TT) { const tp = (t - CLICK1) / TT; return { bottom: 70 - 105 * Math.sin(Math.PI * tp), body: tp < 0.5 ? "sun" : "moon" }; }
        if (t < CLICK2) return { bottom: 70, body: "moon" };
        if (t < CLICK2 + TT) { const tp = (t - CLICK2) / TT; return { bottom: 70 - 105 * Math.sin(Math.PI * tp), body: tp < 0.5 ? "moon" : "sun" }; }
        return { bottom: 70, body: "sun" };
      }

      function applyTime(t) {
        const night = nightAt(t), day = 1 - night;

        // ── Big scene ──
        content.style.setProperty("--glass", lerpN(200, 337, night).toFixed(1) + "deg");
        content.style.setProperty("--sky-pos", lerpN(10, 90, day).toFixed(2) + "%");
        content.style.setProperty("--star-op", night.toFixed(3));
        const bd = bodyAt(t);
        moonSun.style.bottom = (bd.bottom * 10.8).toFixed(2) + "px"; // was vmin of a 1080p window
        moonSun.className = "moon-sun " + (bd.body === "sun" ? "is-sun" : "is-moon");
        clouds.style.top = lerpN(75, -10, day).toFixed(2) + "vh";
        clouds.style.opacity = lerpN(0.6, 1, day).toFixed(3);

        // ── Toggle pill (driven by the same night value, no CSS transitions) ──
        tgContainer.style.backgroundColor = lerpColor("#3d7eae", "#1d1f2c", night);
        tgSun.style.transform = "translateX(" + lerpN(0.1875, 3.3125, night).toFixed(4) + "em)";
        tgMoon.style.transform = "translateX(" + lerpN(100, 0, night).toFixed(2) + "%)";
        tgClouds.style.transform = "translateY(" + lerpN(0, 3, night).toFixed(3) + "em)";
        tgStars.style.transform = "translateY(" + lerpN(-2, 0.5, night).toFixed(3) + "em)";

        // ── Weather / info module: frosted-glass chrome shifts light→dark,
        //    city stays put, time-of-day + temperature crossfade. ──
        info.style.background = lerpRGBA([255,255,255,0.34], [22,26,48,0.50], night);
        info.style.borderColor = lerpRGBA([255,255,255,0.55], [150,166,210,0.30], night);
        info.style.color = lerpColor("#15233f", "#eef2fb", night);
        infoSun.style.opacity = day.toFixed(3);
        infoMoon.style.opacity = night.toFixed(3);
        tempDay.style.opacity = day.toFixed(3);
        tempNight.style.opacity = night.toFixed(3);
        metaDay.style.opacity = day.toFixed(3);
        metaNight.style.opacity = night.toFixed(3);
      }

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DURATION, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
      function tick(){ applyTime(tl.time()); requestAnimationFrame(tick); }
      applyTime(0); tick();
      window.__hf = { get duration(){ return tl.duration(); }, seek: function(t){ tl.seek(t); applyTime(t); } };
    </script>
  
<style>
  /* InstaLanding: the 1920x1080 stage, scaled to fit the window and centred on black */
  html { width: 100% !important; height: 100% !important; overflow: hidden !important; background: #000 !important; }
  body { position: absolute !important; left: 0; top: 0; margin: 0 !important; transform-origin: 0 0; }
  #il-replay { position: fixed; right: 16px; bottom: 16px; z-index: 2147483647; padding: 9px 16px; border: 1px solid rgba(255,255,255,.28);
    border-radius: 99px; background: rgba(20,20,24,.55); color: #fff; font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer; backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #il-replay.on { opacity: 1; pointer-events: auto; }
  #il-replay:hover { background: rgba(60,60,70,.7); }
</style>
<script>
/* InstaLanding player: play the template's timeline in real time (the original waits for a
   renderer to seek it), fit the stage, and offer Replay at the end. ?t=4.5 holds one frame. */
(function () {
  var W = 1920, H = 1080;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    document.body.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
  var btn = document.createElement("button");
  btn.id = "il-replay"; btn.type = "button"; btn.textContent = "Replay";
  document.documentElement.appendChild(btn);
  var tries = 0;
  (function start() {
    var tl = window.__timelines && window.__timelines.main;
    if (!tl) { if (tries++ < 200) setTimeout(start, 25); return; }
    var qs = new URLSearchParams(location.search);
    if (qs.has("t")) { tl.pause(); tl.seek(Math.min(tl.duration(), +qs.get("t") || 0)); window.__READY__ = true; return; }
    var replay = function () { btn.classList.remove("on"); tl.restart(); };
    tl.eventCallback("onComplete", function () { btn.classList.add("on"); });
    btn.addEventListener("click", replay);
    addEventListener("keydown", function (e) { if (e.code === "Space" && btn.classList.contains("on")) { e.preventDefault(); replay(); } });
    tl.play(0);
  })();
})();
</script>
