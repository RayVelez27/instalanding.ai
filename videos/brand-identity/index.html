<script>
/* ---------- math ---------- */
const I = [1, 0, 0, 1, 0, 0];
const mul = (a, b) => [
  a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
  a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
  a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5]];

  const d = m[0] * m[3] - m[1] * m[2];
  if (!d) return null;

    (m[2] * m[5] - m[3] * m[4]) * id, (m[1] * m[4] - m[0] * m[5]) * id];
};
const tp = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];

/* ---------- cubic ease (bezier easing) ---------- */
function makeEase(x1, y1, x2, y2) {
  const N = 11, step = 1 / (N - 1);

const eIOExpo = (t) => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const eInBack = (t, s = 1.7) => (s + 1) * t * t * t - s * t * t;
const spring = (u, k = 5.5, w = 10) => u <= 0 ? 0 : 1 - Math.exp(-k * u) * Math.cos(w * u);
const bump = (t, a, b) => { const u = prog(t, a, b); return Math.sin(Math.PI * u); };
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const T = (x, y) => [1, 0, 0, 1, x, y];
const R = (a) => [Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), 0, 0];
const Sc = (x, y = x) => [x, 0, 0, y, 0, 0];
const M = (...ms) => ms.reduce((a, b) => mul(a, b));

const LIME = (() => { const m = new Artboard(0); return css(m.objs[0].fills[0].color.colorValue >>> 0); })();

/* ---------- widgets ---------- */
class ArtWidget {
  constructor(index, region, opts = {}) {
    this.ab = new Artboard(index);
    this.sm = new StateMachine(this.ab, this.ab.def.sm || 0);
    this.region = region; this.opts = opts;
    this.sm.advance(0); this.ab.update();
  }
  advance(dt) { this.sm.advance(dt); this.ab.update(); }
  pointer(type, x, y) { this.sm.pointer(type, x, y); }
  draw(ctx, base) { this.ab.draw(ctx, base, this.opts); }
  pos(id) { const w = this.ab.objs[id].world; return [w[4], w[5]]; }
}
class GridWidget {
  constructor(cols, rows) {
    this.step = 19; this.cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const ab = new Artboard(1), sm = new StateMachine(ab, 0);
      sm.advance(0); ab.update();
      this.cells.push({ ab, sm, x: c * this.step, y: r * this.step });
    }
    this.region = { x: 0, y: 0, w: (cols - 1) * this.step + 20, h: (rows - 1) * this.step + 20 };
  }
  advance(dt) { for (const q of this.cells) { q.sm.advance(dt); q.ab.update(); } }
  pointer(type, x, y) { for (const q of this.cells) q.sm.pointer(type, x - q.x, y - q.y); }
  draw(ctx, base) { for (const q of this.cells) q.ab.draw(ctx, mul(base, T(q.x, q.y))); }
}

const faceW = new ArtWidget(0, { x: 146, y: 136, w: 145, h: 185 });
(() => {
  const ab = faceW.ab, allow = new Set();
  const roots = ab.objs.filter((o) => o.parentId === 0 && ['paper', 'Crocini', 'root-faccina'].includes(o.name)).map((o) => o.id);
  const under = (o) => { let n = o; while (n && n.id !== 0) { if (roots.includes(n.id)) return true; n = ab.objs[n.parentId]; } return false; };
  for (const d of ab.drawables) if (under(d)) allow.add(d.id);
  faceW.opts = { allow, noBg: true };
})();
const typoW = new ArtWidget(4, { x: 0, y: 0, w: 114, h: 114 });
const palW = new ArtWidget(3, { x: 0, y: 0, w: 125, h: 140 });
const cubeW = new ArtWidget(2, { x: 0, y: 0, w: 81, h: 81 });
const gridW = new GridWidget(7, 4);
const finalW = new ArtWidget(0, { x: 0, y: 0, w: 438, h: 438 });

const S = [
  { w: typoW, cw: 620, ch: 620, fit: .78 },
  { w: palW, cw: 600, ch: 660, fit: .8 },
  { w: cubeW, cw: 620, ch: 620, fit: .74 },
  { w: faceW, cw: 560, ch: 700, fit: .86 },
  { w: gridW, cw: 800, ch: 520, fit: .8 },
  { w: finalW, cw: 760, ch: 760, fit: 1 },
];
for (const s of S) {
  const r = s.w.region;
  s.k = Math.min(s.cw * s.fit / r.w, s.ch * s.fit / r.h);
  s.acx = r.x + r.w / 2; s.acy = r.y + r.h / 2;
}
S[5].k = 760 / 438;

/* ---------- timeline ---------- */
const C = [2.45, 5.15, 7.65, 10.15, 12.55, 14.5];
const SHATTER = 13.05;
const HUB = [2880, 540];

/* camera: world -> screen */
function camera(t) {
  let x = 960, y = 540, z = 1, r = 0;
  // whip pan face -> grid
  x = lerp(960, 2880, eIOExpo(prog(t, C[3] + 0.08, C[3] + 0.62)));
  // flip punch
  z *= 1 + 0.14 * bump(t, C[1] + 0.02, C[1] + 0.75);
  r += 0.07 * Math.sin(Math.PI * eIO3(prog(t, C[1] + 0.02, C[1] + 0.75)));
  // whip tilt
  r -= 0.05 * bump(t, C[3] + 0.08, C[3] + 0.62);
  // final pull back
  const pb = eIOExpo(prog(t, SHATTER - 0.05, SHATTER + 0.85));
  z *= lerp(1, 0.55, pb);
  // final slow push
  z *= 1 + 0.035 * eO3(prog(t, SHATTER + 0.85, 15));
  // ambient drift
  z *= 1 + 0.012 * Math.sin(t * 0.8);
  r += 0.006 * Math.sin(t * 0.55 + 1);
  x += 7 * Math.sin(t * 0.9); y += 6 * Math.cos(t * 0.7);
  // click shake
  for (let i = 0; i < C.length; i++) {
    const a = t - C[i];
    if (a > 0 && a < 1) { const k = Math.exp(-a * 7) * Math.sin(a * 42); x += 9 * k; y -= 6 * k; r += 0.004 * k; }
  }
  return { x, y, z, r, m: M(T(960, 540), R(r), Sc(z), T(-x, -y)) };
}

/* card matrix: world placement -> screen frame (origin at card center) */
const cardM = (cam, cx, cy, rot = 0, sc = 1, sx = 1) => M(cam.m, T(cx, cy), R(rot), Sc(sc * sx, sc));
const contentBase = (si, cm, csc = 1) => { const s = S[si]; return M(cm, Sc(s.k * csc), T(-s.acx, -s.acy)); };

/* cursor keyframes, positioned with a reference (rest) camera */
const REST = { m: T(0, 0) };
const P = (si, ax, ay, cx = 960, cy = 540) => tp(contentBase(si, cardM(REST, cx, cy)), ax, ay);
const palP = (id) => { const [x, y] = palW.pos(id); return P(1, x, y); };
const FINAL_SC = 1.6, FIN_Z = 0.55;
const finP = (ax, ay) => tp(contentBase(5, M(T(960, 540), Sc(FINAL_SC * FIN_Z))), ax, ay);
const K = [
  [0, 1500, 1200], [0.55, 1500, 1200],
  [1.25, ...P(0, 70, 64)], [1.75, ...P(0, 50, 58)], [2.15, ...P(0, 62, 52)], [C[0], ...P(0, 58, 56)],
  [2.95, ...P(0, 58, 56)],
  [3.35, ...palP(363)], [3.8, ...palP(438)], [4.25, ...palP(417)], [4.7, ...palP(464)], [C[1], ...palP(367)],
  [5.55, ...palP(367)],
  [6.1, ...P(2, 41, 41)], [6.7, ...P(2, 48, 35)], [7.2, ...P(2, 36, 45)], [C[2], ...P(2, 40.5, 40.5)],
  [8.1, ...P(2, 40.5, 40.5)],
  [8.55, ...P(3, 272, 158)], [9.0, ...P(3, 226, 212)], [9.45, ...P(3, 196, 246)], [9.85, ...P(3, 238, 236)], [C[3], ...P(3, 222, 224)],
  [10.75, ...P(3, 222, 224)],
  [11.15, ...P(4, 8, 10)], [11.55, ...P(4, 46, 54)], [11.9, ...P(4, 90, 16)], [12.25, ...P(4, 120, 62)], [C[4], ...P(4, 66, 38)],
  [13.55, ...P(4, 66, 38)],
  [14.05, ...finP(300, 300)], [C[5], ...finP(250, 270)], [15, ...finP(240, 262)],
];
function cursorAt(t) {
  let i = 0;
  while (i < K.length - 2 && K[i + 1][0] <= t) i++;
  const a = K[i], b = K[i + 1];
  const u = eIO3(prog(t, a[0], b[0]));
  let x = lerp(a[1], b[1], u), y = lerp(a[2], b[2], u);
  const dx = b[1] - a[1], dy = b[2] - a[2], len = Math.hypot(dx, dy);
  if (len > 1) { const bmp = Math.sin(Math.PI * u) * Math.min(70, len * 0.14); x += -dy / len * bmp; y += dx / len * bmp; }
  return [x, y];
}

/* ---------- layout: which cards, where ---------- */
const SAT = [
  { si: 0, dx: -1130, dy: -470, sc: .9, r: -0.05, from: [-2600, -1300], d: 0.0 },
  { si: 1, dx: -1150, dy: 520, sc: .82, r: 0.04, from: [-2700, 1500], d: 0.08 },
  { si: 2, dx: 1130, dy: -500, sc: .86, r: 0.05, from: [2700, -1400], d: 0.04 },
  { si: 3, dx: 1150, dy: 480, sc: .78, r: -0.04, from: [2600, 1500], d: 0.12 },
];

function tilt(cam, cx, cy, t, amt = 1) {
  const [mx, my] = cursorAt(t);
  const [sx] = tp(cam.m, cx, cy);
  return clamp((mx - sx) / 900, -1, 1) * 0.035 * amt;
}

function layout(t) {
  const cam = camera(t);
  const cards = [];
  // S0 Typography: pops in, then crushes into the click
  {
    const pin = spring(prog(t, 0.15, 1.6) * 1.6, 5, 9);
    const crush = eInBack(prog(t, C[0] + 0.03, C[0] + 0.5));
    if (t < C[0] + 0.5) {
      const sc = Math.max(0.0001, pin * (1 - crush));
      const rot = (1 - pin) * 0.35 + crush * 0.5 + tilt(cam, 960, 540, t);
      cards.push({ si: 0, m: cardM(cam, 960, 540, rot, sc), alpha: clamp(pin * 3), sheen: prog(t, 0.6, 1.5), key: 0 });
    }
  }
  // S1 Palette: revealed by circle, springs in, flips out
  const flip = prog(t, C[1] + 0.05, C[1] + 0.65);
  if (t >= C[0] && flip < 0.5) {
    const pin = spring(prog(t, C[0] + 0.05, C[0] + 1.5) * 1.45, 5, 10);
    const fu = eIO3(flip);
    cards.push({ si: 1, m: cardM(cam, 960, 540, (1 - pin) * -0.25 + tilt(cam, 960, 540, t), (0.55 + 0.45 * pin) * (1 - 0.1 * Math.sin(Math.PI * fu)), Math.cos(Math.PI * fu)),
      alpha: 1, shade: fu * 0.9, reveal: prog(t, C[0] + 0.02, C[0] + 0.7), revAt: cursorAt(C[0]), sheen: prog(t, C[0] + 0.5, C[0] + 1.4), key: 1 });
  }
  // S2 Cube: flips in, camera dives through
  const dive = prog(t, C[2] + 0.04, C[2] + 0.6);
  if (flip >= 0.5 && dive < 1) {
    const fu = eIO3(flip);
    const dz = eI3(dive);
    cards.push({ si: 2, m: cardM(cam, 960, 540, tilt(cam, 960, 540, t), (1 - 0.1 * Math.sin(Math.PI * fu)) * (1 + 7 * dz), -Math.cos(Math.PI * fu)),
      alpha: 1 - eI3(prog(t, C[2] + 0.3, C[2] + 0.6)), shade: (1 - fu) * 0.9, key: 2 });
  }
  // S3 Face: rises from depth, whip-panned away
  if (t >= C[2] + 0.15 && t < C[3] + 0.9) {
    const zin = eOExpo(prog(t, C[2] + 0.2, C[2] + 1.1));
    const rot = (1 - zin) * 0.4 + tilt(cam, 960, 540, t);
    cards.unshift({ si: 3, m: cardM(cam, 960, 540, rot, 0.25 + 0.75 * zin), alpha: clamp(zin * 2), sheen: prog(t, C[2] + 0.7, C[2] + 1.6), key: 3 });
  }
  // S4 Grid: lives one screen to the right; shatters
  if (t >= C[3] && t < SHATTER + 0.25) {
    const sh = prog(t, SHATTER, SHATTER + 0.25);
    cards.push({ si: 4, m: cardM(cam, 2880, 540, tilt(cam, 2880, 540, t, 0.6), 1 + 0.08 * eO3(sh)), alpha: 1 - eO3(sh), sheen: prog(t, C[3] + 0.6, C[3] + 1.5), key: 4 });
  }
  // S5 Hub: final card + satellites
  if (t >= SHATTER) {
    const pin = spring(prog(t, SHATTER + 0.15, SHATTER + 1.6) * 1.45, 5, 9);
    const pulse = 0.04 * Math.exp(-Math.max(0, t - C[5]) * 6) * Math.sin(Math.max(0, t - C[5]) * 30);
    const bobY = 8 * Math.sin(t * 1.4);
    for (let i = 0; i < SAT.length; i++) {
      const s = SAT[i];
      const u = spring(prog(t, SHATTER + 0.3 + s.d, SHATTER + 1.8 + s.d) * 1.5, 4.5, 8);
      if (u <= 0) continue;
      const x = HUB[0] + lerp(s.from[0], s.dx, u), y = HUB[1] + lerp(s.from[1], s.dy, u) + 14 * Math.sin(t * 1.2 + i * 1.7);
      const rot = s.r + (1 - u) * (i % 2 ? 0.6 : -0.6) + 0.025 * Math.sin(t * 0.9 + i);
      cards.unshift({ si: s.si, m: cardM(cam, x, y, rot, s.sc * (1 + pulse * 1.5)), alpha: 1, key: 10 + i, dim: 0.0 });
    }
    cards.push({ si: 5, m: cardM(cam, HUB[0], HUB[1] + bobY * 0.4, (1 - pin) * 0.3, FINAL_SC * (0.35 + 0.65 * pin) * (1 + pulse)), alpha: clamp(pin * 2), sheen: prog(t, SHATTER + 0.9, SHATTER + 1.8), key: 5 });
  }
  return { cam, cards };
}

/* ---------- pointer routing ---------- */
function activeScene(t) {
  if (t < C[0] + 0.05) return 0;
  if (t < C[1] + 0.05) return 1;
  if (t < C[2] + 0.05) return 2;
  if (t < C[3] + 0.05) return 3;
  if (t < C[4] + 0.3) return 4;
  if (t > 13.8) return 5;
  return -1;
}

/* ---------- particles (deterministic) ---------- */
function burst(seed, x, y, age, n = 46, power = 1) {
  if (age < 0 || age > 1.6) return;
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, sp = (350 + r() * 900) * power, drag = 3 + r() * 3;
    const life = 0.6 + r() * 0.9;
    if (age > life) { r(); r(); r(); continue; }
    const d = sp * (1 - Math.exp(-drag * age)) / drag;
    const px = x + Math.cos(ang) * d, py = y + Math.sin(ang) * d + 40 * age * age;
    const fade = 1 - age / life;
    const kind = r(), size = 4 + r() * 10, spin = (r() - .5) * 12;
    g.save(); g.setTransform(1, 0, 0, 1, px, py); g.rotate(spin * age);
    g.globalAlpha = fade;
    if (kind < 0.55) { g.fillStyle = '#e0f584'; g.fillRect(-size / 2, -size / 2, size, size); }
    else if (kind < 0.8) { g.strokeStyle = '#e0f584'; g.lineWidth = 2; g.strokeRect(-size / 2, -size / 2, size, size); }
    else { g.fillStyle = '#ffffff'; g.beginPath(); g.arc(0, 0, size * 0.25, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }
}
function shockwave(x, y, age, max = 260) {
  if (age < 0 || age > 0.9) return;
  for (let k = 0; k < 3; k++) {
    const u = clamp((age - k * 0.07) / 0.8);
    if (u <= 0 || u >= 1) continue;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.beginPath(); g.arc(x, y, 10 + eO3(u) * max * (1 + k * 0.5), 0, Math.PI * 2);
    g.strokeStyle = `rgba(224,245,132,${(1 - u) * (0.9 - k * 0.25)})`; g.lineWidth = (k === 0 ? 5 : 2) * (1 - u) + 0.5; g.stroke();
    g.restore();
  }
}
function speedLines(t) {
  const a = bump(t, C[2] + 0.05, C[2] + 0.7);
  if (a <= 0) return;
  const r = rng(77);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const ang = r() * Math.PI * 2, r0 = 120 + r() * 500, len = (250 + r() * 900) * a, w = 1 + r() * 3;
    const off = (t - C[2]) * (1500 + r() * 1500);
    const s0 = r0 + off % 1400;
    g.strokeStyle = `rgba(${r() < 0.7 ? '224,245,132' : '255,255,255'},${a * (0.25 + r() * 0.5)})`;
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(960 + Math.cos(ang) * s0, 540 + Math.sin(ang) * s0);
    g.lineTo(960 + Math.cos(ang) * (s0 + len), 540 + Math.sin(ang) * (s0 + len));
    g.stroke();
  }
  g.restore();
}
/* grid shatter */
let shards = null;
function buildShards() {
  const lay = layout(SHATTER);
  const card = lay.cards.find((c) => c.si === 4);
  if (!card) return [];
  const base = contentBase(4, card.m);
  const r = rng(4242), list = [];
  const sizePx = 19 * Math.hypot(base[0], base[1]);
  const [ox, oy] = tp(base, 66, 38);
  for (const q of gridW.cells) {
    const [x, y] = tp(base, q.x + 10, q.y + 10);
    const ang = Math.atan2(y - oy, x - ox) + (r() - .5) * 0.6;
    list.push({ x, y, ang, sp: 700 + r() * 1400, spin: (r() - .5) * 14, size: sizePx, life: 0.7 + r() * 0.6 });
  }
  return list;
}
function drawShards(t) {
  const age = t - SHATTER;
  if (age < 0 || age > 1.4) return;
  if (!shards) shards = buildShards();
  for (const s of shards) {
    if (age > s.life) continue;
    const d = s.sp * (1 - Math.exp(-3 * age)) / 3;
    const x = s.x + Math.cos(s.ang) * d, y = s.y + Math.sin(s.ang) * d;
    const sc = 1 - 0.6 * (age / s.life);
    g.save(); g.setTransform(1, 0, 0, 1, x, y); g.rotate(s.spin * age); g.scale(sc, sc);
    g.globalAlpha = 1 - age / s.life;
    g.fillStyle = '#313131'; g.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
    g.strokeStyle = '#e0f584'; g.lineWidth = 3; g.strokeRect(-s.size / 2, -s.size / 2, s.size, s.size);
    g.restore();
  }
}

/* ---------- drawing ---------- */
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const noise = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), d = x.createImageData(256, 256), r = rng(9);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
})();

function drawBackground(t, cam) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#0a0b08'; g.fillRect(0, 0, W, H);
  // orbs
  const orbs = [
    [960 + 520 * Math.sin(t * 0.35), 540 + 260 * Math.cos(t * 0.45), 900, 'rgba(224,245,132,0.13)'],
    [960 - 640 * Math.cos(t * 0.28), 540 + 300 * Math.sin(t * 0.33 + 1), 760, 'rgba(150,200,90,0.08)'],
    [960 + 300 * Math.cos(t * 0.5 + 2), 540 - 320 * Math.sin(t * 0.4), 600, 'rgba(255,255,230,0.05)'],
  ];
  for (const [x, y, rad, col] of orbs) {
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  // parallax dot grid (world space at half depth)
  const par = M(T(960, 540), R(cam.r * 0.6), Sc(lerp(1, cam.z, 0.5)), T(-(960 + (cam.x - 960) * 0.45), -(540 + (cam.y - 540) * 0.45)));
  const inv0 = inv(par);
  const [x0, y0] = tp(inv0, -200, -200), [x1, y1] = tp(inv0, W + 200, H + 200);
  const step = 56;
  g.setTransform(...par);
  g.fillStyle = 'rgba(255,255,255,0.07)';
  const minx = Math.floor(Math.min(x0, x1) / step) * step, maxx = Math.max(x0, x1), miny = Math.floor(Math.min(y0, y1) / step) * step, maxy = Math.max(y0, y1);
  for (let y = miny; y < maxy; y += step) for (let x = minx; x < maxx; x += step) g.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function drawCard(c) {
  const s = S[c.si];
  const m = c.m;
  const det = m[0] * m[3] - m[1] * m[2];
  if (c.alpha <= 0.002 || Math.abs(det) < 1e-5) return;
  const cw = s.cw, ch = s.ch, rad = 34;
  g.save();
  g.globalAlpha = c.alpha;
  // shadow (screen space offset)
  g.setTransform(...m);
  g.save();
  const scl = Math.sqrt(Math.abs(det));
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 110 * scl; g.shadowOffsetY = 50 * scl;
  rrect(g, -cw / 2, -ch / 2, cw, ch, rad); g.fillStyle = LIME; g.fill();
  g.restore();
  g.save();
  rrect(g, -cw / 2, -ch / 2, cw, ch, rad); g.clip();
  s.w.draw(g, contentBase(c.si, m, c.csc || 1));
  // sheen
  if (c.sheen > 0 && c.sheen < 1) {
    g.setTransform(...m);
    const sx = lerp(-cw * 1.2, cw * 1.2, eIO3(c.sheen));
    const gr = g.createLinearGradient(sx - 160, -ch / 2, sx + 160, ch / 2);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.globalCompositeOperation = 'soft-light'; g.fillStyle = gr; g.fillRect(-cw, -ch, cw * 2, ch * 2);
    g.globalCompositeOperation = 'source-over';
  }
  if (c.shade) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(10,11,8,${c.shade})`; g.fillRect(0, 0, W, H); }
  g.restore();
  // rim light
  g.setTransform(...m);
  rrect(g, -cw / 2 + 1, -ch / 2 + 1, cw - 2, ch - 2, rad);
  const rim = g.createLinearGradient(0, -ch / 2, 0, ch / 2);
  rim.addColorStop(0, 'rgba(255,255,255,0.55)'); rim.addColorStop(0.4, 'rgba(255,255,255,0.0)');
  g.strokeStyle = rim; g.lineWidth = 2.5; g.stroke();
  g.restore();
}

function drawCursor(x, y, press, alpha) {
  if (alpha <= 0.01) return;
  g.save();
  g.globalAlpha = alpha;
  g.setTransform(press * 1.2, 0, 0, press * 1.2, x, y);
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  g.beginPath();
  g.moveTo(0, 0); g.lineTo(0, 34); g.lineTo(8.5, 26); g.lineTo(14, 39); g.lineTo(20, 36.5); g.lineTo(14.5, 24); g.lineTo(26, 24); g.closePath();
  g.fillStyle = '#fff'; g.fill();
  g.shadowColor = 'transparent';
  g.lineJoin = 'round'; g.lineWidth = 2.2; g.strokeStyle = '#111'; g.stroke();
  g.restore();
}

function renderScene(t) {
  const { cam, cards } = layout(t);
  drawBackground(t, cam);

  for (const c of cards) {
    if (c.reveal != null && c.reveal < 1) {
      const R0 = 2400 * eIO3(c.reveal);
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.beginPath(); g.arc(c.revAt[0], c.revAt[1], R0, 0, Math.PI * 2); g.clip();
      drawCard(c);
      g.restore();
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      g.beginPath(); g.arc(c.revAt[0], c.revAt[1], R0, 0, Math.PI * 2);
      g.strokeStyle = `rgba(224,245,132,${1 - c.reveal})`; g.lineWidth = 10 * (1 - c.reveal) + 1; g.stroke();
      g.restore();
    } else drawCard(c);
  }

  speedLines(t);
  drawShards(t);
  // flash on dive
  const fl = bump(t, C[2] + 0.3, C[2] + 0.75);
  if (fl > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(224,245,132,${0.35 * fl})`; g.fillRect(0, 0, W, H); }

  // clicks
  let press = 1;
  for (let i = 0; i < C.length; i++) {
    const d = t - C[i];
    if (d > -0.12 && d < 0.28) press = d < 0 ? 1 - 0.2 * eO3((d + 0.12) / 0.12) : 0.8 + 0.2 * spring(d / 0.28 * 1.2, 4, 12);
    const [rx, ry] = cursorAt(C[i]);
    shockwave(rx, ry, d, i === 5 ? 520 : 300);
    burst(100 + i * 17, rx, ry, d, i === 5 ? 90 : 46, i === 5 ? 1.5 : 1);
  }
  // pen takes over on the hub
  const [x, y] = cursorAt(t);
  const ca = eO3(prog(t, 0.45, 0.9)) * (1 - eIO3(prog(t, 13.85, 14.15)));
  drawCursor(x, y, press, ca);

  // vignette
  g.setTransform(1, 0, 0, 1, 0, 0);
  const vg = g.createRadialGradient(960, 540, 380, 960, 540, 1250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // fade from black at start
  const fb = 1 - eO3(prog(t, 0, 0.5));
  if (fb > 0) { g.fillStyle = `rgba(0,0,0,${fb})`; g.fillRect(0, 0, W, H); }
}

/* ---------- simulation ---------- */
let simT = 0, prevActive = 0;
const waveDone = new Set();
function step(dt) {
  simT += dt;
  const t = simT;
  const a = activeScene(t);
  if (a !== prevActive) { if (prevActive >= 0) S[prevActive].w.pointer('exit', -1e9, -1e9); prevActive = a; }
  if (a >= 0) {
    const card = layout(t).cards.find((c) => c.si === a && c.key === a);
    if (card) {
      const ib = inv(contentBase(a, card.m, card.csc || 1));
      if (ib) {
        const [ax, ay] = tp(ib, ...cursorAt(t));
        S[a].w.pointer('move', ax, ay);
        for (const c of C) if (c > t - dt && c <= t && a === 5) S[a].w.pointer('down', ax, ay);
      }
    }
  }
  if (t >= SHATTER && !S[2].fresh) { S[2].w = new ArtWidget(2, { x: 0, y: 0, w: 81, h: 81 }); S[2].fresh = true; }
  if (t >= C[4]) {
    for (const q of gridW.cells) {
      const d = Math.hypot(q.x + 10 - 66, q.y + 10 - 38);
      if (!waveDone.has(q) && t >= C[4] + 0.04 + d * 0.005) { q.sm.inputs[0].value = true; waveDone.add(q); }
    }
  }
  for (const s of S) s.w.advance(dt);
}

/* ---------- post: chromatic split + grain ---------- */
const tmp = [0, 1, 2].map(() => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; });
function aberration(t) {
  return 10 * bump(t, C[1] + 0.1, C[1] + 0.6) + 12 * bump(t, C[3] + 0.1, C[3] + 0.6) + 9 * bump(t, C[2] + 0.1, C[2] + 0.7)
    + 8 * bump(t, SHATTER - 0.05, SHATTER + 0.5) + 7 * bump(t, C[5], C[5] + 0.35) + 5 * bump(t, C[0], C[0] + 0.4);
}
function post(t, src) {
  octx.setTransform(1, 0, 0, 1, 0, 0);
  const ab = aberration(t);
  if (ab > 0.3) {
    const cols = ['#ff0000', '#00ff00', '#0000ff'], offs = [-ab, 0, ab];
    octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) {
      const x = tmp[i].getContext('2d');
      x.globalCompositeOperation = 'source-over'; x.drawImage(src, 0, 0);
      x.globalCompositeOperation = 'multiply'; x.fillStyle = cols[i]; x.fillRect(0, 0, W, H);
      octx.globalCompositeOperation = 'lighter';
      // radial-ish split: scale about center
      const s = 1 + offs[i] / 960;
      octx.setTransform(s, 0, 0, s, 960 * (1 - s), 540 * (1 - s));
      octx.drawImage(tmp[i], 0, 0);
    }
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.globalCompositeOperation = 'source-over';
  } else octx.drawImage(src, 0, 0);
  // grain
  const r = rng(Math.floor(t * 1000) + 3);
  octx.globalAlpha = 0.09; octx.globalCompositeOperation = 'soft-light';
  const ox = -Math.floor(r() * 256), oy = -Math.floor(r() * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) octx.drawImage(noise, x, y);
  octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
}

/* ---------- live frame API ---------- */
const acc = document.createElement('canvas'); acc.width = W; acc.height = H;
const actx = acc.getContext('2d');
let curSim = 0;
function advanceTo(ts) {
  while (ts - curSim > 1e-6) { const dt = Math.min(1 / 60, ts - curSim); step(dt); curSim += dt; }
}
return {
  renderAt(t, sub) {
    t = Math.max(0, Math.min(DUR, t));
    for (let s = 0; s < sub; s++) {
      const ts = sub === 1 ? t : t - ((sub - 1 - s) / sub) * SHUTTER / FPS;
      if (ts > curSim) advanceTo(ts);
      renderScene(Math.max(0, ts));
      actx.globalAlpha = 1 / (s + 1);
      actx.drawImage(work, 0, 0);
    }
    actx.globalAlpha = 1;
    post(t, acc);
  },
  DUR,
};

}

(() => {
  const PLAY = '<path d="M13 8 L32 20 L13 32 Z" fill="#111"/>';
  const REPLAY = '<path d="M20 9a11 11 0 1 1-10.4 7.4" fill="none" stroke="#111" stroke-width="3.6" stroke-linecap="round"/><path d="M6 9 L10 17 L17 12 Z" fill="#111"/>';
  const btn = document.getElementById('btn'), icon = document.getElementById('icon');
  const audio = document.getElementById('score');
  icon.innerHTML = PLAY;

  let film = makeFilm();
  let playing = false, startClock = 0, useAudio = true, sub = 3, slow = 0, fast = 0;
  // poster: the closing shot
  film.renderAt(14.9, 1);

  function start() {
    film = makeFilm();
    playing = true;
    btn.classList.add('hide');
    audio.currentTime = 0;
    startClock = performance.now();
    useAudio = true;
    audio.play().catch(() => { useAudio = false; });
    requestAnimationFrame(tick);
  }
  function now() {
    if (useAudio && !audio.paused && audio.currentTime > 0) return audio.currentTime;
    return (performance.now() - startClock) / 1000;
  }
  function tick() {
    if (!playing) return;
    const t = now();
    const t0 = performance.now();
    film.renderAt(t, sub);
    const cost = performance.now() - t0;
    // adapt motion-blur samples to the device
    if (cost > 24) { slow++; fast = 0; if (slow > 4 && sub > 1) { sub--; slow = 0; } }
    else if (cost < 9) { fast++; slow = 0; if (fast > 30 && sub < 4) { sub++; fast = 0; } }
    if (t >= film.DUR) {
      playing = false;
      film.renderAt(film.DUR, sub);
      icon.innerHTML = REPLAY;
      btn.setAttribute('aria-label', 'Replay');
      btn.classList.remove('hide');
      return;
    }
    requestAnimationFrame(tick);
  }
  btn.addEventListener('click', start);
  document.getElementById('film').addEventListener('click', () => { if (!playing) start(); });
  document.addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'Enter') && !playing) { e.preventDefault(); start(); } });
})();
</script>
